  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',sans-serif;background-color:#f8f8f8;background-image:repeating-linear-gradient(-52deg,transparent,transparent 38px,rgba(160,160,160,0.055) 38px,rgba(160,160,160,0.055) 39px);color:#1a1a2e;}
    nav{display:flex;justify-content:space-between;align-items:center;padding:16px 60px;background:#ffffff;border-bottom:1px solid rgba(0,0,0,0.08);position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,0.06);}
    .logo{font-size:22px;font-weight:800;background:linear-gradient(90deg,#64c8ff,#b464ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
    .nav-back{color:#c8d2dc;text-decoration:none;font-size:13px;}
    .hero{text-align:center;padding:50px 20px 24px;background:radial-gradient(ellipse at top,#1a1a4a 0%,#0a0a1e 70%);}
    .hero h1{font-size:38px;font-weight:900;margin-bottom:8px;}
    .hero h1 span{background:linear-gradient(90deg,#64c8ff,#b464ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .hero p{color:#8899aa;font-size:14px;}

    /* STEPS */
    .steps{display:flex;justify-content:center;margin:24px auto;max-width:700px;}
    .step{flex:1;text-align:center;position:relative;}
    .step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin:0 auto 5px;border:2px solid #1e2a5a;background:#0d0d2b;color:#8899aa;transition:all 0.3s;}
    .step-label{font-size:10px;color:#5f5a6b;font-weight:600;}   /* was #8899aa — unreadable on the light page */
    .step.active .step-num{background:linear-gradient(135deg,#64c8ff,#b464ff);border-color:transparent;color:#0a0a1e;}
    .step.active .step-label{color:#64c8ff;}
    .step.done .step-num{background:#64c8ff;border-color:transparent;color:#0a0a1e;}
    .step::after{content:'';position:absolute;top:17px;left:50%;width:100%;height:2px;background:#1e2a5a;z-index:-1;}
    .step:last-child::after{display:none;}

    /* SECTIONS */
    .section{display:none;padding:36px 60px;}
    .section.active{display:block;}
    .sec-title{font-family:'Instrument Serif',serif;font-weight:400;font-size:29px;line-height:1.15;color:#1a1a2e;text-align:center;margin-bottom:6px;}
    .sec-sub{color:#5f5a6b;font-size:13.5px;text-align:center;margin-bottom:30px;}   /* was #8899aa — too pale on the light page */

    /* ═══════════════════════════════════════════════════════════════════
       CARDS — 24 Aug 2026
       These were dark navy (#0d0d2b) left over from when this page had a
       dark body. The body is light now, and the card titles had no colour
       of their own, so they inherited the dark body colour and became
       near-invisible on the dark card. Rebuilt in the same journal card
       style the CV/career section uses: bone paper, hairline inset border,
       Instrument Serif titles, square corners, lift on hover.
       Every text colour below is now explicit — nothing inherits.
       ═══════════════════════════════════════════════════════════════════ */
    .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:700px;margin:0 auto;}
    .type-card{position:relative;background:#f2eee5;border:1px solid #d9d4c7;border-radius:0;padding:34px 30px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:center;}
    .type-card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(0,0,0,.08);pointer-events:none;}
    .type-card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.13);}
    .type-icon{font-size:46px;margin-bottom:14px;position:relative;}
    .type-name{font-family:'Instrument Serif',serif;font-weight:400;font-size:24px;line-height:1.2;color:#1a1a2e;margin-bottom:8px;position:relative;}
    .type-desc{font-size:13px;color:#4d4857;line-height:1.6;position:relative;}

    /* INDUSTRY GRID */
    .industry-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1000px;margin:0 auto;}
    .industry-card{position:relative;background:#f2eee5;border:1px solid #d9d4c7;border-radius:0;padding:20px 16px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:center;}
    .industry-card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(0,0,0,.08);pointer-events:none;}
    .industry-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12);}
    .industry-icon{font-size:30px;margin-bottom:10px;position:relative;}
    .industry-name{font-family:'Instrument Serif',serif;font-weight:400;font-size:17px;line-height:1.2;color:#1a1a2e;margin-bottom:4px;position:relative;}
    .industry-desc{font-size:11.5px;color:#4d4857;position:relative;}

    /* STYLE GRID */
    .style-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1100px;margin:0 auto;}
    .style-card{background:#f2eee5;border:1px solid #d9d4c7;border-radius:0;cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:hidden;}
    .style-card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.13);}
    .style-thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;}
    .style-thumb.blue{background:linear-gradient(135deg,#1a3a6b,#2a5aab);}
    .style-thumb.dark{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);}
    .style-thumb.minimal{background:linear-gradient(135deg,#f0f0f0,#e0e0e0);}
    .style-thumb.green{background:linear-gradient(135deg,#0d3b2e,#1a6b4a);}
    .style-thumb.purple{background:linear-gradient(135deg,#2a1a4a,#5a2a9a);}
    .style-thumb.red{background:linear-gradient(135deg,#3b1a1a,#8b2020);}
    .style-thumb.orange{background:linear-gradient(135deg,#3b2a0a,#c47820);}
    .style-thumb.teal{background:linear-gradient(135deg,#0a2a3b,#1a7a8b);}
    .style-thumb.bw{background:linear-gradient(135deg,#fff,#e8e8e8);}
    .style-thumb.beige{background:linear-gradient(135deg,#2a1f14,#8a6040);}
    .style-thumb.bold{background:linear-gradient(135deg,#1a1a1a,#333);}
    .style-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.5);color:#fff;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:600;}
    .style-info{padding:13px 15px;border-top:1px solid rgba(0,0,0,.08);}
    .style-name{font-family:'Instrument Serif',serif;font-weight:400;font-size:17px;line-height:1.2;color:#1a1a2e;margin-bottom:3px;}
    .style-desc{font-size:11px;color:#4d4857;}
    /* Footer strip on each style card — replaces the blue/purple gradient pill.
       Label on the left, LazyDog roundel on the right, same as the journal
       cards. The logo is a ::after background so the 11 hard-coded cards in
       the markup did not each need an <img> added. */
    .btn-select{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:0;
      background:#faf7f0;border:0;border-top:1px solid #e2dccd;color:#1a1a2e;padding:11px 14px;border-radius:0;
      font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      cursor:pointer;transition:background .18s,color .18s;}
    .btn-select::after{content:"";flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:1px solid #d9d4c7;
      background:url("images/site_logo_round.png") center/cover no-repeat;}
    .style-card:hover .btn-select{background:#07071a;color:#fff;}

    /* FORM */
    .form-wrap{display:grid;grid-template-columns:1fr 360px;gap:36px;max-width:1100px;margin:0 auto;}
    .right-col{display:block;}
    .cust-card{position:sticky;top:80px;background:#fff;border:1px solid #d9d4c7;border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,0.06);margin-top:16px;}
    .cust-card h3{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;color:#5f5a6b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;}
    .cust-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;color:#3a3a4a;}
    .cust-row label{font-weight:600;}
    .cust-row input[type=color]{width:44px;height:28px;border:1px solid #ccc;border-radius:6px;background:none;cursor:pointer;padding:0;}
    .cust-row select{padding:6px 8px;border:1px solid #ccc;border-radius:6px;font-size:12px;}
    .cust-logo-btn{display:block;width:100%;padding:9px;border:1px dashed #b8b2a4;border-radius:8px;background:#faf8f3;color:#5f5a6b;font-size:12px;font-weight:600;text-align:center;cursor:pointer;margin-bottom:14px;}
    .cust-reset{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#888;font-size:12px;cursor:pointer;margin-top:4px;}
    /* Step 4 panel — brought onto the same bone paper as the cards above.
       It was the last dark-navy block on a light page. */
    .form-panel{position:relative;background:#f2eee5;border:1px solid #d9d4c7;border-radius:0;padding:30px 32px;}
    .form-panel::before{content:"";position:absolute;inset:10px;border:1px solid rgba(0,0,0,.08);pointer-events:none;}
    .form-panel > *{position:relative;}
    .form-panel h2{font-family:'Instrument Serif',serif;font-size:25px;font-weight:400;color:#1a1a2e;margin-bottom:18px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
    .fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
    .fg label{font-size:10px;color:#5f5a6b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
    .fg input,.fg textarea,.fg select{background:#fff;border:1px solid #d9d4c7;border-radius:0;color:#1a1a2e;padding:9px 11px;font-size:13px;outline:none;transition:border 0.2s;}
    .fg input:focus,.fg textarea:focus{border-color:#7c5cbf;}
    .fg textarea{resize:vertical;min-height:55px;}
    .sec-label{font-family:'Poppins',sans-serif;font-size:10px;font-weight:700;color:#b8442a;text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
    .sec-label::after{content:'';flex:1;height:1px;background:#d9d4c7;}
    .items-hdr{display:grid;gap:5px;font-size:9px;color:#5f5a6b;font-weight:700;text-transform:uppercase;padding:0 0 5px;border-bottom:1px solid #d9d4c7;margin-bottom:6px;}
    .item-row{display:grid;gap:5px;margin-bottom:5px;align-items:center;}
    .item-row input{background:#fff;border:1px solid #d9d4c7;border-radius:0;color:#1a1a2e;padding:7px 8px;font-size:11px;outline:none;width:100%;}
    .item-row input:focus{border-color:#7c5cbf;}
    .item-total-cell{font-size:11px;font-weight:700;color:#1a1a2e;text-align:right;}
    .btn-remove-item{background:none;border:none;color:#b8442a;font-size:14px;cursor:pointer;}
    .btn-add-item{background:transparent;border:1px dashed #c9c2b2;color:#5f5a6b;padding:8px;border-radius:0;width:100%;cursor:pointer;font-size:11px;margin-top:3px;transition:all 0.2s;}
    .btn-add-item:hover{border-color:#7c5cbf;color:#7c5cbf;}
    .totals-box{background:#faf7f0;border:1px solid #e2dccd;border-radius:0;padding:15px;margin-top:16px;}
    .tot-row{display:flex;justify-content:space-between;font-size:12.5px;color:#4d4857;margin-bottom:7px;align-items:center;}
    .tot-row input{width:55px;background:#fff;border:1px solid #d9d4c7;border-radius:0;color:#1a1a2e;padding:4px 7px;font-size:11px;outline:none;}
    .tot-row.grand{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;color:#1a1a2e;border-top:1px solid #d9d4c7;padding-top:10px;margin-top:4px;}
    .tot-row.grand span:last-child{color:#1a1a2e;}
    .btn-generate{width:100%;background:#07071a;color:#fff;padding:14px;border-radius:0;border:none;font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:20px;}
    .btn-generate:hover{background:#161642;}
    .btn-back{background:transparent;border:1px solid #d9d4c7;color:#5f5a6b;padding:8px 20px;border-radius:0;cursor:pointer;font-size:12px;margin-bottom:16px;transition:all 0.2s;}
    .btn-back:hover{border-color:#7c5cbf;color:#7c5cbf;}
    .mini-preview{position:sticky;top:80px;}
    .mini-preview h3{font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;color:#5f5a6b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
    .dl-section{margin-top:10px;}
    .btn-dl{background:linear-gradient(90deg,#64c8ff,#b464ff);color:#0a0a1e;padding:11px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;width:100%;}
    .wm-note{font-size:10px;color:#8899aa;text-align:center;margin-top:5px;}

    @media(max-width:900px){.style-grid,.industry-grid{grid-template-columns:repeat(2,1fr);}.type-grid{grid-template-columns:1fr;}.form-wrap{grid-template-columns:1fr;}.section{padding:24px 20px;}}
  </style>

<div class="section" id="sec2">
  <div class="form-wrap">
    <div>
      <div class="form-panel">
        <h2 id="formTitle">📝 Invoice Details</h2>
        <div id="dynamicFields"></div>
        <div class="sec-label">Invoice Info</div>
        <div class="form-row">
          <div class="fg"><label>Invoice Number</label><input id="invNum" type="text" value="INV-001" oninput="liveUpdate()"/></div>
          <div class="fg"><label>Currency</label>
            <select id="currency" onchange="liveUpdate()">
              <option value="$">USD ($)</option><option value="€">EUR (€)</option>
              <option value="£">GBP (£)</option><option value="PKR ">PKR</option><option value="AED ">AED</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="fg"><label>Invoice Date</label><input id="invDate" type="date" oninput="liveUpdate()"/></div>
          <div class="fg"><label>Due Date</label><input id="dueDate" type="date" oninput="liveUpdate()"/></div>
        </div>
        <div class="sec-label">Items</div>
        <div class="items-hdr" id="itemsHdr"></div>
        <div id="itemsList"></div>
        <button class="btn-add-item" onclick="addItem()">+ Add Item</button>
        <div class="totals-box">
          <div class="tot-row"><span>Subtotal</span><span id="subtotalDisp">$0.00</span></div>
          <div class="tot-row"><span>Tax %</span><input id="taxRate" type="number" value="0" min="0" max="100" oninput="liveUpdate()"/><span id="taxDisp">$0.00</span></div>
          <div class="tot-row grand"><span>TOTAL DUE</span><span id="grandDisp">$0.00</span></div>
        </div>
        <div class="fg" style="margin-top:14px;"><label>Notes</label><textarea id="notes" placeholder="Payment terms, bank details..." oninput="liveUpdate()"></textarea></div>
      </div>
    </div>
    <div class="right-col">
      <button class="btn-back" onclick="goTo(1)">← Change Style</button>
      <button class="btn-generate" onclick="downloadInvoice()">⚡ Download Invoice — FREE</button>
      <div class="cust-card">
        <h3>🎨 Customize</h3>
        <button class="cust-logo-btn" onclick="document.getElementById('logoInput').click()">⬆ Upload Logo</button>
        <input id="logoInput" type="file" accept="image/*" style="display:none" onchange="uploadLogo(this)"/>
        <div class="cust-row"><label>Main colour</label><input type="color" id="cstPrimary" oninput="setCust('primary',this.value)"/></div>
        <div class="cust-row"><label>Strip colour</label><input type="color" id="cstStrip" oninput="setCust('strip',this.value)"/></div>
        <div class="cust-row"><label>Accent colour</label><input type="color" id="cstAccent" oninput="setCust('accent',this.value)"/></div>
        <div class="cust-row"><label>Text colour</label><input type="color" id="cstText" oninput="setCust('text',this.value)"/></div>
        <div class="cust-row"><label>Font</label>
          <select id="cstFont" onchange="setCust('font',this.value)">
            <option value="'Segoe UI',sans-serif">Segoe UI</option>
            <option value="'Poppins',sans-serif">Poppins</option>
            <option value="Georgia,serif">Georgia</option>
            <option value="'Courier New',monospace">Courier</option>
            <option value="Arial,sans-serif">Arial</option>
            <option value="'Times New Roman',serif">Times</option>
          </select>
        </div>
        <button class="cust-reset" onclick="resetCust()">↺ Reset to style default</button>
        <p class="wm-note" id="wmNote" style="font-size:11px;color:#2a9d5a;margin-top:12px;text-align:center;"></p>
      </div>
    </div>
  </div>
</div>

  // ── CUSTOMIZE ENGINE ──
  function effColors(){
    const base = COLORS[selectedStyle]||COLORS.blue;
    return {
      bg: settings.primary||base.bg,
      accent: settings.accent||base.accent,
      light: settings.strip||base.light,
      bodyBg: base.bodyBg,
      text: settings.text||base.text,
      th: settings.primary||base.th,
      thText: base.thText,
      border: base.border,
      font: settings.font||"'Segoe UI',sans-serif"
    };
  }
  function hex6(x){ if(!x)return null; if(/^#([0-9a-f]{3})$/i.test(x)){return '#'+x[1]+x[1]+x[2]+x[2]+x[3]+x[3];} return x; }
  function initCustomize(){
    const base = COLORS[selectedStyle]||COLORS.blue;
    settings = { primary:null, strip:null, accent:null, text:null, font:null, logo:null };
    const set=(id,val)=>{const el=document.getElementById(id); if(el&&val)el.value=hex6(val);};
    set('cstPrimary',base.bg); set('cstStrip',base.light); set('cstAccent',base.accent); set('cstText',base.text);
    const F=document.getElementById('cstFont'); if(F)F.value="'Segoe UI',sans-serif";
  }
  function setCust(k,val){
    settings[k]=val;
    liveUpdate();
  }
  function uploadLogo(inp){
    const f=inp.files&&inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=e=>{ settings.logo=e.target.result; liveUpdate(); };
    r.readAsDataURL(f);
  }
  function resetCust(){ settings.logo=null; initCustomize(); liveUpdate(); }

  // ── NAVIGATION ──
  function navBack(){
    var active = document.querySelector('.section.active');
    if(!active || active.id === 'sec1') { window.location.href='index.html'; return; }
    goTo(1);
  }

  function goTo(n, fromPopState){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec'+n).classList.add('active');
    for(let i=1;i<=2;i++){
      const s=document.getElementById('step'+i);
      s.classList.remove('active','done');
      if(i<n) s.classList.add('done');
      if(i===n) s.classList.add('active');
    }
    window.scrollTo({top:0,behavior:'smooth'});
    if(!fromPopState) history.pushState({step:n}, '', '#step'+n);
  }

  window.addEventListener('popstate', function(e){
    if(e.state && e.state.step) goTo(e.state.step, true);
    else goTo(1, true);
  });

  function selectStyle(style){
    selectedStyle = style;
    buildForm();
    initCustomize();
    goTo(2);
    document.getElementById('invDate').value = today;
    document.getElementById('dueDate').value = due14.toISOString().split('T')[0];
    liveUpdate();
  }

  // ── FORM BUILDER ──
  function buildForm(){
    const cfg = INDUSTRIES[selectedIndustry];
    document.getElementById('formTitle').textContent = cfg.title;
    // Dynamic from/to fields
    let html = `<div class="sec-label">Your Details</div>`;
    html += `<div class="form-row">`;
    cfg.from.forEach((lbl,i)=>{
      html+=`<div class="fg"><label>${lbl}</label><input id="from_${i}" type="text" placeholder="${lbl}" oninput="liveUpdate()"/></div>`;
      if(i%2===1) html+=`</div><div class="form-row">`;
    });
    html+=`</div>`;
    html+=`<div class="sec-label">Client Details</div><div class="form-row">`;
    cfg.to.forEach((lbl,i)=>{
      html+=`<div class="fg"><label>${lbl}</label><input id="to_${i}" type="text" placeholder="${lbl}" oninput="liveUpdate()"/></div>`;
      if(i%2===1) html+=`</div><div class="form-row">`;
    });
    html+=`</div>`;
    document.getElementById('dynamicFields').innerHTML=html;
    // Items header
    document.getElementById('itemsHdr').style.gridTemplateColumns=`2.5fr 1fr 1fr 1fr 28px`;
    document.getElementById('itemsHdr').innerHTML=cfg.cols.map(c=>`<span>${c}</span>`).join('')+`<span>Total</span><span></span>`;
    // Reset items
    items=[{...cfg.defaultItem,qty:1,rate:0}];
    renderItems();
  }

  function getFromTo(){
    const cfg=INDUSTRIES[selectedIndustry];
    const from=cfg.from.map((_,i)=>document.getElementById('from_'+i)?.value||'').filter(Boolean);
    const to=cfg.to.map((_,i)=>document.getElementById('to_'+i)?.value||'').filter(Boolean);
    return {from,to};
  }

  function addItem(){
    const cfg=INDUSTRIES[selectedIndustry];
    items.push({...cfg.defaultItem,qty:1,rate:0});
    renderItems(); liveUpdate();
  }
  function removeItem(i){ if(items.length>1){items.splice(i,1);renderItems();liveUpdate();} }

  function renderItems(){
    const cur=document.getElementById('currency')?.value||'$';
    const el=document.getElementById('itemsList'); if(!el)return;
    el.innerHTML='';
    items.forEach((item,i)=>{
      const t=((parseFloat(item.qty)||0)*(parseFloat(item.rate)||0)).toFixed(2);
      const row=document.createElement('div');
      row.className='item-row';
      row.style.gridTemplateColumns='2.5fr 1fr 1fr 1fr 28px';
      row.innerHTML=`<input type="text" placeholder="Description" value="${item.c1||''}" oninput="items[${i}].c1=this.value;liveUpdate()"/>
        <input type="text" placeholder="${INDUSTRIES[selectedIndustry].cols[1]}" value="${item.c2||''}" oninput="items[${i}].c2=this.value;liveUpdate()"/>
        <input type="number" placeholder="0.00" value="${item.rate||0}" min="0" step="0.01" oninput="items[${i}].rate=this.value;liveUpdate()"/>
        <div class="item-total-cell">${cur}${t}</div>
        <button class="btn-remove-item" onclick="removeItem(${i})" aria-label="Remove item">✕</button>`;
      el.appendChild(row);
    });
  }

  function getValues(){
    const cur=document.getElementById('currency')?.value||'$';
    const sub=items.reduce((s,it)=>s+(parseFloat(it.c2)||parseFloat(it.qty)||0)*(parseFloat(it.rate)||0),0);
    // For non-qty industries, use c2 as qty where numeric, else 1
    const realSub=items.reduce((s,it)=>{
      const q=parseFloat(it.c2)||1;
      const r=parseFloat(it.rate)||0;
      return s+q*r;
    },0);
    const tax=realSub*(parseFloat(document.getElementById('taxRate')?.value)||0)/100;
    const ft=getFromTo();
    return {cur,sub:realSub,tax,grand:realSub+tax,
      fromName:ft.from[0]||'Your Business',fromDetails:ft.from.slice(1).join(' | '),
      toName:ft.to[0]||'Client',toDetails:ft.to.slice(1).join(' | '),
      invNum:document.getElementById('invNum')?.value||'INV-001',
      invDate:document.getElementById('invDate')?.value||today,
      dueDate:document.getElementById('dueDate')?.value||'',
      notes:document.getElementById('notes')?.value||''
    };
  }

  function liveUpdate(){
    const v=getValues();
    if(document.getElementById('subtotalDisp')) document.getElementById('subtotalDisp').textContent=v.cur+v.sub.toFixed(2);
    if(document.getElementById('taxDisp')) document.getElementById('taxDisp').textContent=v.cur+v.tax.toFixed(2);
    if(document.getElementById('grandDisp')) document.getElementById('grandDisp').textContent=v.cur+v.grand.toFixed(2);
    renderItems();
    updateMiniPreview(v);
  }

  function updateMiniPreview(v){
    const el=document.getElementById('miniPreviewBox'); if(!el)return;
    const c=COLORS[selectedStyle]||COLORS.blue;
    const rows=items.map(it=>{const q=parseFloat(it.c2)||1;const r=parseFloat(it.rate)||0;const t=(q*r).toFixed(2);return `<tr><td style="padding:3px 5px;font-size:8px;border-bottom:1px solid #eee;">${it.c1||'—'}</td><td style="padding:3px 5px;font-size:8px;text-align:center;">${it.c2||1}</td><td style="padding:3px 5px;font-size:8px;text-align:right;">${v.cur}${r.toFixed(2)}</td><td style="padding:3px 5px;font-size:8px;text-align:right;font-weight:700;">${v.cur}${t}</td></tr>`;}).join('');
    const wm=((typeof WATERMARK_ON!=='undefined')&&WATERMARK_ON)?`<div style="text-align:center;font-size:7px;color:#ccc;margin-top:5px;opacity:0.5;">LazyDogTemplates.com</div>`:'';
    el.innerHTML=`
      <div style="background:${c.bg};color:#fff;padding:8px 12px;display:flex;justify-content:space-between;margin:-14px -14px 8px;border-radius:10px 10px 0 0;">
        <div style="font-size:10px;font-weight:800;">${v.fromName}</div>
        <div style="font-size:11px;font-weight:900;letter-spacing:1px;">INVOICE</div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:8px;color:#333;">
        <div><b>From:</b> ${v.fromName}</div>
        <div style="text-align:right;"><b>To:</b> ${v.toName}<br/>${v.invNum}</div>
      </div>
      <table style="width:100%;border-collapse:collapse;margin-bottom:5px;">
        <thead><tr style="background:${c.th};"><th style="padding:3px 5px;font-size:7px;color:${c.thText};text-align:left;">Item</th><th style="padding:3px 5px;font-size:7px;color:${c.thText};text-align:center;">Qty</th><th style="padding:3px 5px;font-size:7px;color:${c.thText};text-align:right;">Rate</th><th style="padding:3px 5px;font-size:7px;color:${c.thText};text-align:right;">Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="text-align:right;font-size:8px;"><b>Total: <span style="color:${c.accent};font-size:10px;">${v.cur}${v.grand.toFixed(2)}</span></b></div>
      ${wm}`;
  }

  function buildInvoiceHTML(v){
    const c=effColors();
    const logoHtml = settings.logo?`<img src="${settings.logo}" style="max-height:48px;display:block;margin-bottom:6px;"/>`:'';
    /* 24 Aug 2026 — watermark removed for good.
       This line used to read `?WATERMARK_ON:true`, so with the flag undefined
       (watermark.js was deleted back in July) it defaulted to ON — which is
       why every downloaded invoice still carried a giant diagonal
       "LazyDogTemplates" across it, while the note on the page promised a
       clean download. The generator is free and its output is the customer's.
       Note line ~600 already defaulted the same flag to OFF; the two
       disagreed. */
    const wm='';
    const footer=`<div style="background:${c.bg};color:rgba(255,255,255,0.5);text-align:center;padding:12px;font-size:11px;">LazyDogTemplates.com — Free Invoice Generator</div>`;
    const cfg=INDUSTRIES[selectedIndustry];
    const itemRows=items.map(it=>{const q=parseFloat(it.c2)||1;const r=parseFloat(it.rate)||0;const t=(q*r).toFixed(2);return `<tr><td style="padding:11px 14px;border-bottom:1px solid ${c.border};font-size:13px;color:${c.text};">${it.c1||''}</td><td style="padding:11px 14px;border-bottom:1px solid ${c.border};font-size:13px;text-align:center;color:${c.text};">${it.c2||1}</td><td style="padding:11px 14px;border-bottom:1px solid ${c.border};font-size:13px;text-align:center;color:${c.text};">${v.cur}${r.toFixed(2)}</td><td style="padding:11px 14px;border-bottom:1px solid ${c.border};font-size:13px;text-align:right;font-weight:700;color:${c.text};">${v.cur}${t}</td></tr>`;}).join('');
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Invoice ${v.invNum}</title></head>
<body style="margin:0;padding:0;font-family:${c.font};background:#f0f4f8;">
${wm}
<div style="max-width:800px;margin:30px auto;background:${c.bodyBg};box-shadow:0 4px 30px rgba(0,0,0,0.12);">
  <div style="background:${c.bg};color:#fff;padding:36px 50px;display:flex;justify-content:space-between;align-items:center;">
    <div>${logoHtml}<div style="font-size:22px;font-weight:900;">${v.fromName}</div><div style="font-size:11px;opacity:0.7;margin-top:4px;">${v.fromDetails}</div></div>
    <div style="text-align:right;"><div style="font-size:28px;font-weight:900;letter-spacing:3px;">INVOICE</div><div style="font-size:12px;opacity:0.7;margin-top:4px;">${v.invNum}</div></div>
  </div>
  <div style="background:${c.light};padding:14px 50px;display:flex;justify-content:space-between;border-bottom:2px solid ${c.bg};">
    <div><div style="font-size:10px;font-weight:700;color:${c.accent};text-transform:uppercase;">Date</div><div style="font-size:13px;font-weight:700;margin-top:2px;color:${c.text};">${v.invDate}</div></div>
    <div><div style="font-size:10px;font-weight:700;color:${c.accent};text-transform:uppercase;">Due Date</div><div style="font-size:13px;font-weight:700;margin-top:2px;color:${c.text};">${v.dueDate}</div></div>
    <div><div style="font-size:10px;font-weight:700;color:${c.accent};text-transform:uppercase;">Invoice #</div><div style="font-size:13px;font-weight:700;margin-top:2px;color:${c.text};">${v.invNum}</div></div>
  </div>
  <div style="padding:34px 50px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-bottom:32px;">
      <div><div style="font-size:10px;font-weight:700;color:${c.accent};text-transform:uppercase;border-bottom:2px solid ${c.bg};padding-bottom:5px;margin-bottom:8px;">${cfg.from[0]||'From'}</div><div style="font-size:13px;line-height:1.8;color:${c.text};"><strong>${v.fromName}</strong><br/>${v.fromDetails}</div></div>
      <div><div style="font-size:10px;font-weight:700;color:${c.accent};text-transform:uppercase;border-bottom:2px solid ${c.bg};padding-bottom:5px;margin-bottom:8px;">${cfg.to[0]||'Bill To'}</div><div style="font-size:13px;line-height:1.8;color:${c.text};"><strong>${v.toName}</strong><br/>${v.toDetails}</div></div>
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:28px;">
      <thead><tr style="background:${c.th};">${cfg.cols.map(col=>`<th style="padding:10px 14px;font-size:10px;color:${c.thText};text-transform:uppercase;text-align:left;">${col}</th>`).join('')}<th style="padding:10px 14px;font-size:10px;color:${c.thText};text-transform:uppercase;text-align:right;">Total</th></tr></thead>
      <tbody>${itemRows}</tbody>
    </table>
    <div style="display:flex;justify-content:flex-end;margin-bottom:26px;">
      <div style="width:230px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid ${c.border};color:${c.text};"><span>Subtotal</span><span>${v.cur}${v.sub.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid ${c.border};color:${c.text};"><span>Tax</span><span>${v.cur}${v.tax.toFixed(2)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding:11px 14px;background:${c.bg};color:#fff;margin-top:2px;"><span>Total Due</span><span>${v.cur}${v.grand.toFixed(2)}</span></div>
      </div>
    </div>
    ${v.notes?`<div style="background:${c.light};border-left:4px solid ${c.accent};padding:12px 16px;font-size:12px;line-height:1.7;color:${c.text};">${v.notes}</div>`:''}
  </div>
  ${footer}
</div></body></html>`;
  }

  function downloadInvoice(){
    /* 4 Sep 2026 — invoice download now requires sign-in.
       ldSignedIn()/openAuth() come from navbar.js, loaded at the bottom of
       this page; by the time someone has filled the form and clicked
       Download that script has long since run. */
    if (typeof window.ldSignedIn === 'function' && !window.ldSignedIn()) {
      alert('Please sign in first to download your invoice — it only takes a moment.');
      if (typeof window.openAuth === 'function') { try { window.openAuth('signin'); } catch(e){} }
      return;
    }
    const v=getValues();
    const html=buildInvoiceHTML(v);
    /* 29 Jul 2026: window.open() returns null when a popup blocker is active,
       and blockers fire on exactly this pattern — a new window opened with no
       URL. The next line then threw on null, the error went to a console no
       visitor ever opens, and the button simply appeared to do nothing. On the
       free tool that brings people to the site. */
    const w=window.open('','_blank');
    if(!w){
      alert('Your browser blocked the invoice window.\n\n' +
            'Allow pop-ups for lazydogtemplates.com, then press Download again.');
      return;
    }
    try{
      w.document.write(html);
      w.document.close();
      setTimeout(()=>{ try{ w.print(); }catch(e){} },800);
    }catch(e){
      alert('Could not build the invoice. Please try again, or use a different browser.');
    }
  }

  // Set watermark note
  window.addEventListener('load',()=>{
    const n=document.getElementById('wmNote');
    if(n) n.textContent=(typeof WATERMARK_ON!=='undefined'&&WATERMARK_ON)?'* Includes LazyDogTemplates branding':'✅ Clean download — no watermark';
  });
</script>
