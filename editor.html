<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untitled design - Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<!-- Variable icon font: the wght axis (100–700) is what makes real
     stroke-width control possible on inserted icons. -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/utif/3.1.0/UTIF.min.js"></script>
<script src="lazydog_renderer.js?v=scissor2"></script>
<style>
/* ============================================
   1. Custom Properties & Reset
   ============================================ */
:root {
  --accent: #7C3AED;
  --accent-hover: #6D28D9;
  --accent-light: #EDE9FE;
  --accent-subtle: #F5F3FF;
  --upgrade: #E8590C;
  --upgrade-hover: #C2410C;
  --bg-canvas: #E4E4E7;
  --bg-surface: #FFFFFF;
  --bg-hover: #F4F4F5;
  --bg-active: #E4E4E7;
  --text-primary: #0F172A;
  --text-secondary: #64748B;
  --text-muted: #94A3B8;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --sidebar-w: 72px;
  --panel-w: 324px;
  --header-h: 56px;
  --bottom-h: 60px;
  --font: 'DM Sans', system-ui, sans-serif;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --fast: 150ms var(--ease);
  --normal: 250ms var(--ease);
  --slow: 350ms var(--ease);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: var(--font);
  color: var(--text-primary);
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ============================================
   2. Layout Shell
   ============================================ */
/* .header removed — the ribbon top line replaced it (see .ribbon-top). */
.workspace {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}
.bottom-bar {
  height: var(--bottom-h);
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  flex-shrink: 0;
  z-index: 100;
  gap: 8px;
}

/* ============================================
   3. Header Components
   ============================================ */

.btn-icon {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  transition: background var(--fast);
  position: relative;
}
.btn-icon:hover { background: var(--bg-hover); }
.btn-icon:active { background: var(--bg-active); }
.btn-icon .material-icons-outlined { font-size: 22px; }
.btn-icon.disabled { opacity: 0.4; pointer-events: none; }

.mode-tabs {
  display: flex;
  background: var(--bg-hover);
  border-radius: var(--radius-full);
  padding: 3px;
  gap: 2px;
}
.mode-tab {
  padding: 5px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--fast);
  white-space: nowrap;
}
.mode-tab:hover { color: var(--text-primary); }
.mode-tab.active {
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

.doc-title {
  font-size: 14px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: all var(--fast);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.doc-title:hover { border-color: var(--border); }
.doc-title:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--accent-subtle);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.doc-type { font-size:14px; color:var(--text-muted); white-space:nowrap; }

.btn-upgrade {
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--upgrade);
  border-radius: var(--radius-full);
  transition: all var(--fast);
  white-space: nowrap;
}
.btn-upgrade:hover { background: #FFF7ED; }

.btn-outline {
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius-full);
  transition: all var(--fast);
  white-space: nowrap;
}
.btn-outline:hover { background: var(--bg-hover); border-color: var(--text-muted); }
.btn-outline:active { background: var(--bg-active); }

.btn-primary {
  padding: 7px 20px;
  font-size: 13px;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-full);
  transition: all var(--fast);
  white-space: nowrap;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { transform: scale(0.97); }

/* Dropdown Menu */
.dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  min-width: 200px;
  padding: 6px;
  z-index: 200;
  opacity: 0;
  transform: translateY(-8px) scale(0.96);
  pointer-events: none;
  transition: all var(--normal);
}
.dropdown.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--text-primary);
  transition: background var(--fast);
  width: 100%;
  text-align: left;
}
.dropdown-item:hover { background: var(--bg-hover); }
.dropdown-item .material-icons-outlined { font-size: 18px; color: var(--text-secondary); }
.dropdown-sep { height:1px; background:var(--border); margin:4px 8px; }

/* ============================================
   4. Sidebar
   ============================================ */
.sidebar {
  display: flex;
  flex-shrink: 0;
  z-index: 50;
  height: 100%;
}
.sidebar-rail {
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 8px 0;
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;
}
/* (scrollbar styled in the layout-polish block below — the rail is scrollable) */

.tool-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 6px;
  gap: 3px;
  width: 100%;
  border-radius: 0;
  transition: all var(--fast);
  position: relative;
  flex-shrink: 0;
}
.tool-btn::after {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%) scaleY(0);
  width: 3px; height: 24px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
  transition: transform var(--fast);
}
.tool-btn:hover { background: var(--bg-hover); }
.tool-btn.active { background: var(--accent-subtle); color: var(--accent); }
.tool-btn.active::after { transform: translateY(-50%) scaleY(1); }
.tool-btn .material-icons-outlined { font-size: 22px; transition: color var(--fast); }
.tool-btn .tool-label { font-size: 10px; font-weight: 500; line-height: 1; white-space: nowrap; }

/* ============================================
   5. Side Panel
   ============================================ */
.side-panel {
  width: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
  transition: width var(--normal);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.side-panel.open { width: var(--panel-w); }

.panel-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.panel-title { font-size: 15px; font-weight: 700; }
.panel-close {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: background var(--fast);
}
.panel-close:hover { background: var(--bg-hover); }
.panel-close .material-icons-outlined { font-size: 18px; }

.panel-search {
  padding: 10px 16px;
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 13px;
  background: var(--bg-surface);
  transition: all var(--fast);
  position: relative;
}
.search-input:focus { outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.search-wrap { position:relative; }
.search-wrap .material-icons-outlined {
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  font-size:16px; color:var(--text-muted); pointer-events:none;
}

.panel-tabs {
  display: flex;
  flex-wrap: wrap;          /* wrap onto more rows so no label is ever half-cut */
  gap: 6px;
  padding: 0 16px 10px;
  flex-shrink: 0;
}
.panel-tabs::-webkit-scrollbar { height:0; }
.panel-tab {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  white-space: nowrap;
  transition: all var(--fast);
  flex-shrink: 0;
}
.panel-tab:hover { background: var(--bg-hover); }
.panel-tab.active { background: var(--accent); color: #fff; }

.panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
}

/* Template Cards */
.template-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.template-card {
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: all var(--fast);
  border: 2px solid transparent;
}
.template-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--accent-light); }
.template-card:active { transform: scale(0.97); }
.template-preview {
  width: 100%;
  aspect-ratio: 16/10;
  position: relative;
  overflow: hidden;
  background: #eef0f4 center/cover no-repeat;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.template-preview.loading::after {
  content: '';
  width: 22px; height: 22px;
  border: 3px solid rgba(0,0,0,0.12);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: tplspin .7s linear infinite;
}
@keyframes tplspin { to { transform: rotate(360deg); } }
.template-skeleton {
  background: linear-gradient(100deg, #edeff3 30%, #f6f7f9 50%, #edeff3 70%);
  background-size: 200% 100%;
  animation: tplshimmer 1.2s ease-in-out infinite;
}
@keyframes tplshimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.template-badge {
  position: absolute;
  bottom: 6px; right: 6px;
  background: rgba(0,0,0,0.62);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  letter-spacing: .3px;
}
.template-label {
  display: block;
  padding: 8px 6px 4px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--text-primary);
}
.tpl-line {
  position: absolute;
  border-radius: 2px;
}

/* Element Grid */
.element-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.element-card {
  aspect-ratio: 1;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--fast);
  background: #FAFAFA;
}
.element-card:hover { border-color: var(--accent); background: var(--accent-subtle); transform: scale(1.05); }
.element-card:active { transform: scale(0.95); }
.element-card svg { width:80%; height:80%; }

/* Text Options */
.text-option {
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--fast);
  margin-bottom: 8px;
}
.text-option:hover { border-color: var(--accent); background: var(--accent-subtle); }
.text-option:active { transform: scale(0.98); }
.text-option .text-preview { margin-bottom: 2px; }
.text-option .text-meta { font-size: 11px; color: var(--text-muted); }

/* Generic Panel Content */
.panel-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
  color: var(--text-secondary);
}
.panel-placeholder .material-icons-outlined { font-size: 48px; color: var(--text-muted); margin-bottom: 12px; }
.panel-placeholder p { font-size: 13px; line-height: 1.5; }

/* ============================================
   6. Canvas Area
   ============================================ */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle, #D4D4D8 0.8px, transparent 0.8px);
  background-size: 24px 24px;
  background-color: var(--bg-canvas);
}
.canvas-viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slide-frame {
  position: relative;
  display: inline-block;
  background: transparent;
  box-shadow: 0 2px 20px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
  border-radius: 2px;
  cursor: default;
  line-height: 0;
}
.slide-frame:hover { box-shadow: 0 4px 28px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.06); }
.slide-frame.selected {
  box-shadow: 0 0 0 2px var(--accent), 0 4px 28px rgba(0,0,0,0.14);
}

/* ============================================
   7. Bottom Bar
   ============================================ */
.bottom-left { display:none; } /* Notes/timer cluster hidden — it was covering the first slides */
.bottom-center { flex:1; display:flex; align-items:center; justify-content:flex-start; gap:8px; overflow-x:auto; min-width:0; padding:0 8px; scrollbar-width:thin; }
/* centred WHEN it fits, scrollable from slide 1 when it overflows
   (justify-content:center + overflow clips the left side unreachably) */
.bottom-center > :first-child { margin-left:auto; }
.bottom-center > :last-child { margin-right:auto; }
.bottom-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }

.btn-text-sm {
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  transition: all var(--fast);
  white-space: nowrap;
}
.btn-text-sm:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-text-sm.active { background: var(--accent-light); color: var(--accent); }

/* Timer */
.timer-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
}
.timer-display {
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  text-align: center;
  color: var(--text-secondary);
}
.timer-btn {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: background var(--fast);
}
.timer-btn:hover { background: var(--bg-hover); }
.timer-btn .material-icons-outlined { font-size: 16px; }

/* Page Thumbnails */
.page-thumb {
  width: 76px; height: 43px;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all var(--fast);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 600;
  position: relative;
  overflow: hidden;
}
.page-thumb .pt-num {
  position: absolute; left: 3px; bottom: 2px;
  font-size: 9px; font-weight: 700; color: #555;
  background: rgba(255,255,255,0.85); border-radius: 3px; padding: 0 3px;
  line-height: 12px; pointer-events: none;
}
.page-thumb:hover { border-color: var(--text-muted); transform: translateY(-2px); }
.page-thumb.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
.page-add-btn {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px dashed var(--border-strong);
  border-radius: 3px;
  transition: all var(--fast);
  flex-shrink: 0;
}
.page-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }
.page-add-btn .material-icons-outlined { font-size: 14px; }

.page-info {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
  white-space: nowrap;
}

/* Zoom Controls */
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}
.zoom-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  transition: background var(--fast);
}
.zoom-btn:hover { background: var(--bg-hover); }
.zoom-btn:active { background: var(--bg-active); }
.zoom-btn .material-icons-outlined { font-size: 18px; }
.zoom-slider {
  width: 80px;
  -webkit-appearance: none;
  height: 4px;
  background: var(--border-strong);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  transition: transform var(--fast);
}
.zoom-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.zoom-value {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 36px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* ============================================
   8. Notes Panel
   ============================================ */
.notes-panel {
  position: absolute;
  bottom: var(--bottom-h);
  left: var(--sidebar-w);
  right: 0;
  height: 0;
  background: var(--bg-surface);
  /* border lives on .open only: at height 0 a border-top still PAINTS —
     it was the mystery 1px hairline floating over every dark slide */
  border-top: none;
  z-index: 60;
  overflow: hidden;
  transition: height var(--normal);
}
.notes-panel.open { height: 180px; border-top: 1px solid var(--border); }
.notes-panel-inner {
  padding: 12px 20px;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.notes-panel-inner label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.notes-textarea {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 13px;
  line-height: 1.6;
  resize: none;
  transition: border-color var(--fast);
}
.notes-textarea:focus { outline:none; border-color: var(--accent); }

/* ============================================
   9. Toast Notifications
   ============================================ */
.toast-container {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 10px 20px;
  background: var(--text-primary);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateY(12px) scale(0.95);
  transition: all var(--normal);
  pointer-events: auto;
  white-space: nowrap;
}
.toast.show { opacity:1; transform:translateY(0) scale(1); }

/* ============================================
   10. Context Menu (restyled from engine donor)
   ============================================ */
.ctx-menu {
  display: none;
  position: fixed;
  z-index: 9000;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 6px 0;
  min-width: 220px;
  box-shadow: var(--shadow-lg);
  font-family: var(--font);
}
.ctx-menu.open { display: block; }
.ctx-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;
  font-size: 13px;
  color: var(--text-primary);
  cursor: pointer;
  transition: background var(--fast);
  width: 100%;
  text-align: left;
  gap: 20px;
}
.ctx-item:hover { background: var(--bg-hover); color: var(--accent); }
.ctx-item-left { display: flex; align-items: center; gap: 10px; }
.ctx-item-left .material-icons-outlined { font-size: 16px; color: var(--text-secondary); }
.ctx-item:hover .ctx-item-left .material-icons-outlined { color: var(--accent); }
.ctx-shortcut { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }

/* ============================================
   11. Animations
   ============================================ */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
.panel-content .template-card,
.panel-content .element-card,
.panel-content .text-option {
  animation: fadeInUp 0.3s var(--ease) both;
}

/* ============================================
   11b. LAYOUT POLISH (Opus, 20 Jul 2026)
   Sidebar rail affordances · resizable panel · selection toolbar ·
   bottom-bar declutter · page-thumb hover actions.
   Additive only — no engine/glue/auth code touched.
   ============================================ */

/* --- Sidebar rail: real scrollbar, now that the tool list is long --- */
.sidebar-rail {
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
  scroll-behavior: smooth;
}
.sidebar-rail::-webkit-scrollbar { width: 6px; }
.sidebar-rail::-webkit-scrollbar-track { background: transparent; }
.sidebar-rail::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 3px;
}
.sidebar-rail:hover::-webkit-scrollbar-thumb { background: var(--text-muted); }
.sidebar-rail::-webkit-scrollbar-thumb:hover { background: var(--accent); }
.tool-btn { border-radius: 0; }
.tool-btn:focus-visible { outline-offset: -2px; }

/* Collapse the sidebar by width instead of display:none, so it animates
   and the canvas reflows smoothly. */
.sidebar { transition: width var(--normal), opacity var(--fast); overflow: hidden; }
.sidebar.collapsed { width: 0 !important; opacity: 0; pointer-events: none; }

/* --- Side panel: user-resizable --- */
.side-panel { position: relative; }
.panel-resize {
  position: absolute; top: 0; right: -3px; bottom: 0;
  width: 6px; cursor: col-resize; z-index: 60;
  background: transparent; transition: background var(--fast);
}
.panel-resize:hover, .panel-resize.dragging { background: var(--accent-light); }
.side-panel:not(.open) .panel-resize { display: none; }
body.ld-resizing { cursor: col-resize; user-select: none; }
body.ld-resizing .side-panel { transition: none; }

/* --- Ribbon --- */
.ribbon {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 90;
  display: flex; flex-direction: column;
  /* Office's own UI typeface, so the ribbon reads like PowerPoint rather
     than like the rest of the (DM Sans) app chrome. */
  font-family: 'Segoe UI', 'Segoe UI Variable', system-ui, -apple-system, sans-serif;
}
/* The single top line: everything the old <header> used to hold, plus the
   ribbon tab strip. One row instead of two. */
.ribbon-top {
  display: flex; align-items: center; gap: 4px;
  height: 44px; padding: 0 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; min-width: 0;
}
.ribbon-top .btn-icon { width: 32px; height: 32px; flex-shrink: 0; }
.ribbon-top .btn-icon .material-icons-outlined { font-size: 20px; }
.rb-div { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; margin: 0 3px; }
.rb-flex { flex: 1; min-width: 8px; }
.doc-wrap {
  display: flex; align-items: baseline; gap: 5px;
  min-width: 0; flex-shrink: 1; overflow: hidden; margin-right: 4px;
}
.doc-wrap .doc-title { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ribbon-tabs {
  display: flex; align-items: center; gap: 2px;
  height: 44px; flex-shrink: 1; min-width: 0;
  overflow-x: auto; scrollbar-width: none;
}
.ribbon-tabs::-webkit-scrollbar { height: 0; }
.rb-tab {
  padding: 5px 12px;
  font-size: 13px; font-weight: 600;
  color: #1B1B1B;
  border-radius: var(--radius-sm);
  white-space: nowrap; flex-shrink: 0;
  border-bottom: 2px solid transparent;
  transition: all var(--fast);
}
.rb-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.rb-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-subtle); }
/* contextual tabs (Shape format …) read as a different class of thing */
.rb-tab.ctx { color: var(--upgrade); }
.rb-tab.ctx.active { color: var(--upgrade); border-bottom-color: var(--upgrade); background: #FFF7ED; }

.ribbon-body {
  display: flex; align-items: stretch; gap: 0;
  padding: 6px 10px 4px; height: 90px;
  overflow-x: auto; scrollbar-width: thin;
  transition: height var(--fast), padding var(--fast);
}
.ribbon.collapsed .ribbon-body { height: 0; padding: 0; overflow: hidden; }
.rb-group {
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 0 9px; flex-shrink: 0;
  border-right: 1px solid var(--border);
}
.rb-group:last-child { border-right: none; }
.rb-row { display: flex; align-items: flex-start; gap: 3px; }
.rb-label {
  font-size: 11px; color: #616161; font-weight: 400;
  text-align: center; margin-top: 3px; letter-spacing: .01em;
}
.rb-btn.mini span:last-child { font-weight: 600; }

/* ══ PowerPoint-style coloured ribbon icons (30 Jul 2026) ══════════════
   Office does not tint icons at random — it colours them by FAMILY, so
   your eye learns where things live: text tools blue, drawing orange,
   media teal, data green, design purple, presenting red. Same idea here,
   using Office's own hues. The colour sits on the icon only; labels stay
   near-black and the hover background still does the highlighting, which
   is exactly how PowerPoint behaves.                                    */
.rb-btn .material-icons-outlined,
.rb-btn .material-symbols-outlined { font-size: 26px; }
.rb-btn.mini .material-icons-outlined,
.rb-btn.mini .material-symbols-outlined { font-size: 19px; }
.rb-btn span:last-child { font-size: 12px; }
.rb-btn.mini span:last-child { font-size: 12px; }

.rbi-text    { color: #2B579A; }   /* fonts, typing, clipboard   — Office blue   */
.rbi-para    { color: #41729F; }   /* paragraph, lists, align    — muted blue    */
.rbi-draw    { color: #D24726; }   /* shapes, fills, drawing     — Office orange */
.rbi-media   { color: #0F7B6C; }   /* pictures, video, audio     — teal          */
.rbi-data    { color: #217346; }   /* charts, tables, data       — Excel green   */
.rbi-design  { color: #7719AA; }   /* themes, background, brand  — Office purple */
.rbi-motion  { color: #B7791F; }   /* animation, transitions     — amber         */
.rbi-review  { color: #0E7C7B; }   /* comments, proofing, a11y   — deep teal     */
.rbi-present { color: #C43E1C; }   /* slide show, record         — Office red    */
.rbi-view    { color: #4C5A67; }   /* zoom, panes, guides        — slate         */
.rbi-order   { color: #3B5BA5; }   /* layer order, group, lock   — indigo        */
.rbi-danger  { color: #C5221F; }   /* delete                     — red           */
.rbi-insert  { color: #C55A11; }   /* Insert tab: puts things on  — warm orange   */

/* ══ New slide layout gallery — PowerPoint's shape ══════════════════════ */
.ld-layout-pop { width: 380px; padding: 0; }
.ld-layout-pop .ld-pop-head { padding: 10px 14px 6px; }
.ld-layout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 10px 10px; }
.ld-layout-card {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 4px; border-radius: var(--radius-sm); border: 1px solid transparent;
  background: none; text-align: center;
}
.ld-layout-card:hover { background: var(--accent-subtle); border-color: var(--accent); }
.ld-layout-card svg { display: block; }
.ld-layout-card span { font-size: 11px; line-height: 1.25; color: var(--text-secondary); }
.ld-layout-card:hover span { color: var(--accent); }
.ld-layout-acts { border-top: 1px solid var(--border); padding: 5px; }
.ld-layout-acts button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 8px 10px; border-radius: var(--radius-sm);
  font-size: 12.5px; color: var(--text-primary); background: none; border: 0; text-align: left;
}
.ld-layout-acts button:hover { background: var(--bg-hover); }
.ld-layout-acts .material-icons-outlined { font-size: 17px; color: var(--text-secondary); }

/* No hover override is needed: the .rbi-* class is more specific than
   .rb-btn:hover's inherited colour, so the icon keeps its family hue and
   only the button background lights up — PowerPoint's behaviour. Danger
   buttons still turn fully red via .rb-btn.danger:hover. */

/* Slot for the hand-drawn multi-colour artwork (RB_SVG). Sized to match
   the glyphs exactly so a row mixing both stays on one baseline. */
.rb-svg { display: flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; flex: none; }
.rb-svg svg { width: 26px; height: 26px; display: block; }
.rb-btn.mini .rb-svg, .rb-btn.mini .rb-svg svg { width: 19px; height: 19px; }

/* --- Shapes gallery (PowerPoint's Shapes dropdown) --- */
.shape-gallery {
  position: fixed; z-index: 250;
  width: 330px; max-height: 62vh; overflow-y: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 8px 10px 12px;
  display: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.shape-gallery.open { display: block; }
.sg-head {
  font-size: 11px; font-weight: 600; color: #1B1B1B;
  padding: 8px 2px 5px; letter-spacing: .01em;
}
.sg-row { display: flex; flex-wrap: wrap; gap: 2px; }
.sg-item {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; color: #444;
  transition: all var(--fast);
}
.sg-item:hover { background: var(--accent-subtle); color: var(--accent); outline: 1px solid var(--accent-light); }
.sg-item svg { width: 20px; height: 20px; }
.rb-btn {
  min-width: 54px; padding: 4px 5px 3px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border-radius: var(--radius-sm);
  color: #1B1B1B;                    /* Office labels are near-black, not grey */
  transition: all var(--fast);
}
.rb-btn:hover { background: var(--bg-hover); color: var(--accent); }
.rb-btn:active { background: var(--bg-active); }
.rb-btn .material-icons-outlined { font-size: 19px; }
.rb-btn span:last-child {
  font-size: 11px; font-weight: 600; line-height: 1.15;
  text-align: center; letter-spacing: -0.01em; color: inherit;
}
.rb-btn.wide { min-width: 66px; }
.rb-btn.disabled { opacity: .35; pointer-events: none; }
.rb-btn.danger:hover { background: #FEF2F2; color: #DC2626; }
/* compact variant for dense groups (small icon, label beside) */
.rb-btn.mini {
  flex-direction: row; min-width: 0; gap: 4px; padding: 3px 7px;
}
.rb-btn.mini .material-icons-outlined { font-size: 15px; }
.rb-btn.mini span:last-child { font-size: 11px; }

/* --- Bottom bar: give the thumb strip the room, keep Notes reachable --- */
.bottom-left { display: flex !important; align-items: center; gap: 4px; flex-shrink: 0; }
.bottom-left .timer-wrap { display: none; }   /* timer stays parked */
.btn-icon-sm {
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); color: var(--text-secondary);
  transition: all var(--fast);
}
.btn-icon-sm:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn-icon-sm.active { background: var(--accent-light); color: var(--accent); }
.btn-icon-sm .material-icons-outlined { font-size: 18px; }

/* --- Elements panel: section headings + frame cards --- */
.panel-subhead {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 12px; font-weight: 700; color: var(--text-primary);
  margin: 12px 0 8px;
}
.panel-subhead:first-child { margin-top: 4px; }
.panel-subhead span { font-size: 10px; font-weight: 500; color: var(--text-muted); }
/* Catalog cards colour themselves via currentColor, per-card via --ec so
   each shape gets its own vivid colour; hover darkens the art. */
.element-card { color: var(--ec, #7C3AED); transition: filter var(--fast), background var(--fast); }
.element-card:hover { filter: brightness(0.88); }
.element-card.frame-card { color: #C3C7D1; }
.element-card.frame-card:hover { color: var(--accent); }
/* frame previews carry real artwork now — fill ~80% of the card instead of
   the 40% reserved for plain shape glyphs */
.element-card.frame-card svg { width: 80%; height: 80%; }
/* the Frames group gets its own bigger 2-up layout */
.element-grid-frames { grid-template-columns: repeat(2, 1fr); gap: 10px; }

/* --- Icons panel --- */
.msym {
  font-family: 'Material Symbols Outlined';
  font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1;
  letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap;
  word-wrap: normal; direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}
.icon-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px;
}
.icon-card {
  position: relative;
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  color: var(--text-primary);
  transition: all var(--fast);
}
.icon-card:hover { background: var(--accent-subtle); border-color: var(--accent-light); color: var(--accent); }
.icon-card .msym { font-size: 23px; }
.icon-star {
  position: absolute; top: 1px; right: 1px;
  font-size: 13px !important; color: var(--text-muted);
  opacity: 0; transition: opacity var(--fast);
}
.icon-card:hover .icon-star { opacity: 1; }
.icon-card.fav .icon-star { opacity: 1; color: #EAB308; }
.icon-star:hover { color: #EAB308; }
.panel-subhead span { font-weight: 500; }

/* --- Ribbon: view overlays + inspector modal --- */
.slide-frame.show-grid::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background-image:
    linear-gradient(to right, rgba(124,58,237,0.14) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(124,58,237,0.14) 1px, transparent 1px);
  background-size: 40px 40px;
}
.slide-frame.show-guides::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background-image:
    linear-gradient(to right, transparent calc(50% - 1px), rgba(232,89,12,.5) 50%, transparent calc(50% + 1px)),
    linear-gradient(to bottom, transparent calc(50% - 1px), rgba(232,89,12,.5) 50%, transparent calc(50% + 1px));
}
body.show-ruler .canvas-area::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 18px; z-index: 40;
  background: repeating-linear-gradient(to right,
    var(--border-strong) 0 1px, transparent 1px 20px);
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border);
}
body.show-ruler .canvas-area::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 18px; z-index: 40;
  background: repeating-linear-gradient(to bottom,
    var(--border-strong) 0 1px, transparent 1px 20px);
  background-color: var(--bg-surface);
  border-right: 1px solid var(--border);
}
.rb-modal {
  position: absolute; inset: 0; z-index: 400;
  background: rgba(15,23,42,0.45);
  display: flex; align-items: center; justify-content: center;
}
.rb-modal-box {
  width: min(620px, 90vw); max-height: 78vh;
  display: flex; flex-direction: column;
  background: var(--bg-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.rb-modal-head {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
}
.rb-modal-head b { font-size: 14px; font-weight: 700; }
.rb-modal-head span { flex: 1; font-size: 11.5px; color: var(--text-muted); }
.rb-modal-head button {
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  font-size: 19px; color: var(--text-secondary); line-height: 1;
}
.rb-modal-head button:hover { background: var(--bg-hover); }
.rb-modal-box textarea {
  flex: 1; min-height: 220px; resize: none; border: 0; outline: none;
  padding: 12px 14px; font-family: monospace; font-size: 11.5px; line-height: 1.55;
  color: var(--text-primary); background: var(--bg-surface); white-space: pre;
}
.rb-modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 10px 14px; border-top: 1px solid var(--border);
}
.rb-modal-foot button {
  padding: 7px 16px; border-radius: var(--radius-md);
  font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
  border: 1px solid var(--border-strong);
}
.rb-modal-foot button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

/* --- Accessibility panel --- */
.a11y-score {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 2px 10px;
}
.a11y-score b { font-size: 32px; font-weight: 700; color: var(--text-primary); }
.a11y-score span { font-size: 12px; color: var(--text-secondary); }
.a11y-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.a11y-tile {
  padding: 8px 4px; border-radius: var(--radius-md); text-align: center;
  background: var(--bg-hover);
}
.a11y-tile b { display: block; font-size: 19px; font-weight: 700; color: var(--text-primary); }
.a11y-tile span { font-size: 10px; color: var(--text-secondary); }
.a11y-tile.bad { background: #FEF2F2; }
.a11y-tile.bad b { color: #DC2626; }
.a11y-tile.ok { background: #ECFDF5; }
.a11y-tile.ok b { color: #059669; }
.a11y-list { display: flex; flex-direction: column; gap: 4px; }
.a11y-row {
  display: flex; align-items: flex-start; gap: 8px; text-align: left;
  padding: 7px 8px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  transition: all var(--fast);
}
.a11y-row:hover { border-color: var(--accent); background: var(--accent-subtle); }
.a11y-row .material-icons-outlined { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
.a11y-row.ok .material-icons-outlined { color: #059669; }
.a11y-row.bad .material-icons-outlined { color: #DC2626; }
.a11y-row.warn .material-icons-outlined { color: var(--upgrade); }
.a11y-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.a11y-main b {
  font-size: 11.5px; font-weight: 600; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.a11y-main i { font-size: 10.5px; font-style: normal; color: var(--text-secondary); }
.a11y-ord {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 5px; border-radius: var(--radius-sm); background: var(--bg-hover);
}
.a11y-num {
  width: 18px; height: 18px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff;
  border-radius: 50%; font-size: 9.5px; font-weight: 700;
}
.a11y-ico { font-size: 14px !important; color: var(--text-secondary); flex-shrink: 0; }
.a11y-lab {
  flex: 1; min-width: 0; font-size: 11.5px; font-weight: 500; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.a11y-ord button {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; color: var(--text-muted);
}
.a11y-ord button:hover { background: var(--bg-active); color: var(--accent); }
.a11y-ord .material-icons-outlined { font-size: 13px; }
.a11y-demo {
  padding: 18px 14px; border-radius: var(--radius-md);
  font-size: 17px; font-weight: 600; text-align: center;
  border: 1px solid var(--border);

}
.a11y-ratio {
  font-size: 34px; font-weight: 700; text-align: center;
  color: var(--text-primary); padding: 10px 0 4px;

}
.a11y-checks { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.a11y-checks div {
  display: flex; align-items: center; justify-content: space-between;

.a11y-pass, .a11y-fail {
