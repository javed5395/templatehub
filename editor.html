  return Object.keys(ICON_LIB).map(function (g) {
    return '<div class="panel-subhead">' + g + '</div>' + iconGrid(ICON_LIB[g], favs);
  }).join('');
}

/* Search runs across EVERY category, not just the visible one. */
function renderIconSearch(q) {
  var favs = iconFavourites(), hits = [], seen = {};
  Object.keys(ICON_LIB).forEach(function (g) {
    ICON_LIB[g].forEach(function (n) {
      if (seen[n]) return;
      if (n.replace(/_/g, ' ').indexOf(q) > -1 || g.toLowerCase().indexOf(q) > -1) {
        seen[n] = 1; hits.push(n);
      }
    });
  });
  if (!hits.length) {
    return '<div class="panel-placeholder"><span class="material-icons-outlined">search_off</span>'
      + '<p><strong>No icons for “' + q + '”</strong><br>Try a broader word.</p></div>';
  }
  return '<div class="panel-subhead">Results <span>' + hits.length + '</span></div>'
    + iconGrid(hits, favs);
}

/* Insert. The icon is a text object in the symbol font, so its colour and
   its wght (stroke width) remain live properties. */
var ICON_DEFAULT_WEIGHT = 400;

function addIcon(name) {
  if (!fc) return;
  histLabel('Added icon');
  var place = function () {
    var slideW = fc.getWidth() / fc.getZoom();
    var slideH = fc.getHeight() / fc.getZoom();
    var size = Math.round(Math.min(slideW, slideH) * 0.22);
    var t = new fabric.Text(name, {
      fontFamily: ICON_FONT,
      fontSize: size,
      fontWeight: ICON_DEFAULT_WEIGHT,
      fill: '#1B1B1B',
      isIcon: true,
      iconName: name,
      iconWeight: ICON_DEFAULT_WEIGHT,
      objectCaching: false
    });
    t.set({ left: (slideW - t.width) / 2, top: (slideH - t.height) / 2 });
    fc.add(t).setActiveObject(t);
    fc.renderAll();
    iconPushRecent(name);
    saveState();
    showToast('Icon added');
  };
  /* the glyph renders as literal text until the symbol font is ready */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('400 48px "' + ICON_FONT + '"').then(place).catch(place);
  } else place();
}

function iconSelected() {
  var o = fc && fc.getActiveObject();
  return (o && o.isIcon) ? o : null;
}

function setIconWeight(delta) {
  var o = iconSelected();
  if (!o) { showToast('Select an icon first'); return; }
  var steps = [100, 200, 300, 400, 500, 600, 700];
  var cur = o.iconWeight || 400;
  var i = steps.indexOf(cur);
  if (i < 0) i = 3;
  i = Math.max(0, Math.min(steps.length - 1, i + delta));
  o.set({ fontWeight: steps[i] });
  o.iconWeight = steps[i];
  o.dirty = true;
  fc.renderAll();
  saveState();
  showToast('Stroke weight ' + steps[i]);
}

function setIconColour() {
  var o = iconSelected();
  if (!o) { showToast('Select an icon first'); return; }
  ldColour({ value: o.fill || '#1B1B1B', title: 'Icon colour' }, function (c) {
    if (c) { o.set('fill', c); fc.renderAll(); saveState(); }
  });
}

/* Replace: keeps position, size, colour and weight — only the glyph swaps. */
var _iconReplaceMode = false;

function startIconReplace() {
  if (!iconSelected()) { showToast('Select an icon first'); return; }
  _iconReplaceMode = true;
  openPanel('icons');
  showToast('Pick a replacement icon');
}

function replaceIcon(name) {
  var o = iconSelected();
  if (!o) { _iconReplaceMode = false; return false; }
  o.set('text', name);
  o.iconName = name;
  o.dirty = true;
  fc.renderAll();
  iconPushRecent(name);
  saveState();
  _iconReplaceMode = false;
  showToast('Icon replaced');
  return true;
}

/* ════════════════════════════════════════════════════════════
   CHARTS — insertable chart library
   Each type is drawn to an offscreen canvas and placed as an image that
   carries its own chartDef, so the data stays with the object and a later
   session can turn it into a live editable chart without re-authoring the
   drawing code.
   ════════════════════════════════════════════════════════════ */
var CHART_PALETTE = ['#7C3AED', '#12A5A0', '#E8590C', '#EAB308', '#2563EB', '#DB2777', '#059669', '#64748B'];

var CHART_TYPES = [
  { id:'column',        name:'Column',          group:'Bar & column' },
  { id:'column-stack',  name:'Stacked column',  group:'Bar & column' },
  { id:'bar',           name:'Bar',             group:'Bar & column' },
  { id:'bar-stack',     name:'Stacked bar',     group:'Bar & column' },
  { id:'column-group',  name:'Grouped column',  group:'Bar & column' },
  { id:'line',          name:'Line',            group:'Line & area' },
  { id:'line-smooth',   name:'Smooth line',     group:'Line & area' },
  { id:'line-marker',   name:'Line + markers',  group:'Line & area' },
  { id:'area',          name:'Area',            group:'Line & area' },
  { id:'area-stack',    name:'Stacked area',    group:'Line & area' },
  { id:'pie',           name:'Pie',             group:'Pie & parts' },
  { id:'donut',         name:'Donut',           group:'Pie & parts' },
  { id:'half-donut',    name:'Half donut',      group:'Pie & parts' },
  { id:'progress',      name:'Progress ring',   group:'Pie & parts' },
  { id:'funnel',        name:'Funnel',          group:'Pie & parts' },
  { id:'scatter',       name:'Scatter',         group:'Distribution' },
  { id:'bubble',        name:'Bubble',          group:'Distribution' },
  { id:'radar',         name:'Radar',           group:'Distribution' },
  { id:'gauge',         name:'Gauge',           group:'Distribution' },
  { id:'waterfall',     name:'Waterfall',       group:'Distribution' },
];

var CHART_SAMPLE = {
  cats: ['Q1', 'Q2', 'Q3', 'Q4'],
  series: [
    { name: 'Revenue', data: [42, 58, 49, 71] },
    { name: 'Cost',    data: [28, 33, 30, 38] },
  ]
};

/* Draw a chart onto a 2D context sized w x h. Pure canvas, no libraries. */
function drawChart(ctx, w, h, type, def) {
  var d = def || CHART_SAMPLE;
  var s0 = d.series[0].data, s1 = (d.series[1] || d.series[0]).data;
  /* labels sized to the chart so a big placed chart reads clearly */
  var F = Math.max(12, Math.round(h * 0.055));
  var pad = { l: Math.max(40, F * 2.6), r: 16, t: F + 6, b: F * 2 };
  var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  var maxV = Math.max.apply(null, s0.concat(s1)) * 1.15;
  var P = CHART_PALETTE;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);
  ctx.font = 'bold ' + F + 'px Arial, sans-serif';
  ctx.textBaseline = 'middle';

  function axes(vertical) {
    ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
      var y = pad.t + ih * i / 4;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + iw, y); ctx.stroke();
      ctx.fillStyle = '#000000'; ctx.textAlign = 'right';
      ctx.fillText(Math.round(maxV * (1 - i / 4)), pad.l - 8, y);
    }
    if (vertical !== false) {
      ctx.fillStyle = '#000000'; ctx.textAlign = 'center';
      d.cats.forEach(function (c, i) {
        ctx.fillText(c, pad.l + iw * (i + 0.5) / d.cats.length, h - pad.b + F);
      });
    }
  }
  function bars(horizontal, stacked, grouped) {
    axes(!horizontal);
    var n = d.cats.length;
    for (var i = 0; i < n; i++) {
      if (horizontal) {
        var slot = ih / n, bh = slot * 0.5, y0 = pad.t + slot * i + (slot - bh) / 2;
        var bw = iw * s0[i] / maxV;
        ctx.fillStyle = P[0]; ctx.fillRect(pad.l, y0, bw, bh);
        if (stacked) { ctx.fillStyle = P[1]; ctx.fillRect(pad.l + bw, y0, iw * s1[i] / maxV, bh); }
      } else {
        var slotw = iw / n, bwid = slotw * (grouped ? 0.28 : 0.46);
        var x0 = pad.l + slotw * i + (slotw - bwid * (grouped ? 2 : 1)) / 2;
        var bh0 = ih * s0[i] / maxV;
        ctx.fillStyle = P[0];
        ctx.fillRect(x0, pad.t + ih - bh0, bwid, bh0);
        if (grouped) {
          ctx.fillStyle = P[1];
          var bh1 = ih * s1[i] / maxV;
          ctx.fillRect(x0 + bwid + 2, pad.t + ih - bh1, bwid, bh1);
        } else if (stacked) {
          ctx.fillStyle = P[1];
          var bh2 = ih * s1[i] / maxV;
          ctx.fillRect(x0, pad.t + ih - bh0 - bh2, bwid, bh2);
        }
      }
    }
  }
  function pts(arr) {
    return arr.map(function (v, i) {
      return [pad.l + iw * (i + 0.5) / arr.length, pad.t + ih * (1 - v / maxV)];
    });
  }
  function poly(p, smooth) {
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    for (var i = 1; i < p.length; i++) {
      if (smooth) {
        var cx = (p[i - 1][0] + p[i][0]) / 2;
        ctx.bezierCurveTo(cx, p[i - 1][1], cx, p[i][1], p[i][0], p[i][1]);
      } else ctx.lineTo(p[i][0], p[i][1]);
    }
  }
  function pieSlices(inner, sweep, cx, cy, r) {
    var tot = s0.reduce(function (a, b) { return a + b; }, 0), a0 = -Math.PI / 2;
    s0.forEach(function (v, i) {
      var a1 = a0 + sweep * v / tot;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
      ctx.fillStyle = P[i % P.length]; ctx.fill();
      a0 = a1;
    });
    if (inner) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath(); ctx.arc(cx, cy, r * inner, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  var cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.36;

  switch (type) {
    case 'column':       bars(false, false, false); break;
    case 'column-stack': bars(false, true,  false); break;
    case 'column-group': bars(false, false, true);  break;
    case 'bar':          bars(true,  false, false); break;
    case 'bar-stack':    bars(true,  true,  false); break;

    case 'line': case 'line-smooth': case 'line-marker': {
      axes();
      var p = pts(s0);
      poly(p, type === 'line-smooth');
      ctx.strokeStyle = P[0]; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
      if (type === 'line-marker') {
        p.forEach(function (q) {
          ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, Math.PI * 2);
          ctx.fillStyle = '#fff'; ctx.fill();
          ctx.strokeStyle = P[0]; ctx.lineWidth = 2; ctx.stroke();
        });
      }
      break;
    }
    case 'area': case 'area-stack': {
      axes();
      [s1, s0].forEach(function (ser, k) {
        if (type === 'area' && k === 0) return;
        var q = pts(ser);
        poly(q, true);
        ctx.lineTo(q[q.length - 1][0], pad.t + ih);
        ctx.lineTo(q[0][0], pad.t + ih);
        ctx.closePath();
        ctx.fillStyle = k === 0 ? P[1] + '66' : P[0] + '66';
        ctx.fill();
        poly(q, true);
        ctx.strokeStyle = k === 0 ? P[1] : P[0]; ctx.lineWidth = 2; ctx.stroke();
      });
      break;
    }

    case 'pie':       pieSlices(0,    Math.PI * 2, cx, cy, r); break;
    case 'donut':     pieSlices(0.58, Math.PI * 2, cx, cy, r); break;
    case 'half-donut':
      pieSlices(0.55, Math.PI, cx, cy + r * 0.45, r * 1.2);
      break;
    case 'progress': {
      var pct = 0.68;
      ctx.lineWidth = r * 0.28; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#EDE9FE'; ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
      ctx.strokeStyle = P[0]; ctx.stroke();
      ctx.fillStyle = '#000000'; ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.round(r * 0.5) + 'px Arial, sans-serif';
      ctx.fillText(Math.round(pct * 100) + '%', cx, cy);
      break;
    }
    case 'funnel': {
      var n = s0.length, fh = ih / n;
      s0.slice().sort(function (a, b) { return b - a; }).forEach(function (v, i) {
        var wTop = iw * v / maxV, wBot = iw * (s0[i + 1] || v * 0.7) / maxV;
        var y = pad.t + fh * i;
        ctx.beginPath();
        ctx.moveTo(cx - wTop / 2, y); ctx.lineTo(cx + wTop / 2, y);
        ctx.lineTo(cx + wBot / 2, y + fh - 3); ctx.lineTo(cx - wBot / 2, y + fh - 3);
        ctx.closePath();
        ctx.fillStyle = P[i % P.length]; ctx.fill();
      });
      break;
    }
    case 'scatter': case 'bubble': {
      axes(false);
      for (var i = 0; i < 14; i++) {
        var px = pad.l + iw * ((i * 37) % 100) / 100;
        var py = pad.t + ih * (1 - ((i * 53) % 90) / 100);
        var rad = type === 'bubble' ? 4 + ((i * 29) % 11) : 4;
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2);
        ctx.fillStyle = P[i % 3] + (type === 'bubble' ? '99' : 'FF');
        ctx.fill();
      }
      break;
    }
    case 'radar': {
      var n2 = 6, rr = Math.min(w, h) * 0.34;
      for (var ring = 1; ring <= 3; ring++) {
        ctx.beginPath();
        for (var k = 0; k <= n2; k++) {
          var a = -Math.PI / 2 + k * 2 * Math.PI / n2;
          var x = cx + Math.cos(a) * rr * ring / 3, y = cy + Math.sin(a) * rr * ring / 3;
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath(); ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.beginPath();
      var vals = [0.9, 0.6, 0.75, 0.5, 0.85, 0.65];
      for (var k2 = 0; k2 <= n2; k2++) {
        var a2 = -Math.PI / 2 + k2 * 2 * Math.PI / n2, v2 = vals[k2 % n2];
        var x2 = cx + Math.cos(a2) * rr * v2, y2 = cy + Math.sin(a2) * rr * v2;
        k2 ? ctx.lineTo(x2, y2) : ctx.moveTo(x2, y2);
      }
      ctx.closePath();
      ctx.fillStyle = P[0] + '55'; ctx.fill();
      ctx.strokeStyle = P[0]; ctx.lineWidth = 2; ctx.stroke();
      break;
    }
    case 'gauge': {
      var gcy = cy + r * 0.4;
      ctx.lineWidth = r * 0.26; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(cx, gcy, r, Math.PI, 0);
      ctx.strokeStyle = '#EDE9FE'; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, gcy, r, Math.PI, Math.PI + Math.PI * 0.72);
      ctx.strokeStyle = P[0]; ctx.stroke();
      ctx.fillStyle = '#000000'; ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.round(r * 0.34) + 'px Arial, sans-serif';
      ctx.fillText('72', cx, gcy - r * 0.28);
      break;
    }
    case 'waterfall': {
      axes();
      var run = 0, nn = s0.length, sw = iw / nn;
      s0.forEach(function (v, i) {
        var delta = i === 0 ? v : v - s0[i - 1];
        var y0 = pad.t + ih * (1 - (run + Math.max(delta, 0)) / maxV);
        var hh = Math.abs(ih * delta / maxV);
        ctx.fillStyle = delta >= 0 ? P[1] : P[2];
        ctx.fillRect(pad.l + sw * i + sw * 0.25, y0, sw * 0.5, Math.max(2, hh));
        run += delta;
      });
      break;
    }
  }
}

/* Paint every thumbnail after the panel HTML lands in the DOM. */
function paintChartThumbs() {
  document.querySelectorAll('[data-cthumb]').forEach(function (cv) {
    try { drawChart(cv.getContext('2d'), cv.width, cv.height, cv.dataset.cthumb); } catch (e) {}
  });

function addChart(type) {
  if (!fc) return;
  histLabel('Added chart');
  var slideW = fc.getWidth() / fc.getZoom();
  var slideH = fc.getHeight() / fc.getZoom();
  var W = Math.round(Math.min(slideW * 0.55, 620));
  var H = Math.round(W * 0.62);
  var cv = document.createElement('canvas');
  var dpr = 2;                       /* draw at 2x so it stays sharp when scaled */
  cv.width = W * dpr; cv.height = H * dpr;
  var ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  drawChart(ctx, W, H, type);

  fabric.Image.fromURL(cv.toDataURL('image/png'), function (img) {
    img.set({
      left: (slideW - W) / 2, top: (slideH - H) / 2,
      scaleX: W / img.width, scaleY: H / img.height,
      chartType: type,
      chartDef: JSON.parse(JSON.stringify(CHART_SAMPLE))
    });
    fc.add(img).setActiveObject(img);
    fc.renderAll();
    saveState();
    showToast('Chart added — data stays editable later');
  });
}

  { n:'Noise night',     fn:'noise',   fg:'#3F3F46', bg:'#0B0C0E' },

function paintPattern(ctx, size, p) {
  ctx.fillStyle = p.bg; ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = p.fg; ctx.fillStyle = p.fg; ctx.lineWidth = 1.3;
  var s = size;
  if (p.fn === 'dots') {
    for (var y = 6; y < s; y += 12) for (var x = 6; x < s; x += 12) {
      ctx.beginPath(); ctx.arc(x, y, 1.9, 0, Math.PI * 2); ctx.fill();
    }
  } else if (p.fn === 'grid' || p.fn === 'graph') {
    var step = p.fn === 'graph' ? 8 : 16;
    for (var i = 0; i <= s; i += step) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(s, i); ctx.stroke();
    }
  } else if (p.fn === 'diag') {
    for (var k = -s; k < s * 2; k += 12) {
      ctx.beginPath(); ctx.moveTo(k, 0); ctx.lineTo(k + s, s); ctx.stroke();
    }
  } else if (p.fn === 'cross') {
    ctx.lineWidth = 1.6;
    for (var y2 = 10; y2 < s; y2 += 20) for (var x2 = 10; x2 < s; x2 += 20) {
      ctx.beginPath();
      ctx.moveTo(x2 - 3.5, y2); ctx.lineTo(x2 + 3.5, y2);
      ctx.moveTo(x2, y2 - 3.5); ctx.lineTo(x2, y2 + 3.5);
      ctx.stroke();
    }
  } else if (p.fn === 'chevron') {
    ctx.lineWidth = 1.6;
    for (var y3 = 0; y3 < s + 16; y3 += 16) {
      ctx.beginPath();
      for (var x3 = 0; x3 <= s; x3 += 16) {
        ctx.lineTo(x3, y3 + (x3 / 16 % 2 ? 0 : 8));
      }
      ctx.stroke();
    }
  } else if (p.fn === 'noise') {
    for (var i2 = 0; i2 < 260; i2++) {
      ctx.fillRect((i2 * 37) % s, (i2 * 53) % s, 1.8, 1.8);
    }
  }
}

function applyBgSolid(hex) {

function applyBgGradient(i) {
  var g = BG_GRADIENTS[i];
  if (!g || !fc) return;
  var w = fc.getWidth() / fc.getZoom(), h = fc.getHeight() / fc.getZoom();
  var rad = (g.d - 90) * Math.PI / 180;
  fc.setBackgroundColor(new fabric.Gradient({
    type: 'linear',
    gradientUnits: 'pixels',
    coords: { x1: w / 2 - Math.cos(rad) * w / 2, y1: h / 2 - Math.sin(rad) * h / 2,
              x2: w / 2 + Math.cos(rad) * w / 2, y2: h / 2 + Math.sin(rad) * h / 2 },
    colorStops: [{ offset: 0, color: g.a }, { offset: 1, color: g.b }]
  }), fc.renderAll.bind(fc));
  saveState();
  showToast(g.n + ' background');
}

function applyBgPattern(i) {
  var p = BG_PATTERNS[i];
  if (!p || !fc) return;
  var cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  paintPattern(cv.getContext('2d'), 64, p);
  fc.setBackgroundColor(new fabric.Pattern({ source: cv, repeat: 'repeat' }),
                        fc.renderAll.bind(fc));
  saveState();
  showToast(p.n + ' background');
}

/* ════════════════════════════════════════════════════════════
   DRAW — freehand tools (PowerPoint-style): Pen, Marker (highlighter),
   Eraser, Select. Uses fabric's free-drawing; strokes are ordinary paths
   tagged _isDrawn so Clear and the eraser can find them.
   ════════════════════════════════════════════════════════════ */
var DRAW_COLORS = ['#1B1B1B','#DC2626','#2563EB','#059669','#EAB308','#7C3AED',
                   '#E8590C','#DB2777','#12A5A0','#64748B','#FFFFFF'];
var _draw = { tool:'select', color:'#1B1B1B', size:4, erasing:false };

function drawRgba(hex, a) {
  var m = /^#?(..)(..)(..)/.exec(String(hex).replace('#',''));
  if (!m) return hex;
  return 'rgba(' + parseInt(m[1],16) + ',' + parseInt(m[2],16) + ',' + parseInt(m[3],16) + ',' + a + ')';
}

function drawEraseAt(opt) {
  if (!fc) return;
  var p = fc.getPointer(opt.e), pt = new fabric.Point(p.x, p.y);
  fc.getObjects().slice().forEach(function (o) {
    if (o._isDrawn && o.containsPoint && o.containsPoint(pt)) fc.remove(o);
  });
  fc.requestRenderAll();
}

function drawEnsureHooks() {
  if (!fc || fc._drawHooked) return;
  fc._drawHooked = true;
  fc.on('path:created', function (e) { if (e.path) e.path._isDrawn = true; });
  fc.on('mouse:down', function (opt) { if (_draw.tool === 'eraser') { _draw.erasing = true; drawEraseAt(opt); } });
  fc.on('mouse:move', function (opt) { if (_draw.erasing) drawEraseAt(opt); });
  fc.on('mouse:up',   function () { if (_draw.erasing) { _draw.erasing = false; saveState(); } });
}

function drawApplyBrush() {
  if (!fc) return;
  if (_draw.tool === 'pen' || _draw.tool === 'highlighter') {
    fc.isDrawingMode = true;
    var b = new fabric.PencilBrush(fc);
    if (_draw.tool === 'highlighter') { b.color = drawRgba(_draw.color, 0.4); b.width = _draw.size * 3; }
    else { b.color = _draw.color; b.width = _draw.size; }
    fc.freeDrawingBrush = b;
  } else {
    fc.isDrawingMode = false;
  }
  fc.defaultCursor = _draw.tool === 'eraser' ? 'cell' : 'default';
}

function drawSetTool(t) {
  drawEnsureHooks();
  _draw.tool = t;
  drawApplyBrush();
  renderPanelContent('draw');
}
function drawSetColour(c) {
  _draw.color = c;
  if (_draw.tool === 'select' || _draw.tool === 'eraser') _draw.tool = 'pen';
  drawApplyBrush();
  renderPanelContent('draw');
}
function drawSetSize(v) { _draw.size = Math.max(1, Math.min(40, parseInt(v, 10) || 4)); drawApplyBrush(); }
function drawClear() {
  if (!fc) return;
  fc.getObjects().slice().forEach(function (o) { if (o._isDrawn) fc.remove(o); });
  fc.requestRenderAll(); saveState(); showToast('Drawings cleared');
}
function drawExit() { if (fc) { fc.isDrawingMode = false; _draw.erasing = false; } }

function renderDrawPanel() {
  var tool = _draw.tool;
  var tbtn = function (id, icon, label) {
    return '<button class="anim-card' + (tool === id ? ' on' : '') + '" data-action="draw-tool" data-t="' + id + '">'
      + '<span class="material-icons-outlined">' + icon + '</span><span>' + label + '</span></button>';
  };
  return '<div class="panel-subhead">Tools</div>'
    + '<div class="anim-grid four">'
      + tbtn('select','near_me','Select')
      + tbtn('pen','create','Pen')
      + tbtn('highlighter','brush','Marker')
      + tbtn('eraser','backspace','Eraser')
    + '</div>'
    + '<div class="panel-subhead">Colour</div>'
    + '<div class="bg-grid">' + DRAW_COLORS.map(function (c) {
        return '<button class="bg-card' + (_draw.color === c ? ' on' : '') + '" data-action="draw-color" data-c="' + c
          + '" title="' + c + '" style="background:' + c + ';box-shadow:' + (c === '#FFFFFF' ? 'inset 0 0 0 1px var(--border-strong)' : 'none') + '"></button>';
      }).join('') + '</div>'
    + '<label class="brand-lbl">Thickness — ' + _draw.size + 'px</label>'

var PHOTO_STORE = 'photos';

function photoPut(rec) {
  return projOpenDb().then(function (db) {
    if (!db) { _photoLib = _photoLib.filter(function (p) { return p.id !== rec.id; }); _photoLib.unshift(rec); return true; }
    return new Promise(function (res) {
      var tx = db.transaction(PHOTO_STORE, 'readwrite');

/* Grab a poster frame from a video file (first ~0.1s), downscaled. */
function makeVideoPoster(src) {
  return new Promise(function (res) {
    try {
      var v = document.createElement('video');
      v.muted = true; v.preload = 'metadata'; v.src = src;
      var settled = false;
      var finish = function (u) { if (settled) return; settled = true; res(u); };
      var draw = function () {
        try {
          var w = v.videoWidth || 320, h = v.videoHeight || 180;
          var sc = Math.min(1, 480 / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.max(2, Math.round(w * sc)); c.height = Math.max(2, Math.round(h * sc));
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          finish(c.toDataURL('image/jpeg', 0.8));
        } catch (e) { finish(null); }
      };
      v.onloadeddata = function () { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) { draw(); } };
      v.onseeked = draw;
      v.onerror = function () { finish(null); };
      setTimeout(function () { finish(null); }, 6000);
    } catch (e) { res(null); }
  });
}

function _roundRect(g, x, y, w, h, r) {
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* Video tile: poster (or dark fill) + dim + play button + filename. */
function mediaVideoTileURL(poster, name) {
  return new Promise(function (res) {
    var W = 480, H = 270;
    var draw = function (im) {
      var c = document.createElement('canvas'); c.width = W; c.height = H;
      var g = c.getContext('2d');
      if (im) { var sc = Math.max(W / im.width, H / im.height);
        g.drawImage(im, (W - im.width * sc) / 2, (H - im.height * sc) / 2, im.width * sc, im.height * sc); }
      else { g.fillStyle = '#1E293B'; g.fillRect(0, 0, W, H); }
      g.fillStyle = 'rgba(0,0,0,0.32)'; g.fillRect(0, 0, W, H);
      g.beginPath(); g.arc(W / 2, H / 2, 42, 0, Math.PI * 2); g.fillStyle = 'rgba(255,255,255,0.92)'; g.fill();
      g.beginPath(); g.moveTo(W / 2 - 14, H / 2 - 22); g.lineTo(W / 2 + 24, H / 2); g.lineTo(W / 2 - 14, H / 2 + 22);
      g.closePath(); g.fillStyle = '#1E293B'; g.fill();
      if (name) { g.fillStyle = 'rgba(255,255,255,0.92)'; g.font = '16px sans-serif'; g.textBaseline = 'bottom';
        g.fillText(String(name).slice(0, 42), 14, H - 12); }
      res(c.toDataURL('image/jpeg', 0.85));
    };
    if (poster) { var i = new Image(); i.onload = function () { draw(i); }; i.onerror = function () { draw(null); }; i.src = poster; }
    else draw(null);
  });
}

/* Audio chip: violet pill with a note glyph + filename. */
function mediaAudioTileURL(name) {
  var W = 360, H = 88, c = document.createElement('canvas'); c.width = W; c.height = H;
  var g = c.getContext('2d');
  g.fillStyle = '#7C3AED'; _roundRect(g, 0, 0, W, H, 14); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.arc(40, 56, 11, 0, Math.PI * 2); g.fill();
  g.fillRect(49, 24, 5, 34);
  g.beginPath(); g.moveTo(49, 24); g.lineTo(70, 20); g.lineTo(70, 30); g.lineTo(49, 34); g.closePath(); g.fill();
  g.fillStyle = '#FFFFFF'; g.font = '600 17px sans-serif'; g.textBaseline = 'middle';
  g.fillText(String(name || 'Audio').slice(0, 26), 92, 40);
  g.fillStyle = 'rgba(255,255,255,0.75)'; g.font = '13px sans-serif';
  g.fillText('double-click to play', 92, 62);
  return c.toDataURL('image/png');
}

function mediaUploadClick(kind) {

  inp.type = 'file'; inp.multiple = true;

function mediaHandleFiles(files, kind) {
  var arr = Array.prototype.slice.call(files || []);
  if (!arr.length) return;
  showToast('Adding ' + arr.length + ' ' + kind + (arr.length === 1 ? '' : 's') + '…');
  var pending = arr.length, added = 0;
  var doneOne = function () { if (--pending === 0) { mediaRefresh(); if (added) showToast(added + ' added'); } };
  var VIDEO_MAX = 10 * 1024 * 1024;   /* 10 MB cap on videos */
  arr.forEach(function (f) {
    var typeOk = kind === 'audio' ? /^audio\//.test(f.type) : /^video\//.test(f.type);
    if (!typeOk) { doneOne(); return; }
    if (kind === 'video' && f.size > VIDEO_MAX) {
      showToast('“' + f.name + '” is ' + (f.size / 1048576).toFixed(1) + ' MB — videos must be 10 MB or less', 6000);

/* ════════════════════════════════════════════════════════════
   CANVA-STYLE SELECTION HANDLES
   Fabric's default is a thin blue box with small square corners. Canva
   uses a violet outline, white circular corner handles and pill-shaped
   side handles, with the rotate grip BELOW the object. Purely cosmetic —
   the transform maths is untouched.
   ════════════════════════════════════════════════════════════ */
(function applyCanvaControls() {
  if (typeof fabric === 'undefined') return;
  var VIO = '#8B3DFF';

  fabric.Object.prototype.set({
    borderColor: VIO,
    borderScaleFactor: 1.5,
    cornerColor: '#FFFFFF',
    cornerStrokeColor: VIO,
    cornerSize: 11,
    cornerStyle: 'circle',
    transparentCorners: false,
    padding: 2,
    borderOpacityWhenMoving: 0.75
  });

  function roundRect(ctx, x, y, w, h, r) {
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  }

  /* side handles: a short rounded bar, oriented along the edge it grabs */
  function pill(horizontal) {
    return function (ctx, left, top, styleOverride, obj) {
      var w = horizontal ? 18 : 6, h = horizontal ? 6 : 18;
      ctx.save();
      ctx.translate(left, top);
      ctx.rotate(fabric.util.degreesToRadians(obj.angle || 0));
      ctx.beginPath();
      roundRect(ctx, -w / 2, -h / 2, w, h, 3);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = VIO;
      ctx.stroke();
      ctx.restore();
    };
  }

  var C = fabric.Object.prototype.controls;
  if (C) {
    ['ml', 'mr'].forEach(function (k) { if (C[k]) C[k].render = pill(false); });
    ['mt', 'mb'].forEach(function (k) { if (C[k]) C[k].render = pill(true); });

    /* rotate grip: Canva puts it below the object, as a circle with a glyph */
    if (C.mtr) {
      C.mtr.y = 0.5;
      C.mtr.offsetY = 28;
      C.mtr.withConnection = false;
      C.mtr.render = function (ctx, left, top) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(left, top, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(0,0,0,0.16)';
        ctx.stroke();
        /* curved arrow glyph */
        ctx.beginPath();
        ctx.arc(left, top, 4.6, Math.PI * 0.75, Math.PI * 0.25);
        ctx.lineWidth = 1.7;
        ctx.strokeStyle = '#333333';
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(left + 3.2, top - 4.6);
        ctx.lineTo(left + 5.6, top - 2.6);
        ctx.lineTo(left + 2.4, top - 1.4);
        ctx.closePath();
        ctx.fillStyle = '#333333';
        ctx.fill();
        ctx.restore();
      };
    }
  }

  /* the marquee you drag on empty canvas */
  fabric.Canvas.prototype.selectionColor = 'rgba(139,61,255,0.08)';
  fabric.Canvas.prototype.selectionBorderColor = VIO;
  fabric.Canvas.prototype.selectionLineWidth = 1.2;
})();

var RB_TINT = (function () {
  var m = {};
  Object.keys(RB_FAMILY).forEach(function (fam) {
    RB_FAMILY[fam].forEach(function (k) { m[k] = 'rbi-' + fam; });
  });
  return m;
})();
function rbTint(key) {
  if (RB_TINT[key]) return ' ' + RB_TINT[key];
  if (key.indexOf('anim:') === 0 || key.indexOf('trig:') === 0) return ' rbi-motion';
  if (key.indexOf('trans:') === 0) return ' rbi-motion';
  if (key.indexOf('panel:') === 0) return ' rbi-view';
  return '';
}

/* ══ NEW SLIDE + LAYOUT GALLERY (30 Jul 2026) ═══════════════════════════
   PowerPoint's New Slide opens a gallery of layouts rather than dropping a
   blank one. Same here: nine layouts built from the editor's own text and
   frame objects, so everything that arrives is immediately editable and
   exports like anything else. No slide-master dependency is created.
   Geometry is expressed as fractions of the slide, so a layout lands
   correctly at 16:9, 4:3 or any custom size.                            */
var SLIDE_LAYOUTS = [
  { id:'title', name:'Title slide', parts:[
    { k:'text', t:'Click to add title',    s:'heading',    x:.10, y:.34, w:.80, align:'center' },

    { k:'text', t:'Click to add text',  s:'body',    x:.08, y:.28, w:.84 } ]},
  { id:'section', name:'Section header', parts:[
    { k:'text', t:'Section title', s:'heading', x:.08, y:.40, w:.84 },
    { k:'text', t:'Add a short description', s:'body', x:.08, y:.58, w:.66 } ]},
  { id:'two-content', name:'Two content', parts:[
    { k:'text', t:'Click to add title', s:'heading', x:.08, y:.10, w:.84 },
    { k:'text', t:'Click to add text',  s:'body',    x:.08, y:.30, w:.39 },
    { k:'text', t:'Click to add text',  s:'body',    x:.53, y:.30, w:.39 } ]},
  { id:'comparison', name:'Comparison', parts:[
    { k:'text', t:'Click to add title', s:'heading',    x:.08, y:.08, w:.84 },
    { k:'text', t:'First heading',      s:'subheading', x:.08, y:.28, w:.39 },
    { k:'text', t:'Click to add text',  s:'body',       x:.08, y:.40, w:.39 },
    { k:'text', t:'Second heading',     s:'subheading', x:.53, y:.28, w:.39 },
    { k:'text', t:'Click to add text',  s:'body',       x:.53, y:.40, w:.39 } ]},
  { id:'title-only', name:'Title only', parts:[
    { k:'text', t:'Click to add title', s:'heading', x:.08, y:.10, w:.84 } ]},
  { id:'blank', name:'Blank', parts:[] },
  { id:'caption', name:'Content with caption', parts:[
    { k:'text',  t:'Click to add title', s:'subheading', x:.06, y:.12, w:.30 },
    { k:'text',  t:'Add a caption here', s:'body',       x:.06, y:.30, w:.30 },
    { k:'frame', x:.42, y:.12, w:.52, h:.74 } ]},
  { id:'pic-caption', name:'Picture with caption', parts:[
    { k:'frame', x:.06, y:.10, w:.88, h:.52 },
    { k:'text',  t:'Click to add title', s:'subheading', x:.06, y:.68, w:.88 },
    { k:'text',  t:'Add a caption here', s:'body',       x:.06, y:.80, w:.88 } ]}
];

var LAYOUT_TEXT = {
  heading:    { size:.062, weight:'700', fill:'#0F172A' },
  subheading: { size:.040, weight:'600', fill:'#0F172A' },
  body:       { size:.026, weight:'400', fill:'#334155' }
};

/* A miniature of a layout, drawn for the gallery. Mirrors the same parts
   array the builder uses, so a preview can never disagree with the result. */
function layoutThumb(L) {
  var W = 104, H = 58;
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">'
        + '<rect x=".5" y=".5" width="' + (W - 1) + '" height="' + (H - 1) + '" fill="#fff" stroke="#C8C6C4"/>';
  L.parts.forEach(function (p) {
    var x = p.x * W, y = p.y * H, w = p.w * W;
    if (p.k === 'frame') {
      s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (p.h * H)
        + '" fill="#F3F2F1" stroke="#B1AFAD" stroke-dasharray="2 2"/>'
        + '<path d="M' + (x + w / 2 - 5) + ' ' + (y + p.h * H / 2 + 3) + 'l4-5 3 3 3-4 4 6z" fill="#B1AFAD"/>';
    } else {
      var lh = p.s === 'heading' ? 5 : p.s === 'subheading' ? 3.6 : 2.4;
      var rows = p.s === 'body' ? 4 : 1;
      for (var i = 0; i < rows; i++) {
        var rw = (rows > 1 && i === rows - 1) ? w * 0.6 : w;
        var rx = p.align === 'center' ? x + (w - rw) / 2 : x;
        s += '<rect x="' + rx + '" y="' + (y + i * (lh + 2)) + '" width="' + rw + '" height="' + lh
          + '" rx="1" fill="' + (p.s === 'body' ? '#D8D6D4' : '#9C9A98') + '"/>';
      }
    }
  });
  return s + '</svg>';
}

/* Build one layout onto the CURRENT slide. */
function layoutBuild(id) {
  var L = SLIDE_LAYOUTS.filter(function (x) { return x.id === id; })[0];
  if (!L || !fc) return 0;
  var W = fc.getWidth() / fc.getZoom(), H = fc.getHeight() / fc.getZoom();
  var made = 0;
  L.parts.forEach(function (p) {
    if (p.k === 'frame') {
      /* reuse the editor's own frame object so Insert picture, Crop and
         export all behave exactly as they do for any other frame */
      if (typeof addFrame !== 'function') return;
      addFrame('rect');
      var o = fc.getActiveObject();
      if (o) {
        o.set({ left: p.x * W, top: p.y * H });
        if (o.width)  o.scaleX = (p.w * W) / o.width;
        if (o.height) o.scaleY = (p.h * H) / o.height;
        o.setCoords();
      }
      made++;
      return;
    }
    var d = LAYOUT_TEXT[p.s] || LAYOUT_TEXT.body;
    var t = new fabric.IText(p.t, {
      left: p.x * W, top: p.y * H, width: p.w * W,
      fontFamily: 'DM Sans, sans-serif',
      fontSize: Math.round(d.size * H), fontWeight: d.weight, fill: d.fill,
      textAlign: p.align || 'left', editable: true, splitByGrapheme: false
    });
    if (p.align === 'center') t.set({ left: p.x * W + (p.w * W - t.getScaledWidth()) / 2 });
    fc.add(t);
    made++;
  });
  fc.discardActiveObject();
  fc.renderAll();
  saveState();
  return made;
}

/* New slide, then the chosen layout on top of it. */
function slideNewWithLayout(id) {
  if (typeof addPage !== 'function') { showToast('Editor still loading'); return; }
  if (state.pages.length >= 40) { showToast('Maximum 40 slides allowed'); return; }
  addPage();
  setTimeout(function () {
    var n = layoutBuild(id);
    var L = SLIDE_LAYOUTS.filter(function (x) { return x.id === id; })[0];
    renderPageThumbs();
    if (typeof pageRefresh === 'function') pageRefresh();
    showToast('Slide ' + state.pages.length + ' added — ' + ((L && L.name) || 'layout')
      + (n ? ' (' + n + ' placeholder' + (n === 1 ? '' : 's') + ')' : ''));
  }, 90);
}

/* Turn pasted text into slides: a line with no leading spaces starts a new
   slide and becomes its title; indented lines become that slide's body. */
function slidesFromOutline() {
  var raw = prompt('Paste an outline.\n\nA line with no indent starts a new slide (its title).\nIndented lines become that slide’s text.');
  if (!raw || !raw.trim()) return;
  var groups = [], cur = null;
  raw.split(/\r?\n/).forEach(function (line) {
    if (!line.trim()) return;
    if (/^\s/.test(line)) { if (cur) cur.body.push(line.trim()); }
    else { cur = { title: line.trim(), body: [] }; groups.push(cur); }
  });
  if (!groups.length) { showToast('Nothing usable in that outline'); return; }
  if (groups.length + state.pages.length > 40) { showToast('That would go over the 40-slide limit'); return; }

  var i = 0;
  (function next() {
    if (i >= groups.length) {
      renderPageThumbs();
      showToast('Added ' + groups.length + ' slide' + (groups.length === 1 ? '' : 's') + ' from your outline');
      return;
    }
    var g = groups[i++];
    addPage();
    setTimeout(function () {
      var W = fc.getWidth() / fc.getZoom(), H = fc.getHeight() / fc.getZoom();
      var title = new fabric.IText(g.title, { left: .08 * W, top: .10 * H, fontFamily:'DM Sans, sans-serif',
        fontSize: Math.round(.062 * H), fontWeight:'700', fill:'#0F172A', editable:true });
      fc.add(title);
      if (g.body.length) {
        var body = new fabric.IText(g.body.map(function (b) { return '•  ' + b; }).join('\n'),
          { left: .08 * W, top: .30 * H, fontFamily:'DM Sans, sans-serif',
            fontSize: Math.round(.026 * H), fontWeight:'400', fill:'#334155', lineHeight:1.5, editable:true });
        fc.add(body);
      }
      fc.discardActiveObject(); fc.renderAll(); saveState();
      next();
    }, 90);
  })();
}

/* The gallery itself — PowerPoint's shape: a titled grid of layout
   miniatures, with the three slide actions underneath. */
function slideLayoutGallery() {
  var ex = document.getElementById('ld-layout-pop');
  if (ex) { ex.remove(); return; }
  var anchor = document.querySelector('[data-rb="new-slide"]');
  var pop = document.createElement('div');
  pop.id = 'ld-layout-pop';
  pop.className = 'ld-pop ld-layout-pop';
  pop.innerHTML = '<div class="ld-pop-head">Office theme</div>'
    + '<div class="ld-layout-grid">'
    + SLIDE_LAYOUTS.map(function (L) {
        return '<button class="ld-layout-card" data-layout="' + L.id + '" type="button">'
          + layoutThumb(L) + '<span>' + L.name + '</span></button>';
      }).join('')
    + '</div>'
    + '<div class="ld-layout-acts">'
      + '<button data-slideact="dup" type="button"><span class="material-icons-outlined">content_copy</span>Duplicate selected slide</button>'
      + '<button data-slideact="outline" type="button"><span class="material-icons-outlined">format_list_bulleted</span>Slides from outline…</button>'
      + '<button data-slideact="reuse" type="button"><span class="material-icons-outlined">folder_open</span>Reuse slides…</button>'
    + '</div>';
  document.body.appendChild(pop);
  if (typeof positionPop === 'function') positionPop(pop, anchor);

  pop.addEventListener('click', function (e) {
    var card = e.target.closest('[data-layout]');
    if (card) { slideNewWithLayout(card.getAttribute('data-layout')); pop.remove(); return; }
    var act = e.target.closest('[data-slideact]');
    if (!act) return;
    var a = act.getAttribute('data-slideact');
    pop.remove();
    if (a === 'dup')     { if (typeof pageDuplicateAt === 'function') pageDuplicateAt(state.currentPage); }
    if (a === 'outline') slidesFromOutline();
    if (a === 'reuse')   { openPanel('projects'); showToast('Open a saved design to reuse its slides'); }
  });
  if (typeof attachPopDismiss === 'function') attachPopDismiss(pop);
}

var _ribbonTab = 'home';

function ribbonSelection() {
  return (typeof fc !== 'undefined' && fc) ? fc.getActiveObject() : null;
}

/* ── Colour picker (30 Jul 2026) ───────────────────────────────────────
   Eight commands used to ask for a colour with window.prompt, so the user
   had to know and type a hex code. This is a small popover: a real colour
   wheel, the theme's own colours, the ones most recently used, and where
   it applies, None. Callback style so every old call site becomes a
   one-line swap.
     ldColour({ value, allowNone, title }, function (hex) { ... })
   The callback runs only on a choice — cancelling calls nothing, exactly
   like prompt() returning null.                                        */
var _ldRecentColours = [];

function ldColourRecall() {
  try {
    var s = localStorage.getItem('ld_recent_colours');
    if (s) _ldRecentColours = JSON.parse(s) || [];
  } catch (e) { _ldRecentColours = []; }
}
ldColourRecall();

function ldColourRemember(hex) {
  if (!hex) return;
  _ldRecentColours = [hex].concat(_ldRecentColours.filter(function (c) { return c !== hex; })).slice(0, 10);
  try { localStorage.setItem('ld_recent_colours', JSON.stringify(_ldRecentColours)); } catch (e) {}
}

/* Colours already in play beat a generic rainbow — these come from the
   live theme, so a picked colour tends to match the deck by default. */
function ldColourTheme() {
  var out = [];
  try {
    var th = (typeof themeCurrent === 'function') ? themeCurrent() : null;
    if (th) ['accent', 'bg', 'text', 'muted', 'alt'].forEach(function (k) {
      if (th[k] && /^#/.test(th[k]) && out.indexOf(th[k]) < 0) out.push(th[k]);
    });
  } catch (e) {}
  return out;
}

var LD_COLOUR_BASE = ['#000000','#FFFFFF','#1B1B1B','#64748B','#E2E8F0',
                      '#DC2626','#EA580C','#CA8A04','#16A34A','#0891B2',
                      '#2563EB','#7C3AED','#DB2777','#F472B6','#FDE047'];

function ldColour(opts, cb) {
  opts = opts || {};
  var start = /^#[0-9a-fA-F]{6}$/.test(opts.value || '') ? opts.value : '#7C3AED';

  var old = document.getElementById('ld-colour-pop');
  if (old) old.remove();

  var sw = function (c) {
    return '<button class="ld-c-sw" data-ldc="' + c + '" title="' + c + '" '
      + 'style="background:' + c + '"></button>';
  };
  var theme = ldColourTheme();

  var pop = document.createElement('div');
  pop.id = 'ld-colour-pop';
  pop.className = 'ld-modal';
  pop.innerHTML = '<div class="ld-modal-box" style="width:min(340px,92vw)">'
    + '<div class="ld-modal-head"><b>' + (opts.title || 'Choose a colour') + '</b>'
      + '<span class="sub"></span><button data-ldcx aria-label="Close">&times;</button></div>'
    + '<div class="ld-modal-body">'
      + '<div class="ld-c-row"><input type="color" id="ld-c-wheel" value="' + start + '">'
        + '<input type="text" id="ld-c-hex" value="' + start + '" maxlength="7" spellcheck="false"></div>'
      + (theme.length ? '<div class="ld-sec">This deck</div><div class="ld-c-grid">'
          + theme.map(sw).join('') + '</div>' : '')
      + (_ldRecentColours.length ? '<div class="ld-sec">Recently used</div><div class="ld-c-grid">'
          + _ldRecentColours.map(sw).join('') + '</div>' : '')
      + '<div class="ld-sec">Standard</div><div class="ld-c-grid">'
        + LD_COLOUR_BASE.map(sw).join('') + '</div>'
    + '</div>'
    + '<div class="ld-modal-foot">'
      + (opts.allowNone ? '<button data-ldcnone>None</button>' : '')
      + '<button data-ldcx>Cancel</button>'
      + '<button data-ldcok class="primary">Apply</button></div></div>';
  document.body.appendChild(pop);

  var wheel = pop.querySelector('#ld-c-wheel');
  var hexIn = pop.querySelector('#ld-c-hex');
  var done = function (v) { pop.remove(); if (v) ldColourRemember(v); cb(v); };

  wheel.addEventListener('input', function () { hexIn.value = wheel.value.toUpperCase(); });
  hexIn.addEventListener('input', function () {
    var v = hexIn.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) wheel.value = v;
  });

  pop.addEventListener('click', function (e) {
    var s = e.target.closest('[data-ldc]');
    if (s) { wheel.value = s.dataset.ldc; hexIn.value = s.dataset.ldc; return; }
    if (e.target.closest('[data-ldcnone]')) { done(''); return; }
    if (e.target.closest('[data-ldcok]')) {
      var v = hexIn.value.trim();
      done(/^#[0-9a-fA-F]{6}$/.test(v) ? v.toUpperCase() : wheel.value.toUpperCase());
      return;
    }
    if (e.target === pop || e.target.closest('[data-ldcx]')) { pop.remove(); return; }
  });

  pop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); pop.querySelector('[data-ldcok]').click(); }
    if (e.key === 'Escape') { e.preventDefault(); pop.remove(); }
  });
  setTimeout(function () { hexIn.focus(); hexIn.select(); }, 30);
}

/* Point the Presenter panel at one of its four tabs before it opens, so a
   ribbon button lands on the tab it is named after. Safe to call before
   the panel has ever been opened. */
function presTab(name) {
  try {
    if (panelData && panelData.presenter && panelData.presenter.tabs.indexOf(name) > -1) {
      panelData.presenter.activeTab = name;
    }
  } catch (e) {}
}

function renderRibbon() {
  var tabsEl = document.getElementById('ribbon-tabs');
  var bodyEl = document.getElementById('ribbon-body');
  if (!tabsEl || !bodyEl) return;
  var hasSel = !!ribbonSelection();

  /* Contextual tabs drop out when nothing is selected, and only the tab
     matching WHAT is selected appears — an icon gets Icon format, anything
     else gets Shape format. Never both. */
  var sel = ribbonSelection();
  var ctxId = !hasSel ? null : sel.isIcon ? 'icon' : sel.isIllo ? 'illo' : 'shape';
  var visible = RIBBON.filter(function (t) {
    if (!t.ctx) return true;
    return t.id === ctxId;
  });
  if (!visible.some(function (t) { return t.id === _ribbonTab; })) _ribbonTab = 'home';

  tabsEl.innerHTML = visible.map(function (t) {
    return '<button class="rb-tab' + (t.ctx ? ' ctx' : '')
      + (t.id === _ribbonTab ? ' active' : '') + '" data-rbtab="' + t.id
      + '" role="tab">' + t.name + '</button>';
  }).join('');

  var tab = visible.filter(function (t) { return t.id === _ribbonTab; })[0];
  if (!tab) { bodyEl.innerHTML = ''; return; }

  bodyEl.innerHTML = tab.groups.map(function (g) {
    return '<div class="rb-group"><div class="rb-row">' + g.items.map(function (it) {
      var f = it[3] || '';
      var off = f.indexOf('s') > -1 && !hasSel;
      var cls = 'rb-btn'
        + (f.indexOf('w') > -1 ? ' wide' : '')
        + (f.indexOf('m') > -1 ? ' mini' : '')
        + (f.indexOf('d') > -1 ? ' danger' : '')
        + (off ? ' disabled' : '');
      /* hand-drawn artwork where we have it, tinted glyph otherwise */
      var art = RB_SVG[it[2]]
        ? '<span class="rb-svg">' + RB_SVG[it[2]] + '</span>'
        : '<span class="material-icons-outlined' + rbTint(it[2]) + '">' + it[0] + '</span>';
      return '<button class="' + cls + (it[1] ? '' : ' icon-only') + '" data-rb="' + it[2] + '" title="' + (it[4] || it[1]) + '">'
        + art
        + (it[1] ? '<span>' + it[1] + '</span>' : '') + '</button>';
    }).join('') + '</div><div class="rb-label">' + g.name + '</div></div>';
  }).join('');
}

/* Run a ribbon command. Anything already wired as a data-action is
   delegated rather than reimplemented, so there is one implementation
   of each behaviour in the file. */
function ribbonRun(key) {
  var o = ribbonSelection();

  /* prefixed keys: anim:fade, trig:click, trans:push */
  if (key.indexOf('anim:') === 0)  { animSet(key.slice(5)); return; }
  if (key.indexOf('trig:') === 0)  { rbAnimTrigger(key.slice(5)); return; }
  if (key.indexOf('trans:') === 0) { transSet(key.slice(6)); return; }

  switch (key) {
    /* ── Home ── */
    case 'painter':       rbPainterPick(); return;
    case 'font-family':   rbFontFamily(); return;
    case 'font-size':     rbFontSizePicker(); return;
    case 'font-up':       rbFontStep(1); return;
    case 'font-down':     rbFontStep(-1); return;
    case 'wordart':       rbWordArt(); return;
    case 'strike':        rbTextStyle('strike'); return;
    case 'clear-format':  rbClearFormatting(); return;
    case 'highlight':     rbHighlight(); return;
    case 'p-left':        rbAlignText('left'); return;
    case 'p-center':      rbAlignText('center'); return;
    case 'p-right':       rbAlignText('right'); return;
    case 'p-justify':     rbAlignText('justify'); return;
    case 'bullets':       rbList('bullet'); return;
    case 'numbering':     rbList('number'); return;
    case 'line-spacing':  rbLineSpacing(); return;
    case 'select-all':    rbSelectAll(); return;
    case 'deselect':      rbDeselect(); return;
    case 'find':          rbFind(); return;

    /* ── Arrange ── */
    case 'a-left':        rbAlign('left'); return;
    case 'a-hcenter':     rbAlign('hcenter'); return;
    case 'a-right':       rbAlign('right'); return;
    case 'a-top':         rbAlign('top'); return;
    case 'a-vcenter':     rbAlign('vcenter'); return;
    case 'a-bottom':      rbAlign('bottom'); return;
    case 'dist-h':        rbDistribute('h'); return;
    case 'dist-v':        rbDistribute('v'); return;
    case 'rot-left':      rbRotate(-90); return;
    case 'rot-right':     rbRotate(90); return;
    case 'flip-h':        rbFlip('h'); return;
    case 'flip-v':        rbFlip('v'); return;
    case 'group':         layerGroup(); return;
    case 'ungroup':       layerUngroup(); return;
    case 'lock-on':       rbLock(true); return;
    case 'unlock-all':    rbUnlockAll(); return;

    /* ── Design ── */
    case 'theme-save':    rbSaveTheme(); return;
    case 'theme-accent':  rbThemeAccent(); return;
    case 'theme-fonts':   rbThemeFont(); return;
    case 'page-size':     rbPageSize(); return;
    case 'orientation':   rbOrientation(); return;
    case 'bg-to-all':     rbBgToAll(); return;

    /* ── Animate ── */
    case 'anim-ms':       rbAnimTiming('ms'); return;
    case 'anim-delay':    rbAnimTiming('delay'); return;

    /* ── View ── */
    case 'fit-width':     rbFitWidth(); return;
    case 'v-ruler':       rbToggleView('ruler'); return;
    case 'v-grid':        rbToggleView('grid'); return;
    case 'v-guides':      rbToggleView('guides'); return;
    case 'panel-layers':  rbTogglePanel('layers'); return;
    case 'panel-props':   rbTogglePanel('effects2'); return;

    /* ── Review ── */
    case 'proof-spell':     rbProof('spell'); return;
    case 'proof-grammar':   rbProof('grammar'); return;
    case 'comment-add':     rbAddComment(); return;
    case 'comment-resolve': rbResolveComment(); return;
    case 'a11y-check':      openPanel('a11y'); return;

    /* ── Present ── */
    case 'present-start':   rbPresent(false); return;
    case 'present-current': rbPresent(true); return;
    /* Fixed 30 Jul 2026. All three opened the Presenter panel on whatever
       tab happened to be open last, so "Record" could land you on Notes
       and "Rehearse" could start a timed run you could not see. Each now
       lands on its own tab. Record deliberately does NOT start capturing
       on one click — PowerPoint also opens a recording view first and
       waits for you to press record, and silently switching on someone's
       microphone would be worse than an extra click. */
    case 'presenter-view':  presTab('Notes');    openPanel('presenter'); return;
    case 'rehearse':        presTab('Rehearse'); openPanel('presenter'); rehearseStart(); return;
    case 'record':          presTab('Record');   openPanel('presenter'); return;
  }

  if (key.indexOf('panel:') === 0) { openPanel(key.slice(6)); return; }
  if (key.indexOf('act:') === 0) {
    var el = document.querySelector('[data-action="' + key.slice(4) + '"]');
    if (el) el.click();
    return;
  }

  switch (key) {
    /* delegate to the existing implementations */
    case 'copy':        ctxCopy(); break;
    case 'paste':       ctxPaste(); break;
    case 'cut':         ctxCopy(); ctxDelete(); break;
    case 'duplicate':   ctxDuplicate(); break;
    case 'delete':      ctxDelete(); break;
    case 'lock':        ctxLock(); break;
    case 'link':        ctxLink(); break;
    case 'alttext':     ctxAltText(); break;
    case 'info':        ctxInfo(); break;
    case 'centre':      ctxAlign(); break;

    case 'new-slide':   slideLayoutGallery(); return;
    case 'add-page':    addPage(); break;
    case 'del-page':    deletePage(); break;
    case 'dup-page': {
      var b = document.querySelector('.page-thumb.active [data-pt="dup"]');
      if (b) b.click(); else showToast('Open a slide first');
      break;
    }

    case 'front':       if (o) { o.bringToFront();  fc.renderAll(); saveState(); } break;
    case 'back':        if (o) { o.sendToBack();    fc.renderAll(); saveState(); } break;
    case 'forward':     if (o) { o.bringForward();  fc.renderAll(); saveState(); } break;
    case 'backward':    if (o) { o.sendBackwards(); fc.renderAll(); saveState(); } break;
    case 'middle':
      if (o) { o.set({ top: (fc.getHeight() / fc.getZoom() - o.getScaledHeight()) / 2 });
               fc.renderAll(); saveState(); }
      break;

    case 'zoom-in':  case 'zoom-out': case 'zoom-fit': {
      /* call the zoom functions directly — the fit button no longer exists
         in the bottom bar, so clicking a DOM node is not reliable */
      if (typeof setZoom !== 'function') break;
      if (key === 'zoom-fit') { setZoom(calculateFitZoom()); break; }
      setZoom(state.zoom + (key === 'zoom-in' ? 10 : -10));
      break;
    }

    case 'toggle-notes':   toggleNotes(); break;
    case 'toggle-sidebar': {
      var sb = document.querySelector('[data-action="toggle-sidebar"]');
      if (sb) sb.click();
      break;
    }
    case 'present': {
      var pb = document.querySelector('[data-action="present"]');
      if (pb) pb.click();
      break;
    }
    case 'upload-image': dom.uploadImgInput.click(); break;
    case 'upload-pptx':  dom.uploadPptxInput.click(); break;
    case 'add-textbox':  addText('heading'); break;

    /* frame-aware commands — the reason Shape format exists */
    case 'frame-fill':
      if (o && o.isFrame) { _frameFillTarget = o; dom.uploadImgInput.click(); }
      else showToast('Select a shape or frame first');
      break;
    case 'frame-clear':
      if (o && o.isFrame) {
        o.frameSrc = null; o.frameRect = null; o._frameImg = null;
        refreshFrame(o); saveState(); showToast('Photo removed');
      } else showToast('Select a frame first');
      break;
    case 'shapes': break;   /* handled as a flyout by the click listener */
    case 'shape-outline': {
      if (!o) { showToast('Select a shape first'); break; }
      ldColour({ value: o.stroke || '#1B1B1B', allowNone: true, title: 'Shape outline' }, function (oc) {
        if (o.isFrame && o._objects && o._objects[0]) {
          o._objects[0].set({ stroke: oc || '', strokeWidth: oc ? 2 : 0 });
          o.dirty = true;
        } else {
          o.set({ stroke: oc || '', strokeWidth: oc ? 2 : 0 });
        }
        fc.renderAll(); saveState();
      });
      break;
    }
    case 'shape-fill': {
      if (!o) { showToast('Select a shape first'); break; }
      var cur = o.isFrame ? (o.frameFill || '#7C3AED') : (o.fill || '#7C3AED');
      ldColour({ value: cur, title: 'Shape fill' }, function (c) {
        if (!c) return;
        if (o.isFrame) { o.frameFill = c; refreshFrame(o); }
        else { o.set('fill', c); fc.renderAll(); }
        saveState();
      });
      break;
    }

    /* text formatting — acts on the selected text object */
    case 'bold': case 'italic': case 'underline': {
      if (!o || !/text/.test(o.type)) { showToast('Select a text box first'); break; }
      if (key === 'bold')       o.set('fontWeight', o.fontWeight === 'bold' ? 'normal' : 'bold');
      if (key === 'italic')     o.set('fontStyle', o.fontStyle === 'italic' ? 'normal' : 'italic');
      if (key === 'underline')  o.set('underline', !o.underline);
      fc.renderAll(); saveState();
      break;
    }
    case 'text-colour': {
      if (!o || !/text/.test(o.type)) { showToast('Select a text box first'); break; }
      ldColour({ value: o.fill || '#000000', title: 'Font colour' }, function (tc) {
        if (tc) { o.set('fill', tc); fc.renderAll(); saveState(); }
      });
      break;
    }
    case 'align-left': case 'align-center': case 'align-right': {
      if (!o) { showToast('Select something first'); break; }
      var side = key.slice(6);
      if (/text/.test(o.type)) {
        o.set('textAlign', side === 'center' ? 'center' : side);
        fc.renderAll(); saveState();
      } else {
        var sw = fc.getWidth() / fc.getZoom(), ow = o.getScaledWidth();
        o.set({ left: side === 'left' ? 0 : side === 'right' ? sw - ow : (sw - ow) / 2 });
        fc.renderAll(); saveState();
      }
      break;
    }

    /* slide setup */
    case 'size-169': case 'size-43': {
      var r = key === 'size-169' ? [12192000, 6858000] : [9144000, 6858000];
      if (typeof setSlideAspect === 'function') {
        setSlideAspect(r[0], r[1]);
        showToast(key === 'size-169' ? 'Slide set to 16:9' : 'Slide set to 4:3');
      }
      break;
    }
    case 'bg-colour': {
      ldColour({ value: '#FFFFFF', title: 'Slide background' }, function (bc) {
        if (bc) { fc.setBackgroundColor(bc, fc.renderAll.bind(fc)); saveState(); }
      });
      break;
    }

    /* ── Contextual format tabs (fixed 30 Jul 2026) ──────────────────────
       These twelve commands were already implemented and already wired for
       the side panels, but the ribbon buttons carry data-rb (not
       data-action), so the panel's delegated listener never saw them and
       every one of them fell through to "Not wired yet". The act: prefix
       above cannot help either — it needs a DOM node carrying that
       data-action, and these twelve exist ONLY as ribbon buttons. So they
       call the same single implementation directly, exactly like the other
       eighty-odd ribbon commands in this switch. No behaviour is
       duplicated: each function still owns its own "select something
       first" guard. */

    /* Shape format → Crop in frame */
    case 'frame-crop':       frameCropStart();     break;
    case 'frame-crop-in':    frameCropZoom(1);     break;
    case 'frame-crop-out':   frameCropZoom(-1);    break;
    case 'frame-crop-reset': frameCropReset();     break;
    case 'frame-crop-done':  frameCropEnd();       break;

    /* Icon format */
    case 'icon-replace':     startIconReplace();   break;
    case 'icon-colour':      setIconColour();      break;
    case 'icon-thinner':     setIconWeight(-1);    break;
    case 'icon-thicker':     setIconWeight(1);     break;

    /* Graphic format → Recolour */
    case 'illo-prev':        cycleIllustrationColour(-1); break;
    case 'illo-next':        cycleIllustrationColour(1);  break;

    /* Design → Apply the current theme to every slide */
    case 'theme-apply-current': themeApply(null);  break;

    default: showToast('Not wired yet: ' + key);
  }
  renderRibbon();
}

/* When "Drop photo" is used, the next upload goes straight into that frame. */
var _frameFillTarget = null;

function initRibbon() {
  var ribbon = document.getElementById('ribbon');
  var tabsEl = document.getElementById('ribbon-tabs');
  var bodyEl = document.getElementById('ribbon-body');
  if (!ribbon || !tabsEl || !bodyEl) return;

  renderRibbon();

  tabsEl.addEventListener('click', function (e) {
    var t = e.target.closest('[data-rbtab]');
    if (!t) return;
    if (ribbon.classList.contains('collapsed')) ribbon.classList.remove('collapsed');
    _ribbonTab = t.dataset.rbtab;
    renderRibbon();
  });

  /* PowerPoint behaviour: double-click the strip to collapse to tabs only */
  tabsEl.addEventListener('dblclick', function () {
    ribbon.classList.toggle('collapsed');
    try { localStorage.setItem('ld_ribbon_collapsed',
      ribbon.classList.contains('collapsed') ? '1' : '0'); } catch (e) {}
    window.dispatchEvent(new Event('resize'));
  });
  try {
    if (localStorage.getItem('ld_ribbon_collapsed') === '1') ribbon.classList.add('collapsed');
  } catch (e) {}

  bodyEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rb]');
    if (!b) return;
    /* Shapes is a gallery flyout, not a one-shot command */
    if (b.dataset.rb === 'shapes') {
      if (_sgOpen) closeShapesGallery(); else openShapesGallery(b);
      return;
    }
    closeShapesGallery();
    ribbonRun(b.dataset.rb);
  });

  /* selection drives the contextual tab + which buttons are live */
  var t = setInterval(function () {
    if (typeof fc === 'undefined' || !fc || !fc.on) return;
    clearInterval(t);
    ['selection:created', 'selection:updated', 'selection:cleared'].forEach(function (ev) {
      fc.on(ev, function () {
        /* jump to the matching format tab the moment something is selected */
        if (ev !== 'selection:cleared' && _ribbonTab === 'home') {
          var s = ribbonSelection();
          _ribbonTab = !s ? 'home' : s.isIcon ? 'icon' : s.isIllo ? 'illo' : 'shape';
        }
        renderRibbon();
      });
    });
    renderRibbon();
  }, 300);
}

/* A vivid, harmonious palette so shapes/lines/graphics read multi-coloured
   rather than a wall of one hue. Cycled per card. */
var EL_COLORS = ['#7C3AED', '#EA6A52', '#12A5A0', '#2563EB', '#EAB308',
                 '#DB2777', '#059669', '#E8590C', '#8B5CF6', '#0EA5E9', '#C13327', '#0F766E'];

/* Build the panel HTML for a tab — "All" shows every group. */
function renderElementCatalog(tab) {
  var html = '';
  var _ci = 0;
  ELEMENT_CATALOG.forEach(function (grp, gi) {
    if (tab && tab !== 'All' && grp.tab !== tab) return;
    html += '<div class="panel-subhead">' + grp.name
          + (grp.note ? ' <span>' + grp.note + '</span>' : '') + '</div>';
    var _isFrames = grp.items.some(function (it) { return it.frame; });
    html += '<div class="element-grid' + (_isFrames ? ' element-grid-frames' : '') + '">' + grp.items.map(function (it, ii) {
      var style = it.s
        ? 'fill:none;stroke:currentColor;stroke-width:' + (it.w || 2)
          + ';stroke-linecap:round;stroke-linejoin:round'
          + (it.dash ? ';stroke-dasharray:' + it.dash.join(' ') : '')
        : 'fill:currentColor' + (it.e ? ';fill-rule:evenodd' : '');
      var ecol = it.frame ? '' : ';--ec:' + EL_COLORS[(_ci++) % EL_COLORS.length];
      return '<div class="element-card' + (it.frame ? ' frame-card' : '')
        + '" style="animation-delay:' + (ii * 0.02) + 's' + ecol + '"'
        + ' data-action="add-catalog" data-g="' + gi + '" data-i="' + ii + '"'
        + ' title="' + it.n + '">'
        + '<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">'
        + (it.frame ? frameScenePaint(it.d, 50, 50, ii) : '<path d="' + it.d + '" style="' + style + '"/>')
        + '</svg></div>';
    }).join('') + '</div>';
  });
  return html || '<div class="panel-placeholder">'
    + '<span class="material-icons-outlined">category</span>'
    + '<p><strong>Nothing here yet</strong><br>Pick another category.</p></div>';
}

/* Put one item (from either the catalog or the shapes gallery) on the slide.
   Filled = live frame (absorbs a picture). Stroke art = plain path. */
function placeShape(it) {
  if (!it || !fc) return;
  if (it.frame) { addFrame(it.frame); return; }

  var slideW = fc.getWidth() / fc.getZoom();
  var slideH = fc.getHeight() / fc.getZoom();

  if (!it.s) {
    makeFrameShape({ d: it.d, pathW: 50, pathH: 50, kind: it.n,
                     look: 'solid', fill: '#7C3AED', evenOdd: !!it.e,
                     boxW: Math.max(80, Math.min(slideW, slideH) * 0.32) });
    showToast(it.n + ' added — drop a photo in it');
    return;
  }

  var p = new fabric.Path(it.d, {
    fill: '', stroke: '#7C3AED', strokeWidth: it.w || 2,
    strokeLineCap: 'round', strokeLineJoin: 'round',
    strokeDashArray: it.dash || null, strokeUniform: true,
    objectCaching: false
  });
  var target = Math.max(60, Math.min(slideW, slideH) * 0.45);
  p.scale(target / Math.max(p.width || 1, p.height || 1));
  p.set({ left: (slideW - p.getScaledWidth()) / 2,
          top:  (slideH - p.getScaledHeight()) / 2 });
  fc.add(p).setActiveObject(p);
  fc.renderAll();
  saveState();
  showToast(it.n + ' added');
}

function addCatalogItem(gi, ii) {
  histLabel('Added element');
  var grp = ELEMENT_CATALOG[gi];
  placeShape(grp && grp.items[ii]);
}

function openShapesGallery(anchor) {
  var g = document.getElementById('shape-gallery');
  if (!g) {
    g = document.createElement('div');
    g.id = 'shape-gallery';
    g.className = 'shape-gallery';
    g.innerHTML = SHAPES_GALLERY.map(function (grp, gi) {
      return '<div class="sg-head">' + grp.name + '</div><div class="sg-row">'
        + grp.items.map(function (it, ii) {
            var st = it.s
              ? 'fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round'
              : 'fill:currentColor' + (it.e ? ';fill-rule:evenodd' : '');

              + '<svg viewBox="0 0 50 50"><path d="' + it.d + '" style="' + st + '"/></svg></button>';
          }).join('')
        + '</div>';
    }).join('');
    document.body.appendChild(g);
    g.addEventListener('click', function (e) {
      var b = e.target.closest('[data-sg]');
      if (!b) return;
      var p = b.dataset.sg.split(':');
      placeShape(SHAPES_GALLERY[+p[0]].items[+p[1]]);
      closeShapesGallery();
    });
  }
  var r = anchor.getBoundingClientRect();
  g.style.left = Math.min(r.left, window.innerWidth - 344) + 'px';
  g.style.top = (r.bottom + 4) + 'px';
  g.classList.add('open');
  _sgOpen = true;
}

function closeShapesGallery() {
  var g = document.getElementById('shape-gallery');
  if (g) g.classList.remove('open');
  _sgOpen = false;
}

document.addEventListener('click', function (e) {
  if (_sgOpen && !e.target.closest('#shape-gallery') && !e.target.closest('[data-rb="shapes"]')) {

});

/* SVG path text → the [cmd, x, y, ...] command array the IR/writer expects. */
function framePathToCmds(d) {
  /* Proper tokenizer: H/V become L (using the running point), M with extra
     pairs becomes M+L, and C/Q/A keep their own arities. The old version only
     knew M/L/C/Z, so H/V/A numbers leaked into the previous command and drew
     stray diagonals (grids and filled shapes). */
  var out = [], re = /([MLHVCSQTAZ])([^MLHVCSQTAZ]*)/gi, m;
  var cx = 0, cy = 0, sx = 0, sy = 0, i;
  while ((m = re.exec(d))) {
    var c = m[1].toUpperCase();
    var nums = (m[2].match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
    if (c === 'Z') { out.push(['Z']); cx = sx; cy = sy; }
    else if (c === 'M') {
      for (i = 0; i + 1 < nums.length; i += 2) {
        cx = nums[i]; cy = nums[i + 1];
        out.push([i === 0 ? 'M' : 'L', cx, cy]);
        if (i === 0) { sx = cx; sy = cy; }
      }
    }
    else if (c === 'L' || c === 'T') {
      for (i = 0; i + 1 < nums.length; i += 2) { cx = nums[i]; cy = nums[i + 1]; out.push(['L', cx, cy]); }
    }
    else if (c === 'H') { for (i = 0; i < nums.length; i++) { cx = nums[i]; out.push(['L', cx, cy]); } }
    else if (c === 'V') { for (i = 0; i < nums.length; i++) { cy = nums[i]; out.push(['L', cx, cy]); } }
    else if (c === 'C') { for (i = 0; i + 5 < nums.length; i += 6) { out.push(['C', nums[i], nums[i+1], nums[i+2], nums[i+3], nums[i+4], nums[i+5]]); cx = nums[i+4]; cy = nums[i+5]; } }
    else if (c === 'S') { for (i = 0; i + 3 < nums.length; i += 4) { out.push(['C', cx, cy, nums[i], nums[i+1], nums[i+2], nums[i+3]]); cx = nums[i+2]; cy = nums[i+3]; } }
    else if (c === 'Q') { for (i = 0; i + 3 < nums.length; i += 4) { out.push(['Q', nums[i], nums[i+1], nums[i+2], nums[i+3]]); cx = nums[i+2]; cy = nums[i+3]; } }
    else if (c === 'A') { for (i = 0; i + 6 < nums.length; i += 7) { out.push(['A', nums[i], nums[i+1], nums[i+2], nums[i+3], nums[i+4], nums[i+5], nums[i+6]]); cx = nums[i+5]; cy = nums[i+6]; } }
  }
  return out;
}

/* Paint the photo, cover-fitted, for a frame that has one. */
function frameFace(obj, wPx, hPx) {
  var cv = document.createElement('canvas');
  cv.width = Math.max(2, Math.round(wPx));
  cv.height = Math.max(2, Math.round(hPx));
  var g = cv.getContext('2d');
  var im = obj._frameImg, fr = obj.frameRect;
  if (fr) {
    /* PPT stretch fillRect: insets as fractions of the box.
       Negative = the photo overflows the mask = Canva's cover-crop. */
    g.drawImage(im, cv.width * fr.l, cv.height * fr.t,
                    cv.width * (1 - fr.l - fr.r), cv.height * (1 - fr.t - fr.b));
  } else {
    var sc = Math.max(cv.width / im.width, cv.height / im.height);
    g.drawImage(im, (cv.width - im.width * sc) / 2, (cv.height - im.height * sc) / 2,
                im.width * sc, im.height * sc);
  }
  return cv;
}

/* The empty drop-target look: grey field + photo glyph. Only used by the
   Frames group; a plain shape stays a plain coloured shape until filled. */
function framePlaceholder(wPx, hPx) {
  var cv = document.createElement('canvas');
  cv.width = Math.max(2, Math.round(wPx));
  cv.height = Math.max(2, Math.round(hPx));
  var g = cv.getContext('2d');
  g.fillStyle = '#E9EAEE'; g.fillRect(0, 0, cv.width, cv.height);
  var s = Math.max(18, Math.min(cv.width, cv.height) * 0.22);
  var cx = cv.width / 2, cy = cv.height / 2;
  g.strokeStyle = '#9AA0AC'; g.lineWidth = Math.max(2, s * 0.07); g.lineJoin = 'round';
  g.strokeRect(cx - s / 2, cy - s * 0.4, s, s * 0.8);
  g.beginPath();
  g.moveTo(cx - s / 2, cy + s * 0.4);
  g.lineTo(cx - s * 0.1, cy - s * 0.05);
  g.lineTo(cx + s * 0.16, cy + s * 0.18);
  g.lineTo(cx + s * 0.3, cy + s * 0.05);
  g.lineTo(cx + s / 2, cy + s * 0.4);
  g.stroke();
  g.beginPath(); g.arc(cx + s * 0.22, cy - s * 0.18, s * 0.09, 0, Math.PI * 2); g.stroke();
  return cv;
}

/* Rebuild a frame group's visual from its own stored state, in place.
   Three states: photo inside · empty placeholder · plain coloured shape. */
function frameAperture(grp) {
  var objs = (grp && grp._objects) || [];
  for (var i = 0; i < objs.length; i++) if (objs[i].isAperture) return objs[i];
  return objs[0] || null;
}

function refreshFrame(grp) {
  if (!grp || !grp.isFrame) return;
  var path = frameAperture(grp);
  if (!path) return;
  /* the photo fills the APERTURE, which on a device frame is smaller than
     the group (the bezel takes the rest) */
  var wPx = (path.width  || grp.width)  * (grp.scaleX || 1);
  var hPx = (path.height || grp.height) * (grp.scaleY || 1);

  if (grp._frameImg) {
    path.set({ fill: new fabric.Pattern({ source: frameFace(grp, wPx, hPx), repeat: 'no-repeat' }),
               stroke: '', strokeDashArray: null, strokeWidth: 0 });
  } else if (grp.frameLook === 'placeholder') {
    path.set({ fill: new fabric.Pattern({ source: framePlaceholder(wPx, hPx), repeat: 'no-repeat' }),
               stroke: '#C3C7D1', strokeDashArray: [6, 5], strokeWidth: 1.5 });
  } else {
    /* plain shape — still a frame, still accepts a photo */
    path.set({ fill: grp.frameFill || '#7C3AED',
               stroke: '', strokeDashArray: null, strokeWidth: 0 });
  }
  grp.dirty = true;
  fc && fc.requestRenderAll();
}

/* Core builder. EVERY filled element on the canvas is one of these, so
   everything absorbs pictures — there are no dead shapes.
   opts: d, pathW, pathH, kind, look ('placeholder'|'solid'), fill, boxW, evenOdd */
function makeFrameShape(opts) {
  if (!fc) return null;
  var kx = opts.boxW / opts.pathW;
  var boxH = opts.boxW * opts.pathH / opts.pathW;
  var ky = boxH / opts.pathH;
  /* scale the normalised path into the on-canvas box */
  function scaleCmd(c) {
    if (c[0] === 'Z') return 'Z';
    if (c[0] === 'A') return 'A ' + (c[1] * kx) + ' ' + (c[2] * ky) + ' ' + c[3] + ' ' + c[4] + ' ' + c[5]
      + ' ' + (c[6] * kx) + ' ' + (c[7] * ky);
    var o = [c[0]];
    for (var j = 1; j < c.length; j += 2) o.push(c[j] * kx, c[j + 1] * ky);
    return o.join(' ');
  }
  var d = framePathToCmds(opts.d).map(scaleCmd).join(' ');
  function scaled(pathData) { return framePathToCmds(pathData).map(scaleCmd).join(' '); }

  var p = new fabric.Path(d, {
    fill: opts.fill || '#7C3AED',
    fillRule: opts.evenOdd ? 'evenodd' : 'nonzero',
    selectable: false, evented: false,
    originX: 'left', originY: 'top',
    isAperture: true
  });

  /* device bezel: decorative paths that never take a photo */
  var members = [], back = [], front = [];
  (opts.deco || []).forEach(function (dc) {
    var dp = new fabric.Path(scaled(dc[0]), {
      fill: dc[1], selectable: false, evented: false,
      originX: 'left', originY: 'top', objectCaching: false
    });
    (dc[2] === 'front' ? front : back).push(dp);
  });
  members = back.concat([p], front);

  var slideW2 = fc.getWidth() / fc.getZoom();
  var slideH2 = fc.getHeight() / fc.getZoom();
  var grp = new fabric.Group(members, {
    isFrame: true,
    frameKind: opts.kind || 'shape',
    framePath: opts.d, framePathW: opts.pathW, framePathH: opts.pathH,
    frameSrc: null, frameRect: null,
    frameLook: opts.look || 'solid',
    frameFill: opts.fill || '#7C3AED',
    frameDevice: !!opts.deco
  });
  if (opts.at) {
    grp.set({ left: opts.at[0], top: opts.at[1] });
  } else {
    grp.set({ left: Math.max(0, (slideW2 - grp.getScaledWidth()) / 2),
              top:  Math.max(0, (slideH2 - grp.getScaledHeight()) / 2) });
  }
  fc.add(grp);
  if (!opts.quiet) fc.setActiveObject(grp);
  refreshFrame(grp);
  if (!opts.quiet) { fc.renderAll(); saveState(); }
  return grp;
}

function addFrame(kind, atX, atY) {
  var def = FRAME_DEFS[kind] || FRAME_DEFS.square;
  var slideW = fc ? fc.getWidth() / fc.getZoom() : 800;
  var g = makeFrameShape({ d: def.d, pathW: def.w, pathH: def.h, kind: kind,
                           look: 'placeholder', deco: def.deco || null,
                           boxW: Math.max(160, slideW * (def.device ? 0.34 : 0.3)) });
  if (g && atX != null) {
    g.set({ left: atX - g.getScaledWidth() / 2, top: atY - g.getScaledHeight() / 2 });
    fc.renderAll();

}

/* Keep the mask crisp when the frame is resized. */
(function () {
  var t = setInterval(function () {
    if (typeof fc === 'undefined' || !fc || !fc.on) return;
    clearInterval(t);
    fc.on('object:scaling', function (e) { if (e.target && e.target.isFrame) e.target.dirty = true; });
    /* FIX (Fable, purple-frame bug): only refresh USER frames (frameSrc/frameKind).
       An IMPORTED pptx picture-frame has neither — its pattern fill IS the photo,
       and refreshFrame() wipes it to the #7C3AED placeholder purple on any
       double-click/drag (object:modified). Guard mirrors rehydrateFrames(). */
    fc.on('object:modified', function (e) { if (e.target && e.target.isFrame && (e.target.frameSrc || e.target.frameKind)) refreshFrame(e.target); });

/* Canva-style preview: a soft landscape (sky · sun · cloud · rolling hills)

   brief) and distinct from Canva's blue+green. */

  { s0:'#FFB27A', s1:'#FFD9C2', s2:'#FFF1E8', sun:'#FFC24D', far:'#EA6A52', near:'#C13327', cloud:'#FFF6EF' }, /* sunset */
  { s0:'#B39DFF', s1:'#DBD2FF', s2:'#F1EEFF', sun:'#FDE68A', far:'#8B5CF6', near:'#5B21B6', cloud:'#FFFFFF' }, /* violet */
  { s0:'#F7B8D2', s1:'#FBD6E5', s2:'#FDEAF2', sun:'#FFD36E', far:'#DB2777', near:'#831843', cloud:'#FFFFFF' }, /* berry */
  { s0:'#FFD98A', s1:'#FFE9B8', s2:'#FFF6E4', sun:'#F59E0B', far:'#E8590C', near:'#9A3412', cloud:'#FFFDF5' }, /* amber */
  { s0:'#7FC5E8', s1:'#BFE3F5', s2:'#EAF6FD', sun:'#FFE08A', far:'#2F8FD6', near:'#12518A', cloud:'#FFFFFF' }, /* sky */
];

function frameScenePaint(pathD, W, H, pi) {

      + '<path d="M0 ' + (H * 0.66) + ' Q ' + (W * 0.32) + ' ' + (H * 0.5) + ' ' + (W * 0.62) + ' ' + (H * 0.64)

      + '<path d="M0 ' + (H * 0.8) + ' Q ' + (W * 0.42) + ' ' + (H * 0.66) + ' ' + W + ' ' + (H * 0.82)
        + ' V ' + H + ' H 0 Z" fill="' + P.near + '"/>'

function framePreviewSvg(kind, size, pi) {
  var def = FRAME_DEFS[kind];
  if (!def) return '';
  var vb = '0 0 ' + def.w + ' ' + def.h;
  var h = Math.round(size * def.h / def.w);
  var parts = '';
  (def.deco || []).filter(function (d) { return d[2] !== 'front'; })
    .forEach(function (d) { parts += '<path d="' + d[0] + '" fill="' + d[1] + '"/>'; });
  parts += frameScenePaint(def.d, def.w, def.h, pi);
  (def.deco || []).filter(function (d) { return d[2] === 'front'; })
    .forEach(function (d) { parts += '<path d="' + d[0] + '" fill="' + d[1] + '"/>'; });

function renderFramePanel(tab) {

/* ── Font size: PowerPoint-style picker + Bigger/Smaller ladder ── */
var FONT_SIZE_LADDER = [8,9,10,11,12,14,16,18,20,24,28,32,36,40,44,54,60,66,72,80,96,120,144,180,240,300,360];
function rbSetFontSize(px) {
  var o = rbText(); if (!o) return;

  o.dirty = true; fc.renderAll(); saveState();
}
function _sizeStep(cur, dir) {
  var i, next = null;
  if (dir > 0) {
    for (i = 0; i < FONT_SIZE_LADDER.length; i++) { if (FONT_SIZE_LADDER[i] > cur + 0.5) { next = FONT_SIZE_LADDER[i]; break; } }
    if (next == null) next = Math.min(400, Math.round(cur) + 8);
  } else {
    for (i = FONT_SIZE_LADDER.length - 1; i >= 0; i--) { if (FONT_SIZE_LADDER[i] < cur - 0.5) { next = FONT_SIZE_LADDER[i]; break; } }
    if (next == null) next = Math.max(4, Math.round(cur) - 2);
  }
  return next;
}
function rbFontStep(dir) {
  var o = rbText();
  if (!rbNeed(o, 'Select a text box first')) return;
  rbSetFontSize(_sizeStep(o.fontSize || 24, dir));
}
function rbFontSizePicker() {
  var o = rbText();

}
function openSizePopover() {

  pop.id = 'ld-size-pop'; pop.className = 'ld-pop ld-pop-scroll';
  function cur() { var t = rbText(); return t ? Math.round(t.fontSize || 24) : 24; }
  function apply(v) { rbSetFontSize(v); build(); }
  function build() {
    var c = cur();
    pop.innerHTML =
      '<div class="ld-pop-head">Font size</div>' +
      '<div class="ld-pop-step">' +
        '<button class="ld-pop-btn" data-sz-dec type="button" aria-label="Smaller">&minus;</button>' +
        '<span class="ld-pop-val">' + c + '</span>' +
        '<button class="ld-pop-btn" data-sz-inc type="button" aria-label="Bigger">+</button>' +
      '</div>' +
      '<div class="ld-pop-list">' +
      FONT_SIZE_LADDER.map(function (s) {
        var on = s === c;
        return '<button class="ld-pop-item' + (on ? ' on' : '') + '" data-sz="' + s + '" type="button">' +
          '<span class="material-icons-outlined">' + (on ? 'check' : '') + '</span>' + s + '</button>';
      }).join('') + '</div>';
  }
  build();
  document.body.appendChild(pop);

/* Shared popover placement + dismiss helpers (used by font/size/spacing). */
function positionPop(pop, anchor) {

  var pr = pop.getBoundingClientRect();
  if (pr.right > window.innerWidth - 8) pop.style.left = Math.round(window.innerWidth - pr.width - 8) + 'px';
  if (pr.bottom > window.innerHeight - 8) pop.style.top = Math.max(8, Math.round(window.innerHeight - pr.height - 8)) + 'px';

    function onDown(ev) { if (!pop.contains(ev.target)) done(); }

function _waGradCoords(dir, w, h) { return dir === 'v' ? { x1:0, y1:0, x2:0, y2:h } : { x1:0, y1:0, x2:w, y2:0 }; }

        '<span class="ld-pop-val">' + (Math.round(c * 100) / 100) + '&times;</span>' +
        '<button class="ld-pop-btn" data-sp-inc type="button" aria-label="Increase spacing">+</button>' +

/* ── Arrange ── */
function rbAlign(edge) {

  var W = fc.getWidth() / fc.getZoom(), H = fc.getHeight() / fc.getZoom();
  var w = o.getScaledWidth(), h = o.getScaledHeight();

  if (edge === 'bottom') o.set('top', H - h);

}
function rbDistribute(axis) {
  var a = rbSel();

    showToast('Select three or more objects to distribute'); return;
  }
  var objs = a._objects.slice();

  var sizeKey = axis === 'h' ? 'getScaledWidth' : 'getScaledHeight';

  var gap = (span - totalSize) / (objs.length - 1);

  showToast('Distributed ' + objs.length + ' objects');
}
