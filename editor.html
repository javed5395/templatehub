  } else rbGoFullscreen();
}
function rbGoFullscreen() {
  var el = dom.canvasArea;
  if (el && el.requestFullscreen) el.requestFullscreen().catch(function () {});
  if (typeof transPlay === 'function') transPlay();
  if (typeof animPlay === 'function') setTimeout(animPlay, 260);
  showToast('Presenting — Esc to exit, arrow keys to move');
}

/* ── Export ── */
/* ── Upload / Download activity indicator ───────────────────────────
   Swaps the button's up/down arrow for a spinning icon while a file is
   actually uploading or exporting, then restores it (on success OR error),
   so long cloud round-trips are visible — same idea as Chrome/Canva. */
function _btnBusy(sel, on) {
  var btn = document.querySelector(sel);
  if (!btn) return;
  var ico = btn.querySelector('.material-icons-outlined');
  if (on) {
    if (ico && btn._ldIco == null) { btn._ldIco = ico.textContent; ico.textContent = 'autorenew'; }
    btn.classList.add('is-busy');
    btn.setAttribute('aria-busy', 'true');
  } else {
    if (ico && btn._ldIco != null) { ico.textContent = btn._ldIco; btn._ldIco = null; }
    btn.classList.remove('is-busy');
    btn.removeAttribute('aria-busy');
  }
}
function uploadBusy(on)   { _btnBusy('[data-action="upload-menu"]', on); }
function downloadBusy(on) { _btnBusy('[data-action="share"]', on); }

function rbDownload(dataUrl, filename) {
  var a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
/* Walk EVERY slide, run `grab` on each, then put the user back where they
   were. Everything that exports the deck goes through this, so the page
   restore and the sticker freeze can never be forgotten in one of them. */
function rbEachSlide(grab) {
  return new Promise(function (resolve) {
    if (!fc) return resolve([]);
    captureCurrentPage();
    if (typeof stickerFreeze === 'function') stickerFreeze();
    var startedOn = state.currentPage;
    var out = [], i = 0;
    var step = function () {
      if (i >= state.pages.length) {
        switchPage(startedOn).then(function () { resolve(out); });
        return;
      }
      switchPage(i).then(function () {
        /* a beat for fonts and images to settle before the snapshot */
        setTimeout(function () {
          if (typeof stickerFreeze === 'function') stickerFreeze();
          try { out.push(grab(i)); } catch (e) { out.push(null); }
          i++; step();
        }, 130);
      });
    };
    step();
  });
}

function rbSlideName(i, ext) {
  return 'slide-' + String(i + 1).padStart(2, '0') + '.' + ext;
}

/* One file downloads directly; a deck is bundled into a zip, because
   browsers block a burst of individual downloads. */
function rbDeliver(files, ext, label) {
  var good = files.filter(function (f) { return f && f.data; });
  if (!good.length) { showToast('Nothing could be exported'); return; }

  if (good.length === 1) {
    rbDownload(good[0].url, good[0].name);
    showToast(label + ' downloaded');
    return;
  }
  if (typeof JSZip === 'undefined') {
    showToast('Cannot bundle — JSZip missing');
    return;
  }
  var zip = new JSZip();
  good.forEach(function (f) { zip.file(f.name, f.data, { base64: f.base64 }); });
  showToast('Bundling ' + good.length + ' slides…');
  zip.generateAsync({ type: 'blob' }).then(function (blob) {
    var url = URL.createObjectURL(blob);
    rbDownload(url, 'presentation-' + ext + '.zip');
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    showToast(good.length + ' slides downloaded as ' + label);
  }).catch(function () { showToast('Could not build the zip'); });
}

function rbExportImage(fmt) {
  if (!fc) return;
  downloadBusy(true);
  var mime = fmt === 'jpg' ? 'jpeg' : 'png';
  showToast('Rendering all slides…');
  rbEachSlide(function (i) {
    var url = fc.toDataURL({ format: mime, quality: 0.92, multiplier: 2 });
    return { name: rbSlideName(i, fmt), url: url,
             data: url.split(',')[1], base64: true };
  }).then(function (files) {
    if (!files.filter(Boolean).length) {
      showToast('Export blocked — an image in this deck is cross-origin');
      return;
    }
    rbDeliver(files, fmt, fmt.toUpperCase());
  }).finally(function () { downloadBusy(false); });
}

function rbExportSvg() {
  if (!fc || !fc.toSVG) return;
  downloadBusy(true);
  showToast('Rendering all slides…');
  rbEachSlide(function (i) {
    var svg = fc.toSVG();
    return { name: rbSlideName(i, 'svg'),
             url: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
             data: svg, base64: false };
  }).then(function (files) { rbDeliver(files, 'svg', 'SVG'); }).finally(function () { downloadBusy(false); });
}
/* PDF: render every slide to an image and hand them to the browser's own
   print-to-PDF. No PDF library needed, and it keeps vector text crisp
   enough at 2x while staying dependency-free. */
function rbExportPdf() {
  if (!fc) return;
  downloadBusy(true);
  showToast('Rendering all slides…');
  rbEachSlide(function () {
    return { url: fc.toDataURL({ format: 'png', multiplier: 2 }) };
  }).then(function (files) {
    var imgs = files.filter(Boolean).map(function (f) { return f.url; });
    if (!imgs.length) { showToast('Nothing to export'); return; }
    var w = window.open('', '_blank');
    if (!w) { showToast('Allow pop-ups to export a PDF'); return; }
    w.document.write('<!doctype html><title>Presentation</title><style>'
      + '@page{size:landscape;margin:0}html,body{margin:0;padding:0}'
      + 'img{width:100%;display:block;page-break-after:always}'
      + 'img:last-child{page-break-after:auto}'
      + '</style>'
      + imgs.map(function (s) { return '<img src="' + s + '">'; }).join(''));
    w.document.close();
    setTimeout(function () { w.focus(); w.print(); }, 500);
    showToast(imgs.length + ' slides ready — choose “Save as PDF”');
  }).finally(function () { downloadBusy(false); });
}

/* ── Developer ── */
function rbInspectJson() {
  if (!fc) return;
  var json = JSON.stringify(fc.toJSON(FABRIC_JSON_PROPS), null, 2);
  rbShowModal('Slide JSON', json,
    (json.length / 1024).toFixed(1) + ' KB · ' + (fc.getObjects() || []).length + ' objects');
}
function rbInspectLayer() {
  var o = rbSel();
  if (!rbNeed(o)) return;
  var out = {};
  ['type','left','top','width','height','scaleX','scaleY','angle','opacity','fill','stroke',
   'fontFamily','fontSize','fontWeight','isFrame','frameKind','isIcon','iconName','isIllo',
   'isSticker','isComponent','componentId','chartType','datasetId','animType','themeRole',
   'altText','readOrder','layerName','visible','lockMovementX']
    .forEach(function (k) { if (o[k] !== undefined && o[k] !== null) out[k] = o[k]; });
  if (o.fx) out.fx = o.fx;
  rbShowModal('Layer inspector', JSON.stringify(out, null, 2), layerLabel(o));
}
function rbPerfStats() {
  if (!fc) return;
  var objs = fc.getObjects() || [];
  var kinds = {};
  objs.forEach(function (o) {
    var k = o.isFrame ? 'frame' : o.isIcon ? 'icon' : o.isIllo ? 'illustration'
          : o.isSticker ? 'sticker' : o.isComponent ? 'component'
          : o.chartType ? 'chart' : (o.type || 'other');
    kinds[k] = (kinds[k] || 0) + 1;
  });
  var json = JSON.stringify(fc.toJSON(FABRIC_JSON_PROPS));
  var deckBytes = 0;
  (state.pages || []).forEach(function (p) {
    if (p.canvasJSON) deckBytes += JSON.stringify(p.canvasJSON).length;
    if (p.thumb) deckBytes += p.thumb.length;
  });
  var lines = [
    'Slides            ' + (state.pages || []).length,
    'Objects on slide  ' + objs.length,
    'Slide JSON        ' + (json.length / 1024).toFixed(1) + ' KB',
    'Whole deck        ' + (deckBytes / 1048576).toFixed(2) + ' MB',
    'Canvas            ' + Math.round(fc.getWidth()) + ' × ' + Math.round(fc.getHeight())
      + ' @ ' + Math.round(fc.getZoom() * 100) + '%',
    'Datasets          ' + ((state.datasets || []).length),
    'Comments          ' + ((state.comments || []).length),
    '',
    'By kind:'
  ].concat(Object.keys(kinds).sort().map(function (k) {
    return '  ' + k.padEnd(16) + kinds[k];
  }));
  rbShowModal('Performance', lines.join('\n'), 'current slide and deck');
}
function rbShowModal(title, body, sub) {
  var old = document.getElementById('rb-modal');
  if (old) old.remove();

    + '<div class="rb-modal-head"><b>' + commentEsc(title) + '</b>'
    + '<span>' + commentEsc(sub || '') + '</span>'
    + '<button data-rbclose>×</button></div>'
    + '<textarea readonly spellcheck="false">' + commentEsc(body) + '</textarea>'
    + '<div class="rb-modal-foot">'

      + '<button data-rbclose class="primary">Close</button></div></div>';

/* ════════════════════════════════════════════════════════════
   ACCESSIBILITY
   Real WCAG maths, not a traffic light: relative luminance per the spec,
   the 4.5:1 / 3:1 thresholds, and the large-text exemption. The report
   reads every slide from its saved JSON, so it covers the whole deck
   rather than only what is on screen.
   ════════════════════════════════════════════════════════════ */
function a11yRgb(c) {
  if (!c || typeof c !== 'string') return null;
  c = c.trim();
  var m = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (m) {
    var h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  m = c.match(/^rgba?\(([^)]+)\)$/i);
  if (m) {
    var p = m[1].split(',').map(function (x) { return parseFloat(x); });
    if (p.length >= 3) return [p[0], p[1], p[2]];
  }
  return null;
}

/* WCAG 2.1 relative luminance */
function a11yLum(rgb) {
  var v = rgb.map(function (x) {
    x = x / 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}

function a11yRatio(fg, bg) {
  var a = a11yRgb(fg), b = a11yRgb(bg);
  if (!a || !b) return null;
  var l1 = a11yLum(a), l2 = a11yLum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}

/* WCAG: 18pt+, or 14pt+ bold, counts as large text (3:1 instead of 4.5:1) */
function a11yIsLarge(o) {
  var px = o.fontSize || 0;
  var pt = px * 0.75;
  var bold = String(o.fontWeight || '') === 'bold' || +o.fontWeight >= 600;
  return pt >= 18 || (bold && pt >= 14);
}

/* What sits behind this text: the topmost filled object it overlaps,
   else the slide background. */
function a11yBgBehind(obj, objects, slideBg) {
  var idx = objects.indexOf(obj);
  var cx = (obj.left || 0) + ((obj.width || 0) * (obj.scaleX || 1)) / 2;
  var cy = (obj.top || 0) + ((obj.height || 0) * (obj.scaleY || 1)) / 2;
  for (var i = idx - 1; i >= 0; i--) {
    var o = objects[i];
    if (!o || o.visible === false) continue;
    /* text is never a background for other text — only filled surfaces are */
    if (/text/.test(o.type || '')) continue;
    var fill = o.isFrame ? o.frameFill : o.fill;
    if (!a11yRgb(typeof fill === 'string' ? fill : null)) continue;
    var w = (o.width || 0) * (o.scaleX || 1), h = (o.height || 0) * (o.scaleY || 1);
    /* a zero-size object covers nothing; without this it matches everything
       positioned at the origin */
    if (w <= 0 || h <= 0) continue;
    var x = o.left || 0, y = o.top || 0;
    if (cx >= x && cx <= x + w && cy >= y && cy <= y + h) return fill;
  }
  return slideBg || '#FFFFFF';
}

/* Scan one serialised slide. Returns a list of findings. */
function a11yScanSlide(json, pageIndex) {
  var out = [];
  if (!json || !json.objects) return out;
  var bg = typeof json.background === 'string' ? json.background : '#FFFFFF';
  var objs = json.objects;

  objs.forEach(function (o, i) {
    if (o.visible === false) return;

    if (/text/.test(o.type || '')) {
      var behind = a11yBgBehind(o, objs, bg);
      var ratio = a11yRatio(typeof o.fill === 'string' ? o.fill : null, behind);
      var large = a11yIsLarge(o);
      var need = large ? 3 : 4.5;
      if (ratio != null && ratio < need) {
        out.push({ page: pageIndex, i: i, kind: 'contrast',
          sev: ratio < need * 0.75 ? 'high' : 'med',
          label: (o.text || 'Text').slice(0, 30),
          detail: ratio.toFixed(2) + ':1 against ' + behind + ' — needs ' + need + ':1'
            + (large ? ' (large text)' : ''),
          ratio: ratio, need: need });
      }
      var pt = (o.fontSize || 0) * 0.75;
      if (pt && pt < 12) {
        out.push({ page: pageIndex, i: i, kind: 'size', sev: 'med',
          label: (o.text || 'Text').slice(0, 30),
          detail: Math.round(pt) + 'pt — hard to read on a projector' });
      }
    }

    var needsAlt = (o.type === 'image' && !o.isFrame) || o.chartType
                   || (o.isFrame && o.frameSrc);
    if (needsAlt && !(o.altText && String(o.altText).trim())) {
      out.push({ page: pageIndex, i: i, kind: 'alt', sev: 'high',
        label: o.chartType ? ('Chart · ' + o.chartType) : 'Image',
        detail: 'No alternative text' });
    }
  });

  return out;
}

function a11yScanDeck() {
  if (typeof captureCurrentPage === 'function') captureCurrentPage();
  var all = [];
  (state.pages || []).forEach(function (p, i) {
    if (p.canvasJSON) {
      var json = typeof p.canvasJSON === 'string' ? JSON.parse(p.canvasJSON) : p.canvasJSON;
      all = all.concat(a11yScanSlide(json, i));
    }
  });
  return all;
}

/* ── Alt text ── */
function a11yAltTargets() {
  if (!fc || !fc.getObjects) return [];
  return (fc.getObjects() || []).filter(function (o) {
    return (o.type === 'image' && !o.isFrame) || o.chartType || (o.isFrame && o.frameSrc);
  });
}

function a11ySetAlt(lid) {
  var o = layerFind(lid);
  if (!o) return;
  var t = prompt('Describe this for someone who cannot see it:', o.altText || '');
  if (t === null) return;
  o.altText = t.trim();
  saveState(); a11yRefresh();
  showToast(o.altText ? 'Alt text set' : 'Alt text cleared');
}

/* ── Reading order ── */
function a11yReadingList() {
  if (!fc || !fc.getObjects) return [];
  var objs = (fc.getObjects() || []).filter(function (o) { return o.visible !== false; });
  return objs.slice().sort(function (a, b) {
    var ao = a.readOrder, bo = b.readOrder;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    /* unset: fall back to reading position, top row first */
    var dy = (a.top || 0) - (b.top || 0);
    if (Math.abs(dy) > 24) return dy;
    return (a.left || 0) - (b.left || 0);
  });
}

function a11yAutoOrder() {
  var list = a11yReadingList();
  list.forEach(function (o, i) { o.readOrder = i; });
  saveState(); a11yRefresh();
  showToast('Reading order set top to bottom');
}

function a11yMoveOrder(lid, dir) {
  var list = a11yReadingList();
  var o = layerFind(lid);
  var i = list.indexOf(o);
  if (i < 0) return;
  var j = i + dir;
  if (j < 0 || j >= list.length) return;
  list.splice(i, 1);
  list.splice(j, 0, o);
  list.forEach(function (x, k) { x.readOrder = k; });
  saveState(); a11yRefresh();
}

function a11yClearOrder() {
  (fc.getObjects() || []).forEach(function (o) { o.readOrder = null; });
  saveState(); a11yRefresh();
  showToast('Reading order reset to layout order');
}

function a11yGoto(page, idx) {
  var after = function () { a11yRefresh(); };
  if (page !== state.currentPage) switchPage(page).then(after); else after();
}

function a11yRefresh() {
  if (typeof state !== 'undefined' && state.activeTool === 'a11y') renderPanelContent('a11y');
}

function renderA11yPanel(tab) {
  if (tab === 'Alt text') {
    var targets = a11yAltTargets();
    if (!targets.length) {
      return '<div class="panel-placeholder"><span class="material-icons-outlined">image_not_supported</span>'
        + '<p><strong>Nothing needs alt text here</strong><br>'
        + 'Images, charts and filled frames appear on this list.</p></div>';
    }
    return '<div class="panel-subhead">Slide ' + (state.currentPage + 1)
        + ' <span>' + targets.length + ' item' + (targets.length === 1 ? '' : 's') + '</span></div>'
      + '<div class="a11y-list">' + targets.map(function (o) {
          var has = o.altText && String(o.altText).trim();
          return '<button class="a11y-row' + (has ? ' ok' : ' bad') + '"'
            + ' data-action="a11y-alt" data-lid="' + layerId(o) + '">'
            + '<span class="material-icons-outlined">' + (has ? 'check_circle' : 'error_outline') + '</span>'
            + '<span class="a11y-main"><b>' + commentEsc(layerLabel(o)) + '</b>'
            + '<i>' + (has ? commentEsc(String(o.altText).slice(0, 60)) : 'No alt text — click to add') + '</i></span>'
            + '</button>';
        }).join('') + '</div>';
  }

  if (tab === 'Reading order') {
    var list = a11yReadingList();
    if (!list.length) {
      return '<div class="panel-placeholder"><span class="material-icons-outlined">format_list_numbered</span>'
        + '<p><strong>Nothing on this slide</strong></p></div>';
    }
    return '<div class="brand-actions">'
        + '<button class="brand-btn primary" data-action="a11y-auto">'
          + '<span class="material-icons-outlined">sort</span>Auto order</button>'
        + '<button class="brand-btn" data-action="a11y-clear-order">'
          + '<span class="material-icons-outlined">restart_alt</span>Reset</button></div>'
      + '<div class="panel-hint">The order a screen reader would announce things. '
        + 'Unset items follow layout position, top row first.</div>'
      + '<div class="a11y-list">' + list.map(function (o, i) {
          return '<div class="a11y-ord">'
            + '<span class="a11y-num">' + (i + 1) + '</span>'
            + '<span class="material-icons-outlined a11y-ico">' + layerIcon(o) + '</span>'
            + '<span class="a11y-lab">' + commentEsc(layerLabel(o)) + '</span>'
            + '<button data-action="a11y-up" data-lid="' + layerId(o) + '" title="Earlier">'
              + '<span class="material-icons-outlined">arrow_upward</span></button>'
            + '<button data-action="a11y-down" data-lid="' + layerId(o) + '" title="Later">'
              + '<span class="material-icons-outlined">arrow_downward</span></button>'
            + '</div>';
        }).join('') + '</div>';

    var found = a11yScanDeck();
    var byKind = { contrast: 0, alt: 0, size: 0 };
    found.forEach(function (f) { byKind[f.kind] = (byKind[f.kind] || 0) + 1; });

    var head = '<div class="a11y-score">'
      + '<b>' + found.length + '</b><span>issue' + (found.length === 1 ? '' : 's')
      + ' across ' + slides + ' slide' + (slides === 1 ? '' : 's') + '</span></div>'
      + '<div class="a11y-tiles">'
      + '<div class="a11y-tile' + (byKind.contrast ? ' bad' : ' ok') + '">'
        + '<b>' + byKind.contrast + '</b><span>contrast</span></div>'
      + '<div class="a11y-tile' + (byKind.alt ? ' bad' : ' ok') + '">'
        + '<b>' + byKind.alt + '</b><span>alt text</span></div>'
      + '<div class="a11y-tile' + (byKind.size ? ' bad' : ' ok') + '">'
        + '<b>' + byKind.size + '</b><span>text size</span></div>'
      + '</div>';

    if (!found.length) {
      return head + '<div class="panel-placeholder">'
        + '<span class="material-icons-outlined">verified</span>'
        + '<p><strong>Nothing flagged</strong><br>Contrast, alt text and text size all pass '
        + 'on every slide with saved content.</p></div>';
    }

    return head + '<div class="a11y-list">' + found.slice(0, 60).map(function (f) {
        return '<button class="a11y-row ' + (f.sev === 'high' ? 'bad' : 'warn') + '"'
          + ' data-action="a11y-goto" data-p="' + f.page + '" data-i="' + f.i + '">'
          + '<span class="material-icons-outlined">'
            + (f.kind === 'contrast' ? 'contrast' : f.kind === 'alt' ? 'image_not_supported' : 'text_fields')
          + '</span>'
          + '<span class="a11y-main"><b>Slide ' + (f.page + 1) + ' · '
            + commentEsc(f.label) + '</b><i>' + commentEsc(f.detail) + '</i></span></button>';
      }).join('') + '</div>'
      + (found.length > 60 ? '<div class="panel-hint">Showing the first 60.</div>' : '')
      + '<div class="panel-hint">Slides you have not opened yet are not scanned — they have no '
        + 'saved content to read.</div>';
  }

  /* Contrast checker — live, on the current selection */
  var o = fc && fc.getActiveObject();
  if (!o || !/text/.test(o.type || '')) {
    return '<div class="panel-placeholder"><span class="material-icons-outlined">contrast</span>'
      + '<p><strong>Select some text</strong><br>Its contrast against what sits behind it '
      + 'is checked live.</p></div>';
  }
  var objs = fc.getObjects() || [];
  var bgc = a11yBgBehind(o, objs, (typeof fc.backgroundColor === 'string' ? fc.backgroundColor : '#FFFFFF'));

      + '<p><strong>Cannot measure</strong><br>This text or its background uses a gradient or '
      + 'pattern rather than a flat colour.</p></div>';

      ? '<span class="a11y-pass">pass</span>'
      : '<span class="a11y-fail">fail</span>';
  };
  return '<div class="panel-subhead">Contrast</div>'
    + '<div class="a11y-demo" style="background:' + bgc + ';color:' + fgc + '">'
      + commentEsc((o.text || 'Sample text').slice(0, 40)) + '</div>'
    + '<div class="a11y-ratio">' + ratio2.toFixed(2) + ':1</div>'
    + '<div class="a11y-checks">'
      + '<div><span>AA ' + (large2 ? '(large)' : '') + ' — ' + needAA + ':1</span>' + pass(needAA) + '</div>'
      + '<div><span>AAA ' + (large2 ? '(large)' : '') + ' — ' + needAAA + ':1</span>' + pass(needAAA) + '</div>'
    + '</div>'
    + '<div class="panel-hint">' + (large2
        ? 'This counts as large text (18pt+, or 14pt+ bold), so the bar is lower.'
        : 'Text under 18pt needs 4.5:1 for AA.')
      + ' Measured against ' + bgc + ', the nearest filled thing behind it.</div>';
}

/* ════════════════════════════════════════════════════════════
   PRESENTER TOOLS
   Notes and the timer already exist in the bottom bar; this panel drives
   the SAME state rather than keeping a second copy. Rehearsal times your
   slides for real, and Recording captures the canvas via MediaRecorder —
   with an honest note about what it does and does not capture.
   ════════════════════════════════════════════════════════════ */
var _rehearsal = null;      /* {start, marks:[{page,t}], timer} */
var _recorder = null, _recChunks = [], _recStream = null, _recStart = 0;

/* ── Speaker notes ── */
function presNoteSet(v) {
  if (!state.notes) state.notes = [];
  state.notes[state.currentPage] = v;
  if (dom.notesTextarea) dom.notesTextarea.value = v;
}

function presNoteFor(i) {
  return (state.notes && state.notes[i]) || '';
}

/* ── Timer (drives the existing bottom-bar timer state) ── */
function presTimerToggle() {
  if (typeof toggleTimer === 'function') { toggleTimer(); presRefresh(); return; }
  presRefresh();
}
function presTimerReset() {
  if (typeof resetTimer === 'function') resetTimer();
  else if (typeof state !== 'undefined') { state.timerSeconds = 0; }
  presRefresh();
}
function presTimerText() {
  var s = (typeof state !== 'undefined' && state.timerSeconds) || 0;
  return (typeof formatTime === 'function') ? formatTime(s) : '00:00';
}

/* ── Rehearsal ──────────────────────────────────────────────
   Watches which slide is showing and records how long each one was up.
   Polling rather than patching switchPage, so nothing existing changes. */
function rehearseStart() {
  if (_rehearsal) return;
  _rehearsal = { start: Date.now(), marks: [{ page: state.currentPage, t: Date.now() }], timer: null };
  _rehearsal.timer = setInterval(function () {
    var last = _rehearsal.marks[_rehearsal.marks.length - 1];
    if (last.page !== state.currentPage) {
      _rehearsal.marks.push({ page: state.currentPage, t: Date.now() });
    }
    presRefresh();
  }, 400);
  showToast('Rehearsal started — move through your slides');
  presRefresh();
}

function rehearseStop() {
  if (!_rehearsal) return;
  clearInterval(_rehearsal.timer);
  _rehearsal.end = Date.now();
  var r = rehearseReport();
  _rehearsal.report = r;
  _rehearsal.timer = null;
  showToast('Rehearsal finished — ' + presFmt(r.total) + ' total');
  presRefresh();
}

function rehearseClear() { _rehearsal = null; presRefresh(); }

/* Sum the time each slide was on screen, in slide order. */
function rehearseReport() {
  if (!_rehearsal) return { per: {}, total: 0 };
  var end = _rehearsal.end || Date.now();
  var per = {}, marks = _rehearsal.marks;
  for (var i = 0; i < marks.length; i++) {
    var to = (i + 1 < marks.length) ? marks[i + 1].t : end;
    per[marks[i].page] = (per[marks[i].page] || 0) + (to - marks[i].t);
  }
  return { per: per, total: end - _rehearsal.start };
}

function presFmt(ms) {
  var s = Math.round(ms / 1000);
  var m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

/* ── Recording ──────────────────────────────────────────────
   Captures the canvas element as a video stream. It records the SLIDE,
   not the whole browser window, and the panel says so.               */
function recSupported() {
  return typeof MediaRecorder !== 'undefined'
    && fc && fc.lowerCanvasEl && typeof fc.lowerCanvasEl.captureStream === 'function';
}

function recStart(withAudio) {
  if (!recSupported()) { showToast('Recording is not supported in this browser'); return; }
  if (_recorder) return;

  var go = function (audioTrack) {
    try {
      _recStream = fc.lowerCanvasEl.captureStream(30);
      if (audioTrack) _recStream.addTrack(audioTrack);
      var mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
        .filter(function (m) { return MediaRecorder.isTypeSupported(m); })[0];
      _recorder = new MediaRecorder(_recStream, mime ? { mimeType: mime } : undefined);
      _recChunks = [];
      _recorder.ondataavailable = function (e) { if (e.data && e.data.size) _recChunks.push(e.data); };
      _recorder.onstop = function () {
        var blob = new Blob(_recChunks, { type: 'video/webm' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'presentation-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.webm';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        if (_recStream) _recStream.getTracks().forEach(function (t) { t.stop(); });
        _recorder = null; _recStream = null; _recChunks = [];
        showToast('Recording saved');
        presRefresh();
      };
      _recorder.start();
      _recStart = Date.now();
      showToast('Recording — move through your slides');
      presRefresh();
    } catch (e) {
      showToast('Could not start recording');
      _recorder = null;
    }
  };

  if (withAudio && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      go(s.getAudioTracks()[0]);
    }).catch(function () {
      showToast('Microphone denied — recording video only');
      go(null);
    });
  } else go(null);
}

function recStop() {
  if (!_recorder) return;
  try { _recorder.stop(); } catch (e) { _recorder = null; presRefresh(); }
}

function presRefresh() {
  if (typeof state !== 'undefined' && state.activeTool === 'presenter') renderPanelContent('presenter');
}

/* The panel clock has to tick on its own — panels otherwise only redraw
   when something asks them to. Only runs while the tab is actually open. */
(function () {
  setInterval(function () {
    if (typeof state === 'undefined' || state.activeTool !== 'presenter') return;
    var d = panelData.presenter;
    var tab = d && d.activeTab;
    var live = (tab === 'Timer' && state.timerRunning)
            || (tab === 'Record' && _recorder);
    if (live) presRefresh();
  }, 1000);
})();

function renderPresenterPanel(tab) {
  if (tab === 'Notes') {
    var here = presNoteFor(state.currentPage);
    var others = (state.pages || []).map(function (p, i) { return { i: i, n: presNoteFor(i) }; })
      .filter(function (x) { return x.i !== state.currentPage && x.n.trim(); });

    return '<div class="panel-subhead">Slide ' + (state.currentPage + 1) + ' notes</div>'
      + '<textarea id="pres-note" class="cm-box" rows="7" '
        + 'placeholder="What you want to say on this slide…">' + commentEsc(here) + '</textarea>'
      + '<div class="panel-hint">Same notes as the bottom Notes pane — one copy, two places.</div>'
      + (others.length
        ? '<div class="panel-subhead">Other slides <span>' + others.length + '</span></div>'
          + '<div class="pres-notes">' + others.map(function (x) {
              return '<button class="pres-note" data-action="page-go" data-i="' + x.i + '">'
                + '<b>' + (x.i + 1) + '</b><span>' + commentEsc(x.n.slice(0, 90))
                + (x.n.length > 90 ? '…' : '') + '</span></button>';
            }).join('') + '</div>'
        : '');
  }

  if (tab === 'Rehearse') {
    var running = !!(_rehearsal && _rehearsal.timer);
    var rep = _rehearsal ? (_rehearsal.report || rehearseReport()) : null;
    var h = '<div class="panel-subhead">Rehearsal</div>'
      + '<div class="pres-clock">' + (rep ? presFmt(rep.total) : '0:00') + '</div>'
      + '<div class="brand-actions">'
      + (running
        ? '<button class="brand-btn primary" data-action="reh-stop">'
          + '<span class="material-icons-outlined">stop</span>Stop</button>'
        : '<button class="brand-btn primary" data-action="reh-start">'
          + '<span class="material-icons-outlined">play_arrow</span>Start</button>')
      + '<button class="brand-btn" data-action="reh-clear">'
        + '<span class="material-icons-outlined">restart_alt</span>Reset</button>'
      + '</div>';

    if (rep && Object.keys(rep.per).length) {
      var avg = rep.total / Math.max(1, Object.keys(rep.per).length);
      h += '<div class="panel-subhead">Per slide</div><div class="pres-bars">'
        + Object.keys(rep.per).sort(function (a, b) { return a - b; }).map(function (k) {
            var ms = rep.per[k];
            var pct = Math.max(3, Math.round(ms / Math.max(1, rep.total) * 100));
            var slow = ms > avg * 1.6;
            return '<button class="pres-bar' + (slow ? ' slow' : '') + '"'
              + ' data-action="page-go" data-i="' + k + '">'
              + '<span class="pb-n">' + (+k + 1) + '</span>'
              + '<span class="pb-track"><i style="width:' + pct + '%"></i></span>'
              + '<span class="pb-t">' + presFmt(ms) + '</span></button>';
          }).join('') + '</div>'
        + '<div class="panel-hint">Bars marked in orange ran well over your average — '
          + 'usually the slides worth trimming.</div>';
    } else {
      h += '<div class="panel-hint">Press Start, then present as you normally would. '
        + 'Time on each slide is measured as you move through the deck.</div>';
    }
    return h;
  }

  if (tab === 'Record') {
    var rec = !!_recorder;
    return '<div class="panel-subhead">Record</div>'
      + (recSupported()
        ? '<div class="brand-actions">'
          + (rec
            ? '<button class="brand-btn primary" data-action="rec-stop">'
              + '<span class="material-icons-outlined">stop</span>Stop and save</button>'
            : '<button class="brand-btn primary" data-action="rec-start-a">'
              + '<span class="material-icons-outlined">mic</span>Record + voice</button>'
              + '<button class="brand-btn" data-action="rec-start">'
              + '<span class="material-icons-outlined">videocam</span>Video only</button>')
          + '</div>'
          + (rec ? '<div class="pres-rec">● recording</div>' : '')
          + '<div class="panel-hint">Records the <b>slide canvas</b> as a .webm video — not the '
            + 'whole browser window, and not the panels. Move through your slides while it runs; '
            + 'the file downloads when you stop. Voice needs microphone permission.</div>'
        : '<div class="panel-placeholder"><span class="material-icons-outlined">videocam_off</span>'
          + '<p><strong>Not supported here</strong><br>This browser has no MediaRecorder or '
          + 'canvas capture.</p></div>');
  }

  /* Timer */
  var running2 = !!(typeof state !== 'undefined' && state.timerRunning);
  return '<div class="panel-subhead">Timer</div>'
    + '<div class="pres-clock">' + presTimerText() + '</div>'
    + '<div class="brand-actions">'
    + '<button class="brand-btn primary" data-action="pres-timer">'
      + '<span class="material-icons-outlined">' + (running2 ? 'pause' : 'play_arrow') + '</span>'
      + (running2 ? 'Pause' : 'Start') + '</button>'
    + '<button class="brand-btn" data-action="pres-timer-reset">'
      + '<span class="material-icons-outlined">restart_alt</span>Reset</button>'
    + '</div>'
    + '<div class="panel-hint">The same timer as the bottom bar. Use Rehearse instead if you '
      + 'want per-slide times rather than one running clock.</div>';
}

/* ════════════════════════════════════════════════════════════
   HISTORY
   Two different things, kept separate because they answer different
   questions:
     Undo history — the step-by-step stack for THIS slide, already
       maintained by saveState. The panel reads it, never duplicates it.
     Restore points — a named snapshot of the WHOLE deck, taken on
       purpose before something risky.
   ════════════════════════════════════════════════════════════ */
var _historyLabel = null;
var _snapList = [], _snapLoaded = false;

/* Callers can name the next step: histLabel('Applied theme') */
function histLabel(t) { _historyLabel = t; }

function snapPut(rec) {
  return projOpenDb().then(function (db) {
    if (!db) { showToast('Restore points need IndexedDB — unavailable here'); return false; }
    return new Promise(function (res) {
      var tx = db.transaction(SNAP_STORE, 'readwrite');
      tx.objectStore(SNAP_STORE).put(rec);
      tx.oncomplete = function () { res(true); };
      tx.onerror = function () { showToast('Could not save the restore point'); res(false); };
    });
  });
}

function snapAll() {
  return projOpenDb().then(function (db) {
    if (!db) return [];
    return new Promise(function (res) {
      var out = [];
      var tx = db.transaction(SNAP_STORE, 'readonly');
      var cur = tx.objectStore(SNAP_STORE).openCursor();
      cur.onsuccess = function (e) {
        var c = e.target.result;
        if (c) { out.push(c.value); c.continue(); } else res(out);
      };
      cur.onerror = function () { res([]); };
    });
  });
}

function snapDelete(id) {
  return projOpenDb().then(function (db) {
    if (!db) return false;
    return new Promise(function (res) {
      var tx = db.transaction(SNAP_STORE, 'readwrite');
      tx.objectStore(SNAP_STORE).delete(id);
      tx.oncomplete = function () { res(true); };
      tx.onerror = function () { res(false); };
    });
  });
}

function snapRefresh() {
  return snapAll().then(function (list) {
    _snapList = list.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    _snapLoaded = true;
    if (state && state.activeTool === 'history') renderPanelContent('history');
    return _snapList;
  });
}

function snapCreate() {
  if (!fc) return;
  var name = prompt('Name this restore point:', 'Before ' + new Date().toLocaleTimeString());
  if (!name) return;
  captureCurrentPage();
  if (typeof stickerFreeze === 'function') stickerFreeze();
  var thumb = '';
  try { thumb = fc.toDataURL({ format: 'png', multiplier: 0.1 }); } catch (e) {}
  /* history stacks are deliberately NOT included — a restore point is the
     content, not the undo trail, and keeping stacks would multiply size */
  var pages = (state.pages || []).map(function (p) {
    return { id: p.id, canvasJSON: p.canvasJSON, ir: p.ir, thumb: p.thumb,
             title: p.title, sectionStart: p.sectionStart, transition: p.transition };
  });
  snapPut({
    id: 'sn' + Date.now(), name: name.trim(), ts: Date.now(), thumb: thumb,
    slideCount: pages.length, pages: pages,
    notes: JSON.parse(JSON.stringify(state.notes || [])),
    theme: state.theme ? JSON.parse(JSON.stringify(state.theme)) : null
  }).then(function (ok) {
    if (ok) { showToast('Restore point saved'); snapRefresh(); }
  });
}

function snapRestore(id) {
  var s = _snapList.filter(function (x) { return x.id === id; })[0];
  if (!s || !fc) return;
  if (!confirm('Restore “' + s.name + '”?\n\nThis replaces all ' + (state.pages || []).length
    + ' current slide(s) with the ' + s.slideCount + ' saved in this point.')) return;

  state.pages = s.pages.map(function (p) {
    return { id: p.id || Date.now(), canvasJSON: p.canvasJSON, ir: p.ir, thumb: p.thumb,
             title: p.title, sectionStart: p.sectionStart, transition: p.transition,
             history: [], historyIndex: -1, historyMeta: [] };
  });
  state.notes = JSON.parse(JSON.stringify(s.notes || []));
  if (s.theme) state.theme = JSON.parse(JSON.stringify(s.theme));
  if (!state.pages.length) state.pages = [makeBlankPage(Date.now())];
  state.currentPage = 0;
  loadPageIntoCanvas(0).then(function () {
    ensurePageHistory(0);
    renderPageThumbs();
    snapRefresh();
    showToast('Restored “' + s.name + '”');
  });
}

function snapRemove(id) {
  var s = _snapList.filter(function (x) { return x.id === id; })[0];
  if (!s) return;
  if (!confirm('Delete restore point “' + s.name + '”?')) return;
  snapDelete(id).then(function () { showToast('Deleted'); snapRefresh(); });
}

/* Jump the current slide to any step in its undo stack. */
function histJump(i) {
  var page = currentPageObj();
  if (!page || !page.history || i < 0 || i >= page.history.length) return;
  page.historyIndex = i;
  restoreState();
  if (typeof state !== 'undefined' && state.activeTool === 'history') renderPanelContent('history');
}

function histClear() {
  var page = currentPageObj();
  if (!page || !page.history) return;
  if (!confirm('Clear the undo history for this slide?\nThe slide itself is unchanged.')) return;
  var keep = page.history[page.historyIndex];
  var keepMeta = (page.historyMeta || [])[page.historyIndex];
  page.history = [keep];
  page.historyMeta = [keepMeta || { t: Date.now(), n: 0 }];
  page.historyIndex = 0;
  updateUndoRedo();
  renderPanelContent('history');
  showToast('History cleared for this slide');
}

function renderHistoryPanel(tab) {
  if (tab === 'Restore points') {
    if (!_snapLoaded) snapRefresh();
    var head = '<button class="brand-btn primary" style="width:100%" data-action="snap-create">'
      + '<span class="material-icons-outlined">bookmark_add</span>Create restore point</button>'
      + '<div class="panel-hint">A restore point saves every slide as it is now. '
        + 'Take one before a theme change or a big edit.</div>';
    if (!_snapList.length) {
      return head + '<div class="panel-placeholder">'
        + '<span class="material-icons-outlined">history_toggle_off</span>'
        + '<p><strong>No restore points</strong><br>Nothing saved yet.</p></div>';
    }
    return head + '<div class="proj-list">' + _snapList.map(function (s) {
      return '<div class="proj-card">'
        + '<div class="proj-thumb" data-action="snap-restore" data-id="' + s.id + '" title="Restore">'
          + (s.thumb ? '<img src="' + s.thumb + '" alt="">' : '') + '</div>'
        + '<div class="proj-meta"><b>' + commentEsc(s.name) + '</b>'
          + '<i>' + s.slideCount + ' slide' + (s.slideCount === 1 ? '' : 's')
            + ' · ' + projAgo(s.ts) + '</i>'
          + '<div class="proj-tools">'
            + '<button data-action="snap-restore" data-id="' + s.id + '" title="Restore">'
              + '<span class="material-icons-outlined">restore</span></button>'
            + '<button data-action="snap-del" data-id="' + s.id + '" title="Delete" class="danger">'
              + '<span class="material-icons-outlined">delete</span></button>'
          + '</div></div></div>';
    }).join('') + '</div>';
  }

  var page = currentPageObj();
  var hist = (page && page.history) || [];
  if (!hist.length) {
    return '<div class="panel-placeholder"><span class="material-icons-outlined">history</span>'
      + '<p><strong>No history yet</strong><br>Edits to this slide appear here.</p></div>';
  }
  var meta = page.historyMeta || [];
  var cur = page.historyIndex == null ? hist.length - 1 : page.historyIndex;

  var rows = [];
  for (var i = hist.length - 1; i >= 0; i--) {
    var m = meta[i] || {};
    var isCur = i === cur;
    var ahead = i > cur;
    rows.push('<button class="hist-row' + (isCur ? ' now' : '') + (ahead ? ' ahead' : '') + '"'
      + ' data-action="hist-jump" data-i="' + i + '">'
      + '<span class="hist-dot"></span>'
      + '<span class="hist-lab">' + commentEsc(m.label || (i === 0 ? 'Opened' : 'Edit ' + i)) + '</span>'
      + '<span class="hist-n">' + (m.n == null ? '' : m.n + ' obj') + '</span>'
      + '<span class="hist-t">' + (m.t ? projAgo(m.t) : '') + '</span>'
      + '</button>');
  }

  return '<div class="panel-subhead">Slide ' + (state.currentPage + 1) + ' history <span>'
      + hist.length + ' step' + (hist.length === 1 ? '' : 's') + '</span></div>'
    + '<div class="panel-hint">Undo history is per slide. Steps below the current point '
      + 'are still here until you make a new edit.</div>'
    + '<div class="hist-list">' + rows.join('') + '</div>'
    + '<button class="cm-mini" style="margin-top:8px" data-action="hist-clear">'
      + '<span class="material-icons-outlined">layers_clear</span>Clear this slide’s history</button>';
}

var THEME_SPACING = {
  compact: { name:'Compact', line: 1.08, scale: 0.94 },
  normal:  { name:'Normal',  line: 1.25, scale: 1.00 },
  roomy:   { name:'Roomy',   line: 1.5,  scale: 1.06 },
};

function themeCurrent() {
  if (!state.theme) {
    state.theme = JSON.parse(JSON.stringify(THEME_PRESETS[0]));
    state.theme.spacing = 'normal';
  }
  if (!state.theme.spacing) state.theme.spacing = 'normal';
  return state.theme;
}

/* Decide a role for an object the first time it is themed. */
function themeRoleFor(obj, maxFont) {
  if (obj.themeRole) return obj.themeRole;
  var t = obj.type || '';
  if (/text/.test(t)) {
    return (obj.fontSize || 0) >= maxFont * 0.8 ? 'heading' : 'body';
  }
  if (obj.isIcon) return 'accent';
  var fill = typeof obj.fill === 'string' ? obj.fill.toUpperCase() : '';
  if (fill === '#7C3AED' || fill === '#FFFFFF' || fill === '') return 'accent';
  return null;                       /* deliberately coloured — leave alone */
}

/* A theme's slide background. Solid by default, or a real two-colour gradient
   when the theme defines bgA/bgB — returned as fabric's serialised gradient
   shape so it round-trips through loadFromJSON exactly like the Backgrounds
   panel's gradients do. */
function themeBgFill(th) {
  if (!th.bgA) return th.bg;
  var w = (typeof fc !== 'undefined' && fc && fc._baseWidth) || 960;
  var h = (typeof fc !== 'undefined' && fc && fc._baseHeight) || 540;
  var rad = ((th.bgDeg || 135) - 90) * Math.PI / 180;
  return {
    type: 'linear', gradientUnits: 'pixels',
    coords: { x1: w / 2 - Math.cos(rad) * w / 2, y1: h / 2 - Math.sin(rad) * h / 2,
              x2: w / 2 + Math.cos(rad) * w / 2, y2: h / 2 + Math.sin(rad) * h / 2 },
    colorStops: [{ offset: 0, color: th.bgA }, { offset: 1, color: th.bgB }]
  };
}

/* Transform ONE serialised slide in place. Used for every page, including
   the live one (via its JSON) so the rules can never diverge. */
function themeTransformSlide(json, th) {
  if (!json || !json.objects) return 0;
  var sp = THEME_SPACING[th.spacing] || THEME_SPACING.normal;
  var maxFont = 0;
  json.objects.forEach(function (o) {
    if (/text/.test(o.type || '')) maxFont = Math.max(maxFont, o.fontSize || 0);
  });
  if (!maxFont) maxFont = 1;

  var n = 0;
  json.objects.forEach(function (o) {
    var role = themeRoleFor(o, maxFont);
    if (!role) return;
    o.themeRole = role;
    if (role === 'heading' || role === 'body') {
      o.fill = role === 'heading' ? th.heading : th.body;
      o.fontFamily = role === 'heading' ? th.hFont : th.bFont;
      o.lineHeight = sp.line;
      if (o._themeBaseSize == null) o._themeBaseSize = o.fontSize;
      o.fontSize = Math.max(6, Math.round(o._themeBaseSize * sp.scale));
      n++;
    } else if (role === 'accent') {
      if (o.isFrame) { o.frameFill = th.accent; }
      else if (typeof o.fill === 'string') { o.fill = th.accent; }
      n++;
    }
    /* frames holding photos keep the photo; only empty ones recolour */
    if (o.isFrame && o.frameSrc) { o.frameFill = th.accent; }
  });
  json.background = themeBgFill(th);
  return n;
}

/* Every key any preset is allowed to own. Built once from the presets
   themselves so it can never fall out of date. */
var THEME_PRESET_KEYS = (function () {
  var m = {};
  THEME_PRESETS.forEach(function (p) { Object.keys(p).forEach(function (k) { m[k] = 1; }); });
  return Object.keys(m);
})();

function themeApply(id) {
  var preset = id ? THEME_PRESETS.filter(function (t) { return t.id === id; })[0] : null;
  var th = themeCurrent();
  if (preset) {
    /* FIXED 30 Jul 2026 — the "theme only changes once" bug.
       This used to copy the new preset's keys straight on top of the old
       theme without clearing anything first. Five presets (citrus, dawn,
       lagoon, nebula, mango) carry gradient keys bgA/bgB/bgDeg; the other
       twenty do not. So the moment one of those five was picked, bgA stuck
       to the theme object permanently, themeBgFill() kept seeing it, and
       EVERY theme chosen afterwards still drew the old gradient — the name
       changed, the background never did. Clearing the preset-owned keys
       first fixes it. 'spacing' is user state, not a preset key, so it is
       untouched by design. */
    THEME_PRESET_KEYS.forEach(function (k) { if (!(k in preset)) delete th[k]; });
    Object.keys(preset).forEach(function (k) { th[k] = preset[k]; });
  }
  if (!fc) return;

  captureCurrentPage();
  var touched = 0, slides = 0;
  (state.pages || []).forEach(function (p) {
    if (!p.canvasJSON) {
      /* a slide never visited yet has only its imported IR — set the
         background so it is at least consistent when opened */
      p.pendingTheme = themeBgFill(th);
      return;
    }
    touched += themeTransformSlide(p.canvasJSON, th);
    slides++;
  });

  var names = [th.hFont, th.bFont].filter(Boolean);
  var finish = function () {
    loadPageIntoCanvas(state.currentPage).then(function () {
      renderPageThumbs();
      themeRefresh();
      showToast('“' + (th.name || 'Theme') + '” applied to ' + slides
        + ' slide' + (slides === 1 ? '' : 's') + ' · ' + touched + ' objects');
    });
  };
  if (window.loadDeckFonts && names.length) window.loadDeckFonts(names, finish);
  else finish();
}

/* Native colour picker (a hidden <input type="color">), so users pick a
   colour visually instead of typing a hex into a prompt. */
function pickColour(initial, cb) {
  /* A FRESH input every time (reusing one made it fire only once), kept in the
     DOM and clicked synchronously inside the user gesture so the browser
     actually opens its picker. Commit on change; clean up afterwards. */
  var inp = document.createElement('input');
  inp.type = 'color';
  try { inp.value = /^#[0-9a-fA-F]{6}$/.test(initial || '') ? initial : '#7C3AED'; } catch (e) {}
  inp.style.cssText = 'position:fixed;left:12px;top:12px;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(inp);
  var done = false;
  var cleanup = function () { setTimeout(function () { try { inp.remove(); } catch (e) {} }, 50); };
  inp.addEventListener('change', function () {
    if (done) return; done = true;
    cb(inp.value.toUpperCase());
    cleanup();
  });
  /* if the user dismisses without choosing, tidy up on the next interaction */
  inp.addEventListener('blur', cleanup);
  inp.click();
}

function themeSetColour(key) {
  var th = themeCurrent();
  pickColour(th[key] || '#7C3AED', function (hex) {
    th[key] = hex;
    if (key === 'bg') { th.bgA = null; th.bgB = null; }  /* picking a solid bg drops the gradient */
    th.id = 'custom'; th.name = 'Custom';
    themeRefresh();
  });
}

function themeSetFont(which, name) {
  var th = themeCurrent();
  th[which === 'heading' ? 'hFont' : 'bFont'] = name;
  th.id = 'custom'; th.name = 'Custom';
  themeRefresh();
}

function themeSetSpacing(key) {
  themeCurrent().spacing = key;
  themeRefresh();
}

function themeRefresh() {
  if (typeof state !== 'undefined' && state.activeTool === 'themes') renderPanelContent('themes');
}

function themeSwatch(t) {
  var bg = t.bgA ? ('linear-gradient(' + (t.bgDeg || 135) + 'deg,' + t.bgA + ',' + t.bgB + ')') : t.bg;
  return '<span class="th-sw" style="background:' + bg + '">'
    + '<i style="background:' + t.accent + '"></i>'
    + '<i style="background:' + t.heading + '"></i>'
    + '<i style="background:' + t.surface + '"></i></span>';
}

function renderThemePanel(tab) {
  var th = themeCurrent();

  if (tab === 'Colours') {
    var rows = [['bg','Background'],['surface','Surface'],['accent','Accent'],
                ['heading','Heading text'],['body','Body text']];
    return '<div class="panel-subhead">Theme colours <span>' + commentEsc(th.name || '') + '</span></div>'
      + rows.map(function (r) {
          return '<button class="th-row" data-action="theme-colour" data-k="' + r[0] + '">'
            + '<span class="th-chip" style="background:' + th[r[0]] + '"></span>'
            + '<span class="th-lab">' + r[1] + '</span>'
            + '<code>' + th[r[0]] + '</code></button>';
        }).join('')
      + '<button class="anim-play" data-action="theme-apply-current">'
        + '<span class="material-icons-outlined">auto_fix_high</span>Apply to all slides</button>';
  }

  if (tab === 'Fonts') {
    var fonts = (window.ldAllFonts || []).map(function (f) { return f.name; });
    var opts = function (sel) {
      return fonts.map(function (n) {
        return '<option value="' + n + '"' + (n === sel ? ' selected' : '') + '>' + n + '</option>';
      }).join('');
    };
    return '<div class="panel-subhead">Theme fonts</div>'
      + '<label class="brand-lbl">Headings</label>'
      + '<select class="brand-sel" data-themefont="heading">' + opts(th.hFont) + '</select>'
      + '<div class="brand-prev" style="font-family:' + th.hFont + '">Heading</div>'
      + '<label class="brand-lbl">Body</label>'
      + '<select class="brand-sel" data-themefont="body">' + opts(th.bFont) + '</select>'
      + '<div class="brand-prev sm" style="font-family:' + th.bFont + '">Body copy sits underneath at a smaller size.</div>'
      + '<button class="anim-play" data-action="theme-apply-current">'
        + '<span class="material-icons-outlined">auto_fix_high</span>Apply to all slides</button>';
  }

  if (tab === 'Spacing') {
    return '<div class="panel-subhead">Theme spacing</div>'
      + '<div class="anim-grid">' + Object.keys(THEME_SPACING).map(function (k) {
          var s = THEME_SPACING[k];
          return '<button class="anim-card' + (th.spacing === k ? ' on' : '') + '"'
            + ' data-action="theme-spacing" data-k="' + k + '">'
            + '<span class="material-icons-outlined">format_line_spacing</span>'
            + '<span>' + s.name + '</span></button>';
        }).join('') + '</div>'
      + '<div class="panel-hint">Spacing sets line height and nudges text size — '
        + 'Compact ' + THEME_SPACING.compact.scale + '×, Roomy ' + THEME_SPACING.roomy.scale + '×. '
        + 'Original sizes are remembered, so switching back is exact.</div>'
      + '<button class="anim-play" data-action="theme-apply-current">'
        + '<span class="material-icons-outlined">auto_fix_high</span>Apply to all slides</button>';
  }

  return '<div class="panel-subhead">Presets <span>applies to every slide</span></div>'
    + '<div class="th-grid">' + THEME_PRESETS.map(function (t) {
        return '<button class="th-card' + (th.id === t.id ? ' on' : '') + '"'
          + ' data-action="theme-apply" data-id="' + t.id + '">'
          + themeSwatch(t)
          + '<span class="th-name" style="font-family:' + t.hFont + '">' + t.name + '</span>'
          + '</button>';
      }).join('') + '</div>'
    + '<div class="panel-hint">Applying a theme restyles text, empty shapes and backgrounds '
      + 'across the whole deck. Photos and anything you coloured deliberately are left alone.</div>';
}

/* ════════════════════════════════════════════════════════════
   COMPONENTS
   Pre-built compositions with a real master/instance relationship:
     Insert  → an instance, tagged with its component id
     Detach  → drops the tag; it becomes ordinary objects
     Update  → this instance becomes the new master definition
   Masters that you have edited are stored locally as overrides, so an
   updated component keeps its shape for future inserts.
   ════════════════════════════════════════════════════════════ */
var CMP_OVERRIDE_KEY = 'ld_component_masters';

function cmpOverrides() { return iconStore(CMP_OVERRIDE_KEY, {}); }
function cmpSaveOverride(id, json) {
  var all = cmpOverrides();
  all[id] = json;
  try { localStorage.setItem(CMP_OVERRIDE_KEY, JSON.stringify(all)); return true; }
  catch (e) { showToast('Storage full — could not update the master'); return false; }
}
function cmpClearOverride(id) {
  var all = cmpOverrides();
  delete all[id];
  try { localStorage.setItem(CMP_OVERRIDE_KEY, JSON.stringify(all)); } catch (e) {}
}

}
function cText(x, y, w, txt, size, weight, fill, align) {
  return new fabric.Textbox(txt, { left:x, top:y, width:w, fontSize:size,
    fontWeight:weight||'400', fill:fill||'#0F172A', fontFamily:'DM Sans',
    textAlign:align||'left', lineHeight:1.25, objectCaching:false });
}
function cCircle(x, y, r, fill) {
  return new fabric.Circle({ left:x, top:y, radius:r, fill:fill, objectCaching:false });
}

var CMP_CATS = ['Buttons','Cards','Pricing','Testimonials','Team','Headers','Footers'];

function cmpDef(id) {
  return COMPONENT_LIB.filter(function (c) { return c.id === id; })[0];
}

function cmpInsert(id) {
  histLabel('Inserted component');
  var def = cmpDef(id);
  if (!def || !fc) return;
  var over = cmpOverrides()[id];

  var place = function (g) {
    var W = fc.getWidth() / fc.getZoom(), H = fc.getHeight() / fc.getZoom();
    var maxW = W * 0.8;
    if (g.width > maxW) g.scaleToWidth(maxW);
    g.set({ left: Math.max(0, (W - g.getScaledWidth()) / 2),
            top:  Math.max(0, (H - g.getScaledHeight()) / 2),
            isComponent: true, componentId: id, componentName: def.name });
    fc.add(g).setActiveObject(g);
    fc.renderAll(); saveState();
    showToast(def.name + ' added');
  };

  if (over && fabric.util && fabric.util.enlivenObjects) {
    fabric.util.enlivenObjects([over], function (objs) {
      if (objs && objs[0]) place(objs[0]);
      else place(new fabric.Group(def.build(), { objectCaching: false }));
    });
  } else {
    place(new fabric.Group(def.build(), { objectCaching: false }));
  }
}

function cmpDetach() {
  var o = fc && fc.getActiveObject();
  if (!o || !o.isComponent) { showToast('Select a component instance first'); return; }
  var name = o.componentName;
  o.isComponent = false;
  o.componentId = null;
  o.componentName = null;
  saveState(); cmpRefresh();
  showToast('Detached — “' + name + '” is now plain objects');
}

/* Update: this instance becomes the master. Other instances ON THIS SLIDE
   are rebuilt to match; instances on other slides are left alone, because
   silently rewriting slides you cannot see is worse than not doing it. */
function cmpUpdate() {
  var o = fc && fc.getActiveObject();
  if (!o || !o.isComponent) { showToast('Select a component instance first'); return; }
  var id = o.componentId;
  var json;
  try { json = o.toObject(FABRIC_JSON_PROPS); } catch (e) { json = null; }
  if (!json) { showToast('Could not capture that instance'); return; }
  if (!cmpSaveOverride(id, json)) return;

  var others = (fc.getObjects() || []).filter(function (x) {
    return x !== o && x.isComponent && x.componentId === id;
  });
  if (!others.length) {
    cmpRefresh();
    showToast('Master updated — future inserts use this version');
    return;
  }
  var pending = others.length;
  others.forEach(function (x) {
    fabric.util.enlivenObjects([json], function (objs) {
      var n = objs && objs[0];
      if (n) {
        n.set({ left:x.left, top:x.top, scaleX:x.scaleX, scaleY:x.scaleY, angle:x.angle,
                isComponent:true, componentId:id, componentName:x.componentName });
        fc.remove(x); fc.add(n);
      }
      if (--pending === 0) {
        fc.renderAll(); saveState(); cmpRefresh();
        showToast('Master updated — ' + others.length + ' instance(s) on this slide refreshed');
      }
    });
  });
}

function cmpReset(id) {
  cmpClearOverride(id);
  cmpRefresh();
  showToast('Reset to the built-in version');
}

function cmpRefresh() {
  if (typeof state !== 'undefined' && state.activeTool === 'components') renderPanelContent('components');
}

function cmpPreviewSvg(def) {
  /* a schematic preview: boxes where the parts sit, so the card reads
     at a glance without rendering fabric off-screen */
  var parts;
  try { parts = def.build(); } catch (e) { parts = []; }
  if (!parts.length) return '';
  var maxX = 1, maxY = 1;
  parts.forEach(function (p) {
    maxX = Math.max(maxX, (p.left || 0) + (p.width || p.radius * 2 || 40));
    maxY = Math.max(maxY, (p.top || 0) + (p.height || p.radius * 2 || 20));
  });
  var W = 150, s = W / maxX, H = Math.max(28, maxY * s);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + Math.min(96, H) + '">'
    + parts.map(function (p) {
        var x = (p.left || 0) * s, y = (p.top || 0) * s;
        var isTxt = /text/.test(p.type || '');
        var w = ((p.width || (p.radius ? p.radius * 2 : 40))) * s;
        var h = ((p.height || (p.radius ? p.radius * 2 : (p.fontSize || 14) * 1.3))) * s;
        var fill = (typeof p.fill === 'string' && p.fill) ? p.fill : '#CBD5E1';
        if (p.radius) {
          return '<circle cx="' + (x + w/2) + '" cy="' + (y + h/2) + '" r="' + (w/2)
            + '" fill="' + fill + '"/>';
        }
        return '<rect x="' + x + '" y="' + y + '" width="' + Math.max(1, w)
          + '" height="' + Math.max(1.5, isTxt ? h * 0.5 : h) + '" rx="' + (isTxt ? 1 : 2)
          + '" fill="' + fill + '"' + (fill === '' ? ' stroke="#CBD5E1"' : '') + '/>';
      }).join('') + '</svg>';
}

function renderComponentPanel(tab) {

/* ════════════════════════════════════════════════════════════
   ASSETS
   A personal library, separate from Uploads: Uploads is "files I brought
   in", Assets is "things I made and want again". Anything on the canvas
   can be saved, and it comes back as a real editable object because what
   is stored is the fabric JSON, not a picture of it.
   ════════════════════════════════════════════════════════════ */
var ASSET_LS = 'ld_assets_fallback';
var _assetList = [], _assetLoaded = false;

function assetKind(o) {
  if (!o) return 'component';
  if (o.isIcon) return 'icon';
  if (o.isIllo || o.isSticker) return 'illustration';
  if (o.type === 'image' && !o.isFrame) return 'image';
  return 'component';
}

function assetPut(rec) {
  return projOpenDb().then(function (db) {
    if (!db) {
      var all = iconStore(ASSET_LS, []).filter(function (a) { return a.id !== rec.id; });
      all.unshift(rec);
      try { localStorage.setItem(ASSET_LS, JSON.stringify(all.slice(0, 12))); }
      catch (e) { showToast('Storage full — remove an asset first'); return false; }
      return true;
    }
    return new Promise(function (res) {
      var tx = db.transaction(ASSET_STORE, 'readwrite');
      tx.objectStore(ASSET_STORE).put(rec);
      tx.oncomplete = function () { res(true); };
      tx.onerror = function () { showToast('Could not save that asset'); res(false); };
    });
  });
}

function assetAll() {
  return projOpenDb().then(function (db) {
    if (!db) return iconStore(ASSET_LS, []);
    return new Promise(function (res) {
      var out = [];
      var tx = db.transaction(ASSET_STORE, 'readonly');
      var cur = tx.objectStore(ASSET_STORE).openCursor();
      cur.onsuccess = function (e) {
        var c = e.target.result;
        if (c) { out.push(c.value); c.continue(); } else res(out);
      };
      cur.onerror = function () { res([]); };
    });
  });
}

function assetDeleteRec(id) {
  return projOpenDb().then(function (db) {
    if (!db) {
      var all = iconStore(ASSET_LS, []).filter(function (a) { return a.id !== id; });
      try { localStorage.setItem(ASSET_LS, JSON.stringify(all)); } catch (e) {}
      return true;
    }
    return new Promise(function (res) {
      var tx = db.transaction(ASSET_STORE, 'readwrite');
      tx.objectStore(ASSET_STORE).delete(id);
      tx.oncomplete = function () { res(true); };
      tx.onerror = function () { res(false); };
    });
  });
}

function assetRefresh() {
  return assetAll().then(function (list) {
    _assetList = list.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    _assetLoaded = true;
    if (state && state.activeTool === 'assets') renderPanelContent('assets');
    return _assetList;
  });
}

function assetSaveSelected() {
  var o = fc && fc.getActiveObject();
  if (!o) { showToast('Select something to save'); return; }
  if (o.type === 'activeSelection') {
    showToast('Group the selection first, then save it as a component');
    return;
  }
  var kind = assetKind(o);
  var name = prompt('Asset name:', layerLabel(o));
  if (!name) return;

  var thumb = '';
  try { thumb = o.toDataURL({ format: 'png', multiplier: Math.min(1, 120 / Math.max(o.width || 120, o.height || 120)) }); }
  catch (e) { /* cross-origin image — save without a preview rather than failing */ }

  /* store the object itself, so it returns fully editable */
  var json = null;
  try { json = o.toObject(FABRIC_JSON_PROPS); } catch (e) {}
  if (!json) { showToast('Could not serialise that object'); return; }

  assetPut({
    id: 'as' + Date.now(), kind: kind, name: name.trim(),
    thumb: thumb, json: json, ts: Date.now()
  }).then(function (ok) {
    if (ok) { showToast('Saved to Assets'); assetRefresh(); }
  });
}

function assetInsert(id) {
  var a = _assetList.filter(function (x) { return x.id === id; })[0];
  if (!a || !fc || typeof fabric === 'undefined' || !fabric.util) return;
  fabric.util.enlivenObjects([a.json], function (objs) {
    var o = objs && objs[0];
    if (!o) { showToast('Could not rebuild that asset'); return; }
    var W = fc.getWidth() / fc.getZoom(), H = fc.getHeight() / fc.getZoom();
    o.set({ left: Math.max(0, (W - o.getScaledWidth()) / 2),
            top:  Math.max(0, (H - o.getScaledHeight()) / 2) });
    fc.add(o).setActiveObject(o);
    /* frames and effects are parameter-driven, so rebuild them */
    if (o.isFrame && typeof refreshFrame === 'function') {
      if (o.frameSrc) {
        var im = new Image();
        im.onload = function () { o._frameImg = im; refreshFrame(o); };
        im.src = o.frameSrc;
      } else refreshFrame(o);
    }
    if (o.fx && typeof fxApply === 'function') { try { fxApply(o); } catch (e) {} }
    fc.renderAll(); saveState();
    showToast('“' + a.name + '” added');
  });
}

function assetRename(id) {
  var a = _assetList.filter(function (x) { return x.id === id; })[0];
  if (!a) return;
  var n = prompt('Rename asset:', a.name);
  if (!n) return;
  a.name = n.trim(); a.ts = Date.now();
  assetPut(a).then(function () { assetRefresh(); });
}

function assetRemove(id) {
  var a = _assetList.filter(function (x) { return x.id === id; })[0];
  if (!a) return;
  if (!confirm('Delete “' + a.name + '” from your assets?')) return;
  assetDeleteRec(id).then(function () { showToast('Deleted'); assetRefresh(); });
}

var ASSET_TABS = { 'All': null, 'Icons': 'icon', 'Images': 'image',
                   'Illustrations': 'illustration', 'Components': 'component' };

function renderAssetPanel(tab) {
  if (!_assetLoaded) assetRefresh();
  var want = ASSET_TABS[tab];
  var list = want ? _assetList.filter(function (a) { return a.kind === want; }) : _assetList;

  var head = '<button class="brand-btn primary" style="width:100%" data-action="asset-save">'
    + '<span class="material-icons-outlined">bookmark_add</span>Save selection to Assets</button>'
    + '<div class="panel-hint">Assets keep the object itself, so anything you save comes back '
      + 'fully editable — not a flattened picture.</div>';

  if (!list.length) {
    return head + '<div class="panel-placeholder">'
      + '<span class="material-icons-outlined">inventory_2</span>'
      + '<p><strong>' + (tab === 'All' ? 'No saved assets' : 'Nothing in ' + tab) + '</strong><br>'
      + 'Select something on the slide and save it here.</p></div>';
  }

  return head + '<div class="asset-grid">' + list.map(function (a) {
    return '<div class="asset-card" data-action="asset-insert" data-id="' + a.id + '" '
      + 'title="' + commentEsc(a.name) + '">'
      + '<div class="asset-thumb">'
        + (a.thumb ? '<img src="' + a.thumb + '" alt="">'
                   : '<span class="material-icons-outlined">' + (
                       a.kind === 'icon' ? 'emoji_symbols' :
                       a.kind === 'image' ? 'image' :
                       a.kind === 'illustration' ? 'palette' : 'widgets') + '</span>')
      + '</div>'
      + '<span class="asset-name">' + commentEsc(a.name) + '</span>'
      + '<span class="asset-tools">'
        + '<button data-action="asset-rename" data-id="' + a.id + '" title="Rename">'
          + '<span class="material-icons-outlined">edit</span></button>'
        + '<button data-action="asset-del" data-id="' + a.id + '" title="Delete" class="danger">'
          + '<span class="material-icons-outlined">close</span></button>'
      + '</span></div>';
  }).join('') + '</div>';
}

/* ════════════════════════════════════════════════════════════
   AI
   Three different realities here, and the panel does not blur them:
     · Deck + slide generation already works — it goes through the existing
       composer proxy via window.ldCompose (the cloud glue, untouched).
     · Text tasks go to the existing chat_http cascade (Groq → Gemini →
       Cloudflare). Configurable via window.LD_CHAT_URL.
     · Image generation has no endpoint yet. It lights up automatically
       when window.LD_IMAGE_URL exists; until then it says so.
     · Remove background runs LOCALLY — a flood fill from the edges, not
       AI matting. Honest about what it is and what it is good at.
   ════════════════════════════════════════════════════════════ */
window.LD_CHAT_URL = window.LD_CHAT_URL
  || 'https://us-central1-templatehub-16cd7.cloudfunctions.net/chat_http';

var _aiBusy = false;

function aiSetBusy(on, msg) {
  _aiBusy = on;
  var el = document.getElementById('ai-status');
  if (el) el.textContent = on ? (msg || 'Working…') : '';
  aiRefresh();
}

/* One call into the existing free-provider cascade. */
function aiAsk(prompt) {
  return fetch(window.LD_CHAT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: prompt })
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (d) {
    var t = d && (d.reply || d.text || d.message || d.answer);
    if (!t) throw new Error('empty reply');
    return String(t).replace(/^ACTION:.*$/gm, '').trim();
  });
}

function aiSelectedText() {
  var o = fc && fc.getActiveObject();
  if (!o || !/text/.test(o.type || '')) return null;
  return o;
}

function aiTextTask(kind) {
  var o = aiSelectedText();
  if (!o) { showToast('Select a text box first'); return; }
  var src = (o.text || '').trim();
  if (!src) { showToast('That text box is empty'); return; }

  var prompt;
  if (kind === 'rewrite') {
    prompt = 'Rewrite this presentation text so it is clearer and punchier. '
      + 'Keep the same meaning and roughly the same length. '
      + 'Reply with the rewritten text only, no preamble:\n\n' + src;
  } else if (kind === 'summarize') {
    prompt = 'Summarise this into one short slide-friendly line. '
      + 'Reply with the line only:\n\n' + src;
  } else {
    var lang = prompt_lang();
    if (!lang) return;
    prompt = 'Translate this into ' + lang
      + '. Keep it natural and slide-friendly. Reply with the translation only:\n\n' + src;
  }

  aiSetBusy(true, kind === 'translate' ? 'Translating…' : (kind === 'rewrite' ? 'Rewriting…' : 'Summarising…'));
  aiAsk(prompt).then(function (out) {
    o._aiBefore = src;                       /* so Undo change is possible */
    o.set('text', out);
    o.dirty = true;
    fc.requestRenderAll();
    saveState();
    aiSetBusy(false);
    showToast('Done — use Revert if you prefer the original');
  }).catch(function (e) {
    aiSetBusy(false);
    showToast('AI unavailable (' + e.message + ') — is the function deployed?');
  });
}

function prompt_lang() {
  var l = prompt('Translate into which language?', 'Spanish');
  return l && l.trim();
}

function aiRevert() {
  var o = aiSelectedText();
  if (!o || !o._aiBefore) { showToast('Nothing to revert'); return; }
  o.set('text', o._aiBefore);
  o._aiBefore = null;
  o.dirty = true;
  fc.requestRenderAll(); saveState(); aiRefresh();
  showToast('Reverted');
}

/* Deck + slide generation reuse the composer that already exists. */
function aiGenerateDeck(oneSlide) {
  if (window.LD_IS_ADMIN === false) { showToast('Only the admin can generate decks'); return; }
  if (typeof window.ldCompose !== 'function') {
    showToast('Designer backend not reachable from here');
    return;
  }
  var q = prompt(oneSlide
    ? 'Describe the slide you want:\n(e.g. "a dark fintech title slide with a bold headline")'
    : 'Describe the deck you want:\n(e.g. "a hospital media kit, black background, 8 slides, lots of images")');
  if (!q || !q.trim()) return;
  var sentence = oneSlide ? (q.trim() + ', 1 slide') : q.trim();
  aiSetBusy(true, 'Designing in the cloud…');
  try {
    var p = window.ldCompose(sentence);
    if (p && p.then) p.then(function () { aiSetBusy(false); })
                     .catch(function () { aiSetBusy(false); });
    else setTimeout(function () { aiSetBusy(false); }, 1500);
  } catch (e) {
    aiSetBusy(false);
    showToast('Compose failed');
  }
}

function aiGenerateImage() {
  /* Nothing in this function is broken — it has simply never had an
     endpoint to call. Everything else in the AI panel points at the two
     cloud functions that DO exist (chat_http, ai_fill_http); there is no
     image one yet. TO SWITCH THIS ON: deploy an endpoint that takes
     { prompt } and answers with { image } (a data URL or a public URL),
     then set window.LD_IMAGE_URL to it near LD_BACKEND at the bottom of
     this file. The card in the panel un-greys itself once that is set. */
  if (!window.LD_IMAGE_URL) {
    showToast('Image generation is not switched on yet — no image service has been deployed', 5000);
    return;
  }
  var q = prompt('Describe the image:');
  if (!q || !q.trim()) return;
  aiSetBusy(true, 'Generating image…');
  fetch(window.LD_IMAGE_URL, {
    method: 'POST',
    headers: (window.ldHeaders ? window.ldHeaders('application/json') : { 'Content-Type': 'application/json' }),
    body: JSON.stringify({ prompt: q.trim() })
  }).then(function (r) { return r.json(); }).then(function (d) {
    var src = d && (d.image || d.url || d.dataUrl);
    if (!src) throw new Error('no image');
    fabric.Image.fromURL(src, function (img) {
      var W = fc.getWidth() / fc.getZoom();
      img.scaleToWidth(W * 0.5);
      img.set({ left: W * 0.25, top: 60 });
      fc.add(img).setActiveObject(img);
      fc.renderAll(); saveState();
    }, { crossOrigin: 'anonymous' });
    aiSetBusy(false);
  }).catch(function () {
    aiSetBusy(false);
    showToast('Image generation failed');
  });
}

/* ── Remove background (local) ─────────────────────────────
   Flood fill inward from the edges, clearing pixels close in colour to
   the border. Excellent on flat/studio backdrops, poor on busy photos —
   which is exactly what the panel tells you.                           */
function aiRemoveBg() {
  var o = fc && fc.getActiveObject();
  if (!o || o.type !== 'image') { showToast('Select an image first'); return; }
  var el = o._originalElement || o._element;
  if (!el) { showToast('Image not ready'); return; }

  var w = el.naturalWidth || el.width, h = el.naturalHeight || el.height;
  if (!w || !h) { showToast('Image not ready'); return; }

  var cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  var ctx = cv.getContext('2d');
  try { ctx.drawImage(el, 0, 0, w, h); } catch (e) { showToast('Cannot read this image'); return; }

  var img;
  try { img = ctx.getImageData(0, 0, w, h); }
  catch (e) { showToast('Image is cross-origin — cannot edit its pixels'); return; }

  var d = img.data;
  var tol = 42;                              /* colour distance threshold */
  var seen = new Uint8Array(w * h);
  var stack = [];

  /* seed from every border pixel */
  for (var x = 0; x < w; x++) { stack.push(x, 0); stack.push(x, h - 1); }
  for (var y = 0; y < h; y++) { stack.push(0, y); stack.push(w - 1, y); }

  function at(i) { return [d[i], d[i + 1], d[i + 2]]; }
  var seedI = 0;
  var sr = d[0], sg = d[1], sb = d[2];

  while (stack.length) {
    var py = stack.pop(), px = stack.pop();
    if (px < 0 || py < 0 || px >= w || py >= h) continue;
    var p = py * w + px;
    if (seen[p]) continue;
    var i = p * 4;
    var dr = d[i] - sr, dg = d[i + 1] - sg, db = d[i + 2] - sb;
    if (Math.sqrt(dr * dr + dg * dg + db * db) > tol) continue;
    seen[p] = 1;
    d[i + 3] = 0;
    stack.push(px + 1, py); stack.push(px - 1, py);
    stack.push(px, py + 1); stack.push(px, py - 1);
  }

  /* soften the cut so the edge is not a hard staircase */
  for (var yy = 1; yy < h - 1; yy++) {
    for (var xx = 1; xx < w - 1; xx++) {
      var q = yy * w + xx;
      if (seen[q]) continue;
      var n = seen[q - 1] + seen[q + 1] + seen[q - w] + seen[q + w];
      if (n >= 2) d[q * 4 + 3] = Math.min(d[q * 4 + 3], 110);
      else if (n === 1) d[q * 4 + 3] = Math.min(d[q * 4 + 3], 190);
    }
  }

  var cleared = 0;
  for (var k = 0; k < seen.length; k++) cleared += seen[k];
  if (cleared < (w * h) * 0.01) {
    showToast('Background too varied for a clean cut — try a flat backdrop');
    return;
  }

  ctx.putImageData(img, 0, 0);
  var left = o.left, top = o.top, sx = o.scaleX, sy = o.scaleY, ang = o.angle;
  o.setSrc(cv.toDataURL('image/png'), function () {
    o.set({ left: left, top: top, scaleX: sx, scaleY: sy, angle: ang });
    fc.requestRenderAll(); saveState();
    showToast('Background removed (' + Math.round(cleared / (w * h) * 100) + '% cleared)');
  });
}

/* ════════════════════════════════════════════════════════════
   DATA
   Datasets feed the charts. Layout convention: first row = series names,
   first column = category labels — the shape almost every spreadsheet
   already has.
   No new libraries: CSV is parsed here, and XLSX is read with the JSZip
   that is already loaded for PPTX (an .xlsx is a zip of XML).
   ════════════════════════════════════════════════════════════ */
function dataSets() {
  if (!state.datasets) state.datasets = [];
  return state.datasets;
}

/* CSV that survives quoted fields, embedded commas, quotes and CRLF. */
function parseCSV(text) {
  var rows = [], row = [], cur = '', q = false;
  text = String(text).replace(/^﻿/, '');
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* skip */ }
    else cur += c;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
}

/* rows → {cats, series}. Non-numeric cells become 0 rather than NaN,
   which would silently break every chart that used them. */
function rowsToDataset(rows, name) {
  if (!rows.length) return null;
  var header = rows[0];
  var seriesNames = header.slice(1).map(function (h, i) {
    return String(h).trim() || ('Series ' + (i + 1));
  });
  var cats = [], series = seriesNames.map(function (n) { return { name: n, data: [] }; });
  for (var r = 1; r < rows.length; r++) {
    cats.push(String(rows[r][0] == null ? '' : rows[r][0]).trim() || ('Row ' + r));
    for (var c = 0; c < series.length; c++) {
      var raw = String(rows[r][c + 1] == null ? '' : rows[r][c + 1]).replace(/[^0-9.eE+-]/g, '');
      var v = parseFloat(raw);
      series[c].data.push(isFinite(v) ? v : 0);
    }
  }
  if (!cats.length || !series.length) return null;
  return { id: 'ds' + Date.now(), name: name, source: 'csv', cats: cats, series: series, ts: Date.now() };
}

/* .xlsx is a zip of XML — JSZip is already here for PPTX, so no new dep. */
function parseXLSX(arrayBuffer) {
  if (typeof JSZip === 'undefined') return Promise.resolve(null);
  return JSZip.loadAsync(arrayBuffer).then(function (zip) {
    var sheetFile = null;
    zip.forEach(function (path) {
      if (!sheetFile && /^xl\/worksheets\/sheet1\.xml$/i.test(path)) sheetFile = path;
    });
    if (!sheetFile) return null;
    var shared = zip.file('xl/sharedStrings.xml');
    return Promise.all([
      zip.file(sheetFile).async('string'),
      shared ? shared.async('string') : Promise.resolve('')
    ]).then(function (res) {
      var sheetXml = res[0], sharedXml = res[1];
      var strings = [];
      if (sharedXml) {
        var si = sharedXml.match(/<si>[\s\S]*?<\/si>/g) || [];
        strings = si.map(function (blk) {
          return (blk.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [])
            .map(function (t) { return t.replace(/<[^>]+>/g, ''); }).join('');
        });
      }
      var grid = {}, maxC = 0, maxR = 0;
      (sheetXml.match(/<c [^>]*?r="([A-Z]+)(\d+)"[^>]*>(?:[\s\S]*?)<\/c>|<c [^>]*\/>/g) || [])
        .forEach(function (cell) {
          var ref = cell.match(/r="([A-Z]+)(\d+)"/);
          if (!ref) return;
          var col = 0;
          for (var k = 0; k < ref[1].length; k++) col = col * 26 + (ref[1].charCodeAt(k) - 64);
          col -= 1;
          var rowN = parseInt(ref[2], 10) - 1;
          var isStr = /t="s"/.test(cell);
          var vm = cell.match(/<v>([\s\S]*?)<\/v>/);
          var inline = cell.match(/<t[^>]*>([\s\S]*?)<\/t>/);
          var val = vm ? vm[1] : (inline ? inline[1].replace(/<[^>]+>/g, '') : '');
          if (isStr && vm) val = strings[parseInt(vm[1], 10)] || '';
          grid[rowN + ':' + col] = val;
          if (col > maxC) maxC = col;
          if (rowN > maxR) maxR = rowN;
        });
      var rows = [];
      for (var r = 0; r <= maxR; r++) {
        var row = [];
        for (var c = 0; c <= maxC; c++) row.push(grid[r + ':' + c] == null ? '' : grid[r + ':' + c]);
        rows.push(row);
      }
      return rows;
    });
  }).catch(function () { return null; });
}
