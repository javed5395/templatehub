<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — LazyDogTemplates</title>
<meta name="description" content="Read the latest from the LazyDogTemplates journal." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2eee5; font-family: 'Inter', sans-serif; color: #1a1a2e; }

  .bv-hero {
    background: #07071a; color: #fff;
    padding: 50px 40px 38px; text-align: center; position: relative; overflow: hidden;
  }
  .bv-hero::before {
    content: ""; position: absolute; top: -120px; right: -80px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.16), transparent 70%);
  }
  .bv-eyebrow {
    position: relative; font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase; color: #d4af37; margin-bottom: 14px;
  }
  .bv-title {
    position: relative; font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(28px, 5vw, 50px); line-height: 1.1; margin: 0 auto; max-width: 820px;
  }
  .bv-meta {
    position: relative; margin-top: 14px; font-size: 13px; color: #b8bfd0;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .bv-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #6b21c8, #9333ea);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 800; font-family: 'Poppins', sans-serif;
  }

  .bv-bar { max-width: 900px; margin: 0 auto; padding: 16px 20px 0; }
  .bv-back {
    display: inline-flex; align-items: center; gap: 6px; color: #7c5cbf; text-decoration: none;
    font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif;
  }
  .bv-back:hover { text-decoration: underline; }

  /* The pages render straight onto the page — no iframe, no box. */
  .bv-pages { max-width: 900px; margin: 12px auto 70px; padding: 0 20px; }
  .bv-page {
    display: block; width: 100%; height: auto; margin: 0 auto 22px;
    background: #fff; border-radius: 6px; box-shadow: 0 10px 30px rgba(30,20,10,0.10);
  }
  .bv-status { text-align: center; color: #8a8496; font-size: 14px; padding: 50px 20px; font-family: 'Inter', sans-serif; }
  .bv-status a { color: #7c5cbf; font-weight: 600; }
</style>
</head>
<body>

<section class="bv-hero">
  <div class="bv-eyebrow">✦ LazyDog Journal</div>
  <h1 class="bv-title" id="bvTitle">Loading…</h1>
  <div class="bv-meta">
    <span class="bv-avatar">LD</span>
    <span id="bvAuthor">LazyDog Studios</span>
    <span>·</span>
    <span id="bvDate"></span>
  </div>
</section>

<div class="bv-bar"><a href="blog.html" class="bv-back">← Back to Journal</a></div>

<div class="bv-pages" id="bvPages"><div class="bv-status">Loading the blog…</div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
  import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

  const firebaseConfig = {
    apiKey: "AIzaSyDIiOl6apoPuzpHxcamNsUQcDrt1AIVOes",
    authDomain: "templatehub-16cd7.firebaseapp.com",
    projectId: "templatehub-16cd7",
    storageBucket: "templatehub-16cd7.firebasestorage.app",
    messagingSenderId: "143000893683",
    appId: "1:143000893683:web:fd694de96f8c0fa6569f86"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  function fmtDate(ts){
    try { if (ts && ts.seconds) return new Date(ts.seconds*1000).toLocaleDateString('en-US',{month:'long', year:'numeric'}); } catch(e){}
    return '';
  }

  async function renderPdf(url, mount){
    mount.innerHTML = '';
    const pdf = await pdfjsLib.getDocument({ url }).promise;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssWidth = Math.min(mount.clientWidth, 860);   // reading width
    for (let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const scale = cssWidth / base.width;
      const viewport = page.getViewport({ scale: scale * dpr });
      const canvas = document.createElement('canvas');
      canvas.className = 'bv-page';
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = cssWidth + 'px';
      mount.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
  }

  (async function(){
    const id = new URLSearchParams(location.search).get('id');
    const titleEl = document.getElementById('bvTitle');
    const pagesEl = document.getElementById('bvPages');
    if (!id) {
      titleEl.textContent = 'Blog not found';
      pagesEl.innerHTML = '<div class="bv-status">No blog was specified. <a href="blog.html">Back to the journal</a>.</div>';
      return;
    }
    let url = '';
    try {
      const snap = await getDoc(doc(db, 'templates', id));
      if (!snap.exists()) {
        titleEl.textContent = 'Blog not found';
        pagesEl.innerHTML = '<div class="bv-status">This blog could not be found. <a href="blog.html">Back to the journal</a>.</div>';
        return;
      }
      const p = snap.data();
      const title = p.title || (p.template && p.template.name) || 'Untitled';
      document.title = title + ' — LazyDogTemplates';
      titleEl.textContent = title;
      document.getElementById('bvAuthor').textContent = p.sellerName || 'LazyDog Studios';
      document.getElementById('bvDate').textContent   = fmtDate(p.uploadedAt || p.createdAt);
      url = p.pdfUrl || p.designDocUrl || '';
    } catch (err) {
      console.error('Failed to load blog record:', err);
      titleEl.textContent = 'Could not load blog';
      pagesEl.innerHTML = '<div class="bv-status">Something went wrong. <a href="blog.html">Back to the journal</a>.</div>';
      return;
    }

    if (!url) { pagesEl.innerHTML = '<div class="bv-status">This blog has no file attached yet.</div>'; return; }

    try {
      await renderPdf(url, pagesEl);
    } catch (err) {
      console.error('PDF render failed:', err);
      pagesEl.innerHTML = '<div class="bv-status">Couldn\'t display this blog inline. <a href="' + url + '" target="_blank" rel="noopener">Open the PDF ↗</a></div>';
    }
  })();

  // Re-render crisply if the window is resized to a very different width.
  let rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ /* canvases keep their CSS width; full reflow on reload only */ }, 300);
  });
</script>

<script src="navbar.js"></script>
<script src="footerbar.js"></script>
</body>
</html>
