<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — LazyDogTemplates</title>
<meta name="description" content="Read the latest from the LazyDogTemplates journal." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fdfaf6; font-family: 'Inter', sans-serif; color: #1a1a2e; }

  .bv-hero {
    background: #07071a; color: #fff;
    padding: 54px 40px 40px; text-align: center; position: relative; overflow: hidden;
  }
  .bv-hero::before {
    content: ""; position: absolute; top: -120px; right: -80px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.16), transparent 70%);
  }
  .bv-eyebrow {
    position: relative; font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase; color: #d4af37; margin-bottom: 14px;
  }
  .bv-title {
    position: relative; font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(30px, 5vw, 52px); line-height: 1.1; margin: 0 auto; max-width: 820px;
  }
  .bv-meta {
    position: relative; margin-top: 16px; font-size: 13px; color: #b8bfd0;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .bv-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #6b21c8, #9333ea);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 800; font-family: 'Poppins', sans-serif;
  }

  .bv-bar {
    max-width: 1000px; margin: 0 auto; padding: 16px 20px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .bv-back {
    display: inline-flex; align-items: center; gap: 6px; color: #7c5cbf; text-decoration: none;
    font-size: 13px; font-weight: 600; font-family: 'Poppins', sans-serif;
  }
  .bv-back:hover { text-decoration: underline; }
  .bv-open {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    background: #1a1a2e; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 12.5px; padding: 9px 18px; border-radius: 30px;
  }
  .bv-open:hover { background: #7c5cbf; }

  .bv-doc {
    max-width: 1000px; margin: 16px auto 60px; padding: 0 20px;
  }
  .bv-frame {
    width: 100%; height: 82vh; min-height: 560px; border: 1px solid #e7e2d8;
    border-radius: 12px; background: #fff; box-shadow: 0 16px 44px rgba(30,20,10,0.12);
  }
  .bv-msg { text-align: center; color: #8a8496; font-size: 15px; padding: 60px 20px; font-family: 'Inter', sans-serif; }

  @media (max-width: 600px) {
    .bv-hero { padding: 44px 22px 32px; }
    .bv-frame { height: 74vh; }
  }
</style>
</head>
<body>

<section class="bv-hero">
  <div class="bv-eyebrow">✦ LazyDog Journal</div>
  <h1 class="bv-title" id="bvTitle">Loading…</h1>
  <div class="bv-meta">
    <span class="bv-avatar">LD</span>
    <span id="bvAuthor">LazyDog Studios</span>
    <span>·</span>
    <span id="bvDate"></span>
  </div>
</section>

<div class="bv-bar">
  <a href="blog.html" class="bv-back">← Back to Journal</a>
  <a href="#" id="bvOpen" class="bv-open" target="_blank" rel="noopener" style="display:none;">Open PDF ↗</a>
</div>

<div class="bv-doc">
  <div id="bvBody"><div class="bv-msg">Loading the blog…</div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDIiOl6apoPuzpHxcamNsUQcDrt1AIVOes",
    authDomain: "templatehub-16cd7.firebaseapp.com",
    projectId: "templatehub-16cd7",
    storageBucket: "templatehub-16cd7.firebasestorage.app",
    messagingSenderId: "143000893683",
    appId: "1:143000893683:web:fd694de96f8c0fa6569f86"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  function fmtDate(ts){
    try { if (ts && ts.seconds) return new Date(ts.seconds*1000).toLocaleDateString('en-US',{month:'long', year:'numeric'}); } catch(e){}
    return '';
  }

  (async function(){
    const id = new URLSearchParams(location.search).get('id');
    const titleEl = document.getElementById('bvTitle');
    const bodyEl  = document.getElementById('bvBody');
    if (!id) {
      titleEl.textContent = 'Blog not found';
      bodyEl.innerHTML = '<div class="bv-msg">No blog was specified. <a href="blog.html">Back to the journal</a>.</div>';
      return;
    }
    try {
      const snap = await getDoc(doc(db, 'templates', id));
      if (!snap.exists()) {
        titleEl.textContent = 'Blog not found';
        bodyEl.innerHTML = '<div class="bv-msg">This blog could not be found. <a href="blog.html">Back to the journal</a>.</div>';
        return;
      }
      const p = snap.data();
      const title = p.title || (p.template && p.template.name) || 'Untitled';
      document.title = title + ' — LazyDogTemplates';
      titleEl.textContent = title;
      document.getElementById('bvAuthor').textContent = p.sellerName || 'LazyDog Studios';
      document.getElementById('bvDate').textContent   = fmtDate(p.uploadedAt || p.createdAt);

      const url = p.pdfUrl || p.designDocUrl || '';
      if (url) {
        const openBtn = document.getElementById('bvOpen');
        openBtn.href = url; openBtn.style.display = 'inline-flex';
        bodyEl.innerHTML = '<iframe class="bv-frame" src="' + url + '#view=FitH" title="' + title.replace(/"/g,'&quot;') + '"></iframe>';
      } else {
        bodyEl.innerHTML = '<div class="bv-msg">This blog has no readable file attached yet.</div>';
      }
    } catch (err) {
      console.error('Failed to load blog:', err);
      titleEl.textContent = 'Could not load blog';
      bodyEl.innerHTML = '<div class="bv-msg">Something went wrong loading this blog. <a href="blog.html">Back to the journal</a>.</div>';
    }
  })();
</script>

<script src="navbar.js"></script>
<script src="footerbar.js"></script>
</body>
</html>
