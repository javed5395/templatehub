<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Sign in — LazyDog Editor app</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     DESKTOP APP SIGN-IN PAGE (20 Aug 2026, Fable)
     Opened in the user's REAL browser by the LazyDog Editor desktop app
     (Google blocks OAuth inside embedded windows). Flow:
       1. Google popup sign-in here — a real browser, so it works.
       2. Trade the ID token for a custom token at mint_app_token.
       3. Hand the custom token to the app over 127.0.0.1:<port> loopback.
     The port arrives as ?port=NNN from the app. Nothing here is secret.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
  body { margin:0; font-family:'DM Sans',system-ui,sans-serif; background:#0f0f1e; color:#e8e9f2;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#151623; border:1px solid #2c2e45; border-radius:16px; padding:40px 44px;
          max-width:420px; text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.5); }
  h1 { font-size:20px; margin:0 0 10px; }
  p  { font-size:14px; color:#a9abc4; line-height:1.5; }
  button { border:0; border-radius:10px; padding:12px 26px; font-size:15px; font-weight:600;
           cursor:pointer; background:linear-gradient(135deg,#7c5cff,#e05fa9); color:#fff; margin-top:14px; }
  .ok { color:#4ade80; font-weight:600; }
  .err { color:#f87171; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign in to LazyDog Editor</h1>
  <p id="msg">Sign in with Google below — then you can close this tab and return to the app.</p>
  <button id="go">Sign in with Google</button>
</div>
<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';

  const FB_CONFIG = {
    apiKey: 'AIzaSyDIiOl6apoPuzpHxcamNsUQcDrt1AIVOes',
    authDomain: 'templatehub-16cd7.firebaseapp.com',
    projectId: 'templatehub-16cd7',
    storageBucket: 'templatehub-16cd7.firebasestorage.app'
  };
  const MINT_URL = 'https://us-central1-templatehub-16cd7.cloudfunctions.net/mint_app_token';
  const port = new URLSearchParams(location.search).get('port');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('go');

  if (!port || !/^\d{2,5}$/.test(port)) {
    msg.innerHTML = '<span class="err">This page only works when opened by the LazyDog Editor app.</span>';
    btn.style.display = 'none';
  }

  btn.onclick = async () => {
    btn.disabled = true;
    msg.textContent = 'Signing in…';
    try {
      const app = getApps().length ? getApp() : initializeApp(FB_CONFIG);
      const auth = getAuth(app);
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      msg.textContent = 'Connecting to the app…';
      const idTok = await cred.user.getIdToken();
      /* POST, not GET — the functions' CORS policy only allows POST/OPTIONS */
      const r = await fetch(MINT_URL, { method: 'POST', headers: { Authorization: 'Bearer ' + idTok } });
      if (!r.ok) throw new Error('token service said ' + r.status);
      const d = await r.json();
      /* hand the custom token to the app over loopback — 127.0.0.1 only */
      const h = await fetch('http://127.0.0.1:' + port + '/token', {
        method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: d.token
      });
      if (!h.ok) throw new Error('the app did not answer');
      msg.innerHTML = '<span class="ok">Signed in ✓ — you can close this tab and return to the LazyDog Editor app.</span>';
      btn.style.display = 'none';
    } catch (e) {
      btn.disabled = false;
      msg.innerHTML = '<span class="err">Sign-in failed: ' + (e.message || e) + '</span><br>Try again.';
    }
  };
</script>
</body>
</html>
